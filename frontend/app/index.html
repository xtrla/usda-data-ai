<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgraX Pro — Morning Brief</title>
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-white-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-white-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-white-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-white-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/components.css" />
<script src="/js/config.js"></script>
<script src="/js/util.js"></script>
<script src="/js/api.js"></script>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header class="header">
  <div class="header__inner">
    <a href="/" class="header__logo">
      <div class="header__logo-mark">A</div>
      <span class="header__logo-word">AgraX</span>
    </a>
    <nav class="header__nav">
      <a href="/browse" class="header__link">Browse</a>
      <a href="/app" class="header__link header__link--pro" style="color:#fff">Pro</a>
      <div class="header__profile" id="user-avatar">?</div>
    </nav>
  </div>
</header>

<div style="max-width:var(--max-content);margin:0 auto;padding:26px 28px 80px;display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start">

  <!-- ═══════════ MAIN ═══════════ -->
  <main style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <!-- Morning header -->
    <div style="margin-bottom:8px">
      <div style="font-size:var(--fs-sm);font-weight:var(--fw-extrabold);text-transform:uppercase;letter-spacing:var(--ls-eyebrow);color:var(--text-faint)" id="brief-time">Morning brief</div>
      <h1 style="font-size:var(--fs-5xl);font-weight:var(--fw-bold);margin-top:6px" id="brief-headline">Loading…</h1>
    </div>

    <!-- Today in one line -->
    <div class="today-stats" id="today-stats">
      <div class="today-stat">
        <div class="today-stat__val mono" id="ts-action" style="color:var(--warn)">—</div>
        <div class="today-stat__label">items need action</div>
      </div>
      <div class="today-stat">
        <div class="today-stat__val mono" id="ts-exposure" style="color:var(--down)">—</div>
        <div class="today-stat__label">week-over-week exposure</div>
      </div>
      <div class="today-stat">
        <div class="today-stat__val mono" id="ts-savings" style="color:var(--up)">—</div>
        <div class="today-stat__label">savings available</div>
      </div>
    </div>

    <!-- Action cards -->
    <div style="display:flex;flex-direction:column;gap:14px" id="action-cards">
      <div style="padding:20px;text-align:center;color:var(--text-muted)">Loading action cards…</div>
    </div>
  </main>

  <!-- ═══════════ RIGHT RAIL ═══════════ -->
  <aside style="position:sticky;top:calc(var(--header-h) + 24px)">
    <!-- Profile setup -->
    <div class="card" style="margin-bottom:16px;padding:18px">
      <div style="font-size:var(--fs-md);font-weight:var(--fw-bold);margin-bottom:8px">Your profile</div>
      <div style="font-size:var(--fs-base2);color:var(--text-muted);margin-bottom:12px">Tell AgraX what you buy for personalized signals.</div>
      <button class="btn btn--xs btn--blue" id="open-profile" style="width:100%">Set up your items</button>
    </div>

    <!-- Watchlist -->
    <div class="card" style="overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border-header);font-size:var(--fs-md);font-weight:var(--fw-bold);display:flex;align-items:center;gap:8px">
        Your items <span style="font-family:var(--font-mono);font-size:var(--fs-base);color:var(--text-muted)" id="watch-count">0</span>
      </div>
      <div id="watch-rail" style="max-height:500px;overflow-y:auto"></div>
    </div>
  </aside>
</div>

<!-- ═══════════ FOOTER ═══════════ -->
<footer class="footer">
  <div class="footer__inner">
    <div class="footer__logo">
      <div class="footer__logo-mark">A</div>
      <span class="footer__logo-word">AgraX</span>
    </div>
    <div class="footer__links">
      <a href="/">Home</a><a href="/browse">Browse</a><a href="/app">Pro</a>
    </div>
    <span class="footer__copy">© 2026 AgraX. Data source: USDA AMS.</span>
  </div>
</footer>

<script>
(async function() {
  const U = window.agraxUtil;
  const api = window.agraxAPI;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Time
  const now = new Date();
  document.getElementById('brief-time').textContent = `Morning brief · ${now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}`;

  const market = U.selMarket() || 'New York';
  const watchItems = U.watchList();

  try {
    const dates = await api.dates();
    if (!dates?.length) throw new Error('No data');
    const latestDate = dates[0].date;
    const allRows = await api.reportTerminal(latestDate);
    const marketRows = allRows.filter(r => r.market === market);
    const byCom = U.groupBy(marketRows, r => r.commodity);

    // FOB data for markup comparison
    let fobRows = [];
    try { fobRows = await api.reportShippingPoints(latestDate); } catch(e) {}
    const fobLookup = new Map();
    for (const r of fobRows) {
      const price = U.rowMostly(r);
      if (price != null && !fobLookup.has(r.commodity)) fobLookup.set(r.commodity, { price, origin: r.origin || '—' });
    }

    // Build action cards from watchlist items (or all items if no watchlist)
    const itemsToAnalyze = watchItems.length ? watchItems : Array.from(byCom.keys()).slice(0, 6);
    const actions = [];
    let actionCount = 0, exposure = 0, savings = 0;

    for (const name of itemsToAnalyze) {
      const rows = byCom.get(name);
      if (!rows) continue;
      const agg = U.aggregateCommodity(rows);
      if (agg.mostly == null) continue;
      const fob = fobLookup.get(name);
      const primary = rows[0];
      const trend = primary.trend;

      // Determine action type
      if (fob && agg.mostly != null) {
        const markup = ((agg.mostly - fob.price) / fob.price * 100);
        if (markup > 60) {
          actionCount++;
          const savAmt = (agg.mostly - fob.price) * 0.1;
          savings += savAmt;
          actions.push({
            kind: 'SUPPLIER MARGIN',
            action: 'Negotiate',
            accent: 'warn',
            name: name,
            text: `${esc(name)} at ${market} is $${agg.mostly.toFixed(2)} wholesale. FOB at ${esc(fob.origin)} is $${fob.price.toFixed(2)} — a ${markup.toFixed(0)}% markup. If your supplier is near wholesale, there may be room to negotiate.`,
            source: `USDA Terminal · ${U.fmtDate(latestDate)}`
          });
        }
      }

      if (trend === 'up') {
        actionCount++;
        exposure += agg.mostly * 0.05;
        actions.push({
          kind: 'SUPPLY SHIFT',
          action: 'Buy ahead',
          accent: 'up',
          name: name,
          text: `${esc(name)} prices are trending higher at ${market}. Current wholesale is $${agg.mostly.toFixed(2)}. Consider buying ahead if you expect continued tightening.`,
          source: `USDA Terminal · ${U.fmtDate(latestDate)}`
        });
      }

      if (trend === 'down') {
        actions.push({
          kind: 'PRICE DROP',
          action: 'Adjust today',
          accent: 'down',
          name: name,
          text: `${esc(name)} is trending lower at ${market}. Wholesale is $${agg.mostly.toFixed(2)}. Check if your open invoices on this item need attention.`,
          source: `USDA Terminal · ${U.fmtDate(latestDate)}`
        });
      }
    }

    // Headline
    const totalItems = watchItems.length || byCom.size;
    document.getElementById('brief-headline').textContent = actions.length
      ? `${Math.min(actions.length, totalItems)} of your ${totalItems} items need action today.`
      : `All ${totalItems} items look steady today.`;

    // Stats
    document.getElementById('ts-action').textContent = `${actionCount} of ${totalItems}`;
    document.getElementById('ts-exposure').textContent = exposure > 0 ? `$${Math.round(exposure).toLocaleString()}` : '$0';
    document.getElementById('ts-savings').textContent = savings > 0 ? `$${Math.round(savings).toLocaleString()}` : '$0';

    // Render action cards
    const cardsEl = document.getElementById('action-cards');
    if (actions.length === 0) {
      cardsEl.innerHTML = `<div class="card" style="padding:24px;text-align:center;color:var(--text-muted)">No action items today. Your items are steady.</div>`;
    } else {
      cardsEl.innerHTML = actions.slice(0, 6).map(a => `
        <div class="action-card">
          <div class="action-card__accent action-card__accent--${a.accent}"></div>
          <div class="action-card__body">
            <div class="action-card__kind">${a.kind}</div>
            <div class="action-card__item">${esc(a.name)}</div>
            <div class="action-card__chip action-card__chip--${a.accent}">${a.action}</div>
            <div class="action-card__text">${a.text}</div>
            <div class="action-card__source">${a.source}</div>
          </div>
        </div>
      `).join('');
    }

    // Right rail watchlist
    document.getElementById('watch-count').textContent = watchItems.length;
    const railEl = document.getElementById('watch-rail');
    if (!watchItems.length) {
      railEl.innerHTML = `<div style="padding:16px;font-size:var(--fs-base2);color:var(--text-muted)">Add items from the <a href="/browse" style="color:var(--blue)">Browse</a> page to see them here.</div>`;
    } else {
      railEl.innerHTML = watchItems.map(name => {
        const rows = byCom.get(name);
        const skuCount = rows ? rows.length : 0;
        const movement = rows?.[0]?.movement || rows?.[0]?.trend || '';
        const mLower = movement.toLowerCase();
        const trendLabel = mLower.includes('higher') || mLower === 'up' ? 'Higher'
          : mLower.includes('lower') || mLower === 'down' ? 'Lower' : 'Steady';
        const trendMod = trendLabel === 'Higher' ? 'higher' : trendLabel === 'Lower' ? 'lower' : 'steady';
        return `<div class="pro-watch-item" onclick="window.location='/app/commodity?c=${encodeURIComponent(name)}&market=${encodeURIComponent(market)}'">
          <div class="pro-watch-item__top">
            <span class="pro-watch-item__name">${esc(name)}</span>
            <span class="sku-count">${skuCount} SKUs</span>
            <span class="trend-badge trend-badge--${trendMod}" style="font-size:9.5px;padding:2px 6px">${trendLabel}</span>
          </div>
        </div>`;
      }).join('');
    }

  } catch (err) {
    document.getElementById('brief-headline').textContent = 'Could not load data.';
    document.getElementById('action-cards').innerHTML = `<div class="err-banner">${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
