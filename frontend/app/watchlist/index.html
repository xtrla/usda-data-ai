<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agraX — Watchlist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%230A0B0A'/%3E%3Ccircle cx='18' cy='18' r='4' fill='%2315A24A'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/components.css" />
</head>
<body>

<div class="app">
  <div id="mtop-slot"></div>
  <div id="side-slot"></div>

  <main class="main">
    <div class="msub">
      <div class="msub__chip"><span class="dot"></span><span id="mkt-mobile">—</span> ▾</div>
    </div>
    <div class="topbar">
      <div class="topbar__search"><span>🔍</span>Search…<span class="topbar__kbd">⌘K</span></div>
      <div class="topbar__selector"><span class="topbar__dot"></span><span id="mkt-desktop">—</span><span class="topbar__chev">▾</span></div>
      <div class="topbar__bell">🔔</div>
    </div>

    <div class="page-head">
      <div class="page-head__row">
        <div>
          <div class="eyebrow">Your list · updated <span id="upd-time">—</span></div>
          <h1>Watchlist</h1>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <a href="/app/markets" class="btn btn--ghost">Browse commodities</a>
        </div>
      </div>
    </div>

    <div class="stat-strip">
      <div class="kpi"><div class="kpi__lbl">Watched</div><div class="kpi__val" id="k-total">0</div></div>
      <div class="kpi kpi--pos"><div class="kpi__lbl">Down</div><div class="kpi__val" id="k-down">0</div></div>
      <div class="kpi kpi--neg"><div class="kpi__lbl">Up</div><div class="kpi__val" id="k-up">0</div></div>
      <div class="kpi"><div class="kpi__lbl">Steady</div><div class="kpi__val" id="k-flat">0</div></div>
    </div>

    <section class="card card--flush">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th></th><th>Commodity</th><th class="r">Low</th><th class="r">High</th><th class="r">Mostly</th><th class="r">Chg</th><th></th>
            </tr>
          </thead>
          <tbody id="w-tbody">
            <tr><td colspan="7" style="padding:24px;text-align:center;color:var(--muted);font-size:12px">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div id="err-slot"></div>
  </main>

  <div id="mtabs-slot"></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script>
(async function() {
  const U = window.agraxUtil;
  const shell = Shell.render('watchlist');
  document.getElementById('mtop-slot').outerHTML = shell.mtop;
  document.getElementById('side-slot').outerHTML = shell.side;
  document.getElementById('mtabs-slot').outerHTML = shell.mtabs;

  const watch = U.watchList();
  document.getElementById('k-total').textContent = watch.length;

  if (!watch.length) {
    document.getElementById('w-tbody').innerHTML = `<tr><td colspan="7" style="padding:40px;text-align:center;color:var(--muted);font-size:13px">
      No commodities watched yet.<br>
      <a href="/app/markets" style="color:var(--pop);font-weight:500;margin-top:8px;display:inline-block">Browse markets to add →</a>
    </td></tr>`;
    return;
  }

  let today = [], prev = [];
  try {
    const dates = await agraxAPI.dates();
    const latest = dates[0]?.date;
    const previous = dates[1]?.date;
    document.getElementById('upd-time').textContent = fmtDate(latest);
    today = await agraxAPI.reportTerminal(latest);
    if (previous) prev = await agraxAPI.reportTerminal(previous);
  } catch (err) { return showError(err); }

  const market = U.selMarket();
  document.getElementById('mkt-desktop').textContent = market;
  document.getElementById('mkt-mobile').textContent = market;

  const todayInMkt = today.filter(r => r.market === market);
  const prevInMkt = prev.filter(r => r.market === market);
  const todayBy = U.groupBy(todayInMkt, r => r.commodity);
  const prevBy = U.groupBy(prevInMkt, r => r.commodity);

  let downN = 0, upN = 0, flatN = 0;
  const rows = watch.map(name => {
    const rs = todayBy.get(name);
    if (!rs) return { name, missing: true };
    const agg = U.aggregateCommodity(rs);
    const prevAgg = prevBy.has(name) ? U.aggregateCommodity(prevBy.get(name)) : null;
    const d = U.delta(agg.mostly, prevAgg?.mostly);
    if (d.dir === 'down') downN++;
    else if (d.dir === 'up') upN++;
    else if (d.dir === 'flat') flatN++;
    return { name, cat: rs[0]?.commodity_type, agg, pct: d.pct, dir: d.dir };
  });
  document.getElementById('k-down').textContent = downN;
  document.getElementById('k-up').textContent = upN;
  document.getElementById('k-flat').textContent = flatN;

  document.getElementById('w-tbody').innerHTML = rows.map(r => {
    if (r.missing) {
      return `<tr>
        <td style="color:var(--pop)">★</td>
        <td class="strong">${escape(r.name)}</td>
        <td class="r" colspan="4" style="color:var(--muted)">No data in ${escape(market)} today</td>
        <td class="r"><button class="btn btn--tiny btn--ghost" data-remove="${escape(r.name)}">Remove</button></td>
      </tr>`;
    }
    const chg = U.fmtDelta(r.pct);
    const chgCls = chg.dir === 'down' ? 'chg-down' : chg.dir === 'up' ? 'chg-up' : 'chg-flat';
    return `<tr>
      <td style="color:var(--pop)">★</td>
      <td class="strong">
        <div style="display:flex;align-items:center;gap:6px"><span class="cat-dot cat-dot--${U.catClass(r.cat)}"></span>${escape(r.name)}</div>
      </td>
      <td class="r">${r.agg.low != null ? r.agg.low.toFixed(2) : '—'}</td>
      <td class="r">${r.agg.high != null ? r.agg.high.toFixed(2) : '—'}</td>
      <td class="r strong">${U.fmtPrice(r.agg.mostly)}</td>
      <td class="r ${chgCls}">${chg.text}</td>
      <td class="r"><button class="btn btn--tiny btn--ghost" data-remove="${escape(r.name)}">Remove</button></td>
    </tr>`;
  }).join('');

  document.getElementById('w-tbody').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    U.watchToggle(btn.dataset.remove);
    location.reload();
  });

  function fmtDate(iso) { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function escape(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function showError(err) {
    const el = document.createElement('div');
    el.className = 'err-banner';
    el.innerHTML = `<span class="err-banner__icn">!</span><span><b>Couldn't load.</b> ${escape(String(err.message || err))}</span>`;
    document.getElementById('err-slot').appendChild(el);
  }
})();
</script>
</body>
</html>
