<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agraX — Commodity Detail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%230A0B0A'/%3E%3Ccircle cx='18' cy='18' r='4' fill='%2315A24A'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/components.css" />
<style>
  /* Chart panel */
  .chart-card {
    background: var(--card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-card);
    padding: 20px 22px 12px;
    position: relative;
    overflow: hidden;
  }
  .chart-hd {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .chart-hd__title {
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .range-toggle {
    display: inline-flex;
    background: var(--fill);
    padding: 3px;
    border-radius: 9px;
    gap: 2px;
    margin-left: auto;
  }
  .range-toggle__opt {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    color: var(--sub);
    cursor: pointer;
    font-family: var(--font-mono);
    font-weight: 500;
  }
  .range-toggle__opt.is-active {
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .chart-wrap { position: relative; height: 240px; }
  .chart-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .chart-band { fill: var(--pop-14); }
  .chart-line { fill: none; stroke: var(--pop); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-axis-lbl { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }
  .chart-hover-dot { fill: var(--pop); stroke: #fff; stroke-width: 2; }
  .chart-hover-line { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart-tip {
    position: absolute;
    background: var(--dark-1);
    color: #fff;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    white-space: nowrap;
    font-family: var(--font-mono);
    opacity: 0;
    transition: opacity 100ms;
    z-index: 5;
  }
  .chart-tip b { color: var(--pop-glow); }
  .chart-empty {
    height: 240px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
    padding: 20px;
  }

  /* Grid layout */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--sp-5);
  }
  @media(min-width: 900px){
    .grid-2 { grid-template-columns: 1.4fr 1fr; }
  }

  /* Related SKUs list */
  .rel-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-top: 0.5px solid var(--line-softer);
    font-size: 12.5px;
    cursor: pointer;
    transition: background var(--dur-fast);
  }
  .rel-item:first-child { border-top: none; }
  .rel-item:hover { background: var(--card-alt); }
  .rel-item.is-current {
    background: var(--pop-04);
    border-left: 2px solid var(--pop);
    padding-left: 12px;
  }
  .rel-item__name { flex: 1; }
  .rel-item__spec { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .rel-item__price { font-family: var(--font-mono); font-weight: 500; }

  /* Cross-market compact */
  table.cx-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.cx-tbl thead tr { color: var(--muted); background: var(--card-alt); border-bottom: 0.5px solid var(--line-soft); }
  table.cx-tbl th { text-align: left; font-weight: 500; padding: 8px 14px; font-size: 11px; }
  table.cx-tbl th.r { text-align: right; }
  table.cx-tbl td { padding: 9px 14px; border-top: 0.5px solid var(--line-softer); font-size: 12px; }
  table.cx-tbl td.r { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  table.cx-tbl tr.is-best td:first-child { border-left: 2px solid var(--pop); padding-left: 12px; }

  /* Info tiles */
  .info-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: 12px 14px;
    background: var(--card-alt);
    border-radius: 8px;
  }
  @media(min-width: 640px){ .info-row { grid-template-columns: repeat(4, 1fr); } }
  .info-row .kpi { background: transparent; border: none; padding: 0; }
  .info-row .kpi__val { font-size: 15px; }

  /* USDA context callout */
  .quote-card {
    background: linear-gradient(90deg, var(--pop-04), transparent);
    border: 0.5px solid var(--pop-13);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12.5px;
    color: var(--sub);
    line-height: 1.55;
  }
  .quote-card b { color: var(--ink); font-weight: 600; }
  .quote-card__src {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 6px;
    display: block;
  }
</style>
</head>
<body>

<div class="app">
  <div id="mtop-slot"></div>
  <div id="side-slot"></div>

  <main class="main">
    <div class="topbar">
      <div class="topbar__search"><span>🔍</span>Search…<span class="topbar__kbd">⌘K</span></div>
      <div class="topbar__bell">🔔</div>
    </div>

    <div class="breadcrumb">
      <a href="/app/markets" style="color:var(--muted)">← Terminal markets</a>
      <span>·</span>
      <span id="bc-cat">—</span>
      <span>·</span>
      <span class="breadcrumb__now" id="bc-name">—</span>
    </div>

    <!-- Header -->
    <div class="detail-head">
      <div>
        <div class="detail-head__name" id="d-name">Loading…</div>
        <div class="detail-head__meta" id="d-meta">—</div>
      </div>
      <div class="detail-head__price-block">
        <div class="detail-head__price" id="d-price">—</div>
        <div id="d-delta-wrap"></div>
        <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-start" id="d-actions">
          <button class="btn btn--tiny btn--ghost" id="btn-watch">★ Watch</button>
          <button class="btn btn--tiny btn--dark" id="btn-alert">⚡ Set alert</button>
        </div>
      </div>
    </div>

    <div id="err-slot"></div>

    <!-- Chart -->
    <section class="chart-card" style="margin-bottom:var(--sp-5)">
      <div class="chart-hd">
        <div class="chart-hd__title"><span style="color:var(--pop)">◐</span>Price history <span style="color:var(--muted);font-weight:400;font-size:11px" id="chart-scope">—</span></div>
        <div class="range-toggle" id="range-toggle">
          <span class="range-toggle__opt" data-days="7">7d</span>
          <span class="range-toggle__opt is-active" data-days="30">30d</span>
          <span class="range-toggle__opt" data-days="90">90d</span>
          <span class="range-toggle__opt" data-days="365">1y</span>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <div class="chart-empty">Loading chart…</div>
      </div>
      <div class="chart-tip" id="chart-tip"></div>
    </section>

    <!-- Cross-market + Related SKUs -->
    <div class="grid-2" style="margin-bottom:var(--sp-5)">
      <section class="card card--flush">
        <div class="card-title" style="padding:14px 16px 0"><span class="card-title__ico">◈</span>Across markets today</div>
        <div style="padding:8px 0 0">
          <div class="table-wrap">
            <table class="cx-tbl">
              <thead>
                <tr><th>Market</th><th class="r">Low</th><th class="r">High</th><th class="r">Mostly ▲</th></tr>
              </thead>
              <tbody id="cx-tbody">
                <tr><td colspan="4" style="padding:20px;text-align:center;color:var(--muted);font-size:12px">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="card card--flush">
        <div class="card-title" style="padding:14px 16px 6px"><span class="card-title__ico">◇</span>Related SKUs<span class="card-title__meta" id="rel-meta">—</span></div>
        <div id="rel-body">
          <div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">Loading…</div>
        </div>
      </section>
    </div>

    <!-- Movement + Context -->
    <div class="grid-2" style="margin-bottom:var(--sp-8)">
      <section class="card">
        <div class="card-title"><span class="card-title__ico">◆</span>Movement · today<span class="card-title__meta" id="mv-meta">—</span></div>
        <div id="mv-body">
          <div style="font-size:12px;color:var(--muted);padding:8px 0">Loading…</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title"><span class="card-title__ico">◇</span>USDA context</div>
        <div id="ctx-body">
          <div style="font-size:12px;color:var(--muted);padding:8px 0">Loading…</div>
        </div>
      </section>
    </div>

  </main>

  <div id="mtabs-slot"></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script>
(async function() {
  const U = window.agraxUtil;
  const shell = Shell.render('markets');
  document.getElementById('mtop-slot').outerHTML = shell.mtop;
  document.getElementById('side-slot').outerHTML = shell.side;
  document.getElementById('mtabs-slot').outerHTML = shell.mtabs;

  const filters = U.readDetailFilters();
  // The URL slug is a slugified commodity name — we need the actual name.
  // Strategy: fetch latest terminal data, match commodity by slug.
  let latestDate, terminalRows = [], prevRows = [];
  try {
    const dates = await agraxAPI.dates();
    if (!dates?.length) throw new Error('No data available');
    latestDate = dates[0].date;
    terminalRows = await agraxAPI.reportTerminal(latestDate);
    if (dates[1]) prevRows = await agraxAPI.reportTerminal(dates[1].date);
  } catch (err) { return showError(err); }

  // Resolve slug → actual commodity name
  const commodityNames = U.uniq(terminalRows.map(r => r.commodity));
  const commodity = commodityNames.find(n => U.slugify(n) === filters.slug);
  if (!commodity) {
    return showError({ message: `Unknown commodity: ${filters.slug}` });
  }

  // All rows for this commodity today
  const allRows = terminalRows.filter(r => r.commodity === commodity);
  const cat = allRows[0]?.commodity_type;

  // Apply filters to get the "focused" set for header + chart
  const focused = allRows.filter(r => {
    if (filters.variety && r.variety !== filters.variety) return false;
    if (filters.origin && r.origin !== filters.origin) return false;
    if (filters.size && r.size !== filters.size) return false;
    if (filters.package && r.package !== filters.package) return false;
    if (filters.market && r.market !== filters.market) return false;
    return true;
  });

  // ── HEADER ──
  document.getElementById('bc-cat').textContent = U.catLabel(cat);
  document.getElementById('bc-name').textContent = commodity;

  const scopeParts = [
    filters.variety && filters.variety,
    filters.origin && filters.origin,
    filters.size && filters.size,
    filters.market && filters.market,
  ].filter(Boolean);
  const scopeText = scopeParts.length ? scopeParts.join(' · ') : 'All varieties · All markets';

  document.getElementById('d-name').textContent = filters.variety ? `${filters.variety} ${commodity}` : commodity;
  document.getElementById('d-meta').textContent = scopeText;
  document.getElementById('chart-scope').textContent = `· ${scopeText}`;

  // Focused price + delta
  const focusedAgg = focused.length ? U.aggregateCommodity(focused) : null;
  const prevFocused = prevRows.filter(r => {
    if (r.commodity !== commodity) return false;
    if (filters.variety && r.variety !== filters.variety) return false;
    if (filters.origin && r.origin !== filters.origin) return false;
    if (filters.size && r.size !== filters.size) return false;
    if (filters.package && r.package !== filters.package) return false;
    if (filters.market && r.market !== filters.market) return false;
    return true;
  });
  const prevAgg = prevFocused.length ? U.aggregateCommodity(prevFocused) : null;
  const d = U.delta(focusedAgg?.mostly, prevAgg?.mostly);

  document.getElementById('d-price').textContent = focusedAgg?.mostly != null
    ? U.fmtPrice(focusedAgg.mostly)
    : (focusedAgg?.low != null ? U.fmtPrice(focusedAgg.low) : '—');

  const deltaWrap = document.getElementById('d-delta-wrap');
  if (d.pct != null) {
    const arrow = d.dir === 'up' ? '▲' : d.dir === 'down' ? '▼' : '—';
    const color = d.dir === 'up' ? 'var(--up)' : d.dir === 'down' ? 'var(--pop)' : 'var(--muted)';
    deltaWrap.innerHTML = `<span class="detail-head__delta" style="color:${color};background:transparent;border-color:${color}33">${arrow} ${Math.abs(d.pct).toFixed(1)}% vs yesterday</span>`;
  }

  // Watch button — scope to variety-level for now
  const watchKey = filters.variety ? `${filters.variety} ${commodity}` : commodity;
  function updateWatchBtn() {
    const btn = document.getElementById('btn-watch');
    const isW = U.watchHas(watchKey);
    btn.textContent = isW ? '★ Watching' : '★ Watch';
    btn.classList.toggle('btn--dark', isW);
    btn.classList.toggle('btn--ghost', !isW);
  }
  updateWatchBtn();
  document.getElementById('btn-watch').addEventListener('click', () => {
    U.watchToggle(watchKey);
    updateWatchBtn();
  });

  // ── CHART ──
  let currentDays = 30;
  document.getElementById('range-toggle').addEventListener('click', (e) => {
    const opt = e.target.closest('[data-days]');
    if (!opt) return;
    document.querySelectorAll('#range-toggle .range-toggle__opt').forEach(x => x.classList.toggle('is-active', x === opt));
    currentDays = parseInt(opt.dataset.days, 10);
    loadChart();
  });
  loadChart();

  async function loadChart() {
    const wrap = document.getElementById('chart-wrap');
    wrap.innerHTML = '<div class="chart-empty">Loading chart…</div>';
    try {
      const historyRows = await agraxAPI.history({
        commodity,
        variety: filters.variety,
        origin: filters.origin,
        size: filters.size,
        package: filters.package,
        market: filters.market,
        days: currentDays,
      });
      renderChart(historyRows);
    } catch (err) {
      wrap.innerHTML = `<div class="chart-empty">Couldn't load history: ${escape(err.message || err)}</div>`;
    }
  }

  function renderChart(rows) {
    const wrap = document.getElementById('chart-wrap');
    if (!rows?.length) {
      wrap.innerHTML = `<div class="chart-empty">No history for this ${filters.market ? 'market' : 'combination'} in the last ${currentDays} days.<br>USDA reports don't have data every day for every SKU.</div>`;
      return;
    }
    // Group by date, take median-mostly per date
    const byDate = U.groupBy(rows, r => r.report_date);
    const points = [];
    for (const [date, rs] of byDate) {
      const agg = U.aggregateCommodity(rs);
      if (agg.mostly != null) {
        points.push({ date, low: agg.low, high: agg.high, mostly: agg.mostly });
      } else if (agg.low != null || agg.high != null) {
        const val = agg.low != null && agg.high != null ? (agg.low + agg.high) / 2 : (agg.low ?? agg.high);
        points.push({ date, low: agg.low, high: agg.high, mostly: val });
      }
    }
    points.sort((a, b) => a.date.localeCompare(b.date));

    if (!points.length) {
      wrap.innerHTML = `<div class="chart-empty">No price data in this range.</div>`;
      return;
    }
    if (points.length === 1) {
      wrap.innerHTML = `<div class="chart-empty">Only 1 data point in range · $${points[0].mostly.toFixed(2)} on ${points[0].date}</div>`;
      return;
    }

    // Build SVG
    const W = wrap.clientWidth || 800;
    const H = 240;
    const P = { l: 40, r: 12, t: 16, b: 24 };
    const iw = W - P.l - P.r;
    const ih = H - P.t - P.b;

    const allVals = points.flatMap(p => [p.low, p.high, p.mostly].filter(v => v != null));
    let vMin = Math.min(...allVals), vMax = Math.max(...allVals);
    const vPad = (vMax - vMin) * 0.1 || vMax * 0.1 || 1;
    vMin -= vPad; vMax += vPad;

    const x = (i) => P.l + (i / (points.length - 1)) * iw;
    const y = (v) => P.t + (1 - (v - vMin) / (vMax - vMin)) * ih;

    // Band path (low to high)
    const bandUp = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i)},${y(p.high ?? p.mostly)}`).join(' ');
    const bandDn = points.slice().reverse().map((p, i, arr) => `L${x(points.length - 1 - i)},${y(p.low ?? p.mostly)}`).join(' ');
    const bandPath = `${bandUp} ${bandDn} Z`;

    // Line path (mostly)
    const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i)},${y(p.mostly)}`).join(' ');

    // Y-axis labels (min, mid, max)
    const yLabels = [vMax, (vMax + vMin) / 2, vMin].map(v => `
      <text class="chart-axis-lbl" x="${P.l - 6}" y="${y(v) + 3}" text-anchor="end">$${v.toFixed(0)}</text>
      <line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-softer)" stroke-width="0.5"/>
    `).join('');

    // X-axis labels (first, mid, last)
    const dLabels = [];
    const idxs = points.length > 6 ? [0, Math.floor(points.length / 2), points.length - 1] : points.map((_, i) => i);
    for (const i of idxs) {
      const d = new Date(points[i].date);
      const lbl = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      dLabels.push(`<text class="chart-axis-lbl" x="${x(i)}" y="${H - 6}" text-anchor="middle">${lbl}</text>`);
    }

    wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${yLabels}
      <path class="chart-band" d="${bandPath}"/>
      <path class="chart-line" d="${linePath}"/>
      <g id="chart-dots"></g>
      ${dLabels.join('')}
      <rect id="chart-overlay" x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>
    </svg>`;

    // Hover
    const svg = wrap.querySelector('svg');
    const overlay = wrap.querySelector('#chart-overlay');
    const dotsG = wrap.querySelector('#chart-dots');
    const tip = document.getElementById('chart-tip');

    overlay.addEventListener('mousemove', (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (W / rect.width);
      const i = Math.max(0, Math.min(points.length - 1, Math.round(((px - P.l) / iw) * (points.length - 1))));
      const p = points[i];
      const cx = x(i), cy = y(p.mostly);
      dotsG.innerHTML = `
        <line class="chart-hover-line" x1="${cx}" y1="${P.t}" x2="${cx}" y2="${P.t + ih}"/>
        <circle class="chart-hover-dot" cx="${cx}" cy="${cy}" r="4"/>
      `;
      const wrapRect = wrap.getBoundingClientRect();
      const tipX = (cx / W) * wrapRect.width;
      tip.style.left = `${Math.min(wrapRect.width - 120, Math.max(0, tipX - 60))}px`;
      tip.style.top = `${(cy / H) * wrapRect.height - 34}px`;
      const d = new Date(p.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      tip.innerHTML = `${d} · <b>$${p.mostly.toFixed(2)}</b>`;
      tip.style.opacity = '1';
    });
    overlay.addEventListener('mouseleave', () => {
      dotsG.innerHTML = '';
      tip.style.opacity = '0';
    });
  }

  // ── CROSS-MARKET (today) ──
  // If a specific market is selected in filters, still show all markets for comparison but highlight the selected one
  const cxRows = allRows.filter(r => {
    if (filters.variety && r.variety !== filters.variety) return false;
    if (filters.origin && r.origin !== filters.origin) return false;
    if (filters.size && r.size !== filters.size) return false;
    if (filters.package && r.package !== filters.package) return false;
    return true;
  });
  const cxByMarket = U.groupBy(cxRows, r => r.market);
  const perMarket = [];
  for (const [mkt, rs] of cxByMarket) {
    const agg = U.aggregateCommodity(rs);
    perMarket.push({ market: mkt, ...agg });
  }
  perMarket.sort((a, b) => (a.mostly ?? Infinity) - (b.mostly ?? Infinity));

  const cxBody = document.getElementById('cx-tbody');
  if (!perMarket.length) {
    cxBody.innerHTML = `<tr><td colspan="4" style="padding:20px;text-align:center;color:var(--muted);font-size:12px">No markets have this exact SKU today.</td></tr>`;
  } else {
    cxBody.innerHTML = perMarket.map((r, idx) => {
      const isBest = idx === 0 && r.mostly != null;
      const isSelected = filters.market === r.market;
      return `<tr class="${isBest ? 'is-best' : ''}" style="${isSelected ? 'background:var(--pop-04)' : ''}">
        <td><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pop);margin-right:6px;vertical-align:middle"></span>${escape(r.market)}${isBest ? '<span class="best-tag">Best</span>' : ''}</td>
        <td class="r">${r.low != null ? r.low.toFixed(2) : '—'}</td>
        <td class="r">${r.high != null ? r.high.toFixed(2) : '—'}</td>
        <td class="r" style="font-weight:600">${r.mostly != null ? r.mostly.toFixed(2) : '—'}</td>
      </tr>`;
    }).join('');
  }

  // ── RELATED SKUs (sibling products in the same commodity) ──
  // Within the same market (if filtered), or across markets otherwise
  const relScope = filters.market ? allRows.filter(r => r.market === filters.market) : allRows;
  // Group by unique variety+origin+size combos
  const skuKey = (r) => [r.variety || '', r.origin || '', r.size || '', r.package || ''].join('|');
  const bySku = U.groupBy(relScope, skuKey);
  const relatedSkus = [];
  for (const [key, rs] of bySku) {
    const [variety, origin, size, pkg] = key.split('|');
    const agg = U.aggregateCommodity(rs);
    if (agg.mostly == null && agg.low == null) continue;
    const isCurrent =
      (variety === (filters.variety || '')) &&
      (origin === (filters.origin || '')) &&
      (size === (filters.size || '')) &&
      (pkg === (filters.package || ''));
    relatedSkus.push({ variety, origin, size, pkg, agg, isCurrent, rowCount: rs.length });
  }
  relatedSkus.sort((a, b) => (a.agg.mostly ?? a.agg.low ?? Infinity) - (b.agg.mostly ?? b.agg.low ?? Infinity));

  document.getElementById('rel-meta').textContent = `${relatedSkus.length} variant${relatedSkus.length === 1 ? '' : 's'}`;
  const relBody = document.getElementById('rel-body');
  if (!relatedSkus.length) {
    relBody.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">No variants.</div>`;
  } else {
    relBody.innerHTML = relatedSkus.slice(0, 12).map(s => {
      const name = s.variety || 'Standard';
      const spec = [s.origin, s.size, s.pkg].filter(Boolean).join(' · ') || '—';
      const price = s.agg.mostly != null ? U.fmtPrice(s.agg.mostly)
        : s.agg.low != null ? U.fmtPrice(s.agg.low) : '—';
      const url = U.detailURL({
        commodity,
        variety: s.variety || null,
        origin: s.origin || null,
        size: s.size || null,
        package: s.pkg || null,
        market: filters.market,
      });
      return `<a href="${url}" class="rel-item ${s.isCurrent ? 'is-current' : ''}" style="text-decoration:none;color:inherit">
        <div style="flex:1">
          <div class="rel-item__name">${escape(name)}</div>
          <div class="rel-item__spec">${escape(spec)}</div>
        </div>
        <span class="rel-item__price">${price}</span>
      </a>`;
    }).join('');
  }

  // ── MOVEMENT (if data exists for this commodity today) ──
  const mvBody = document.getElementById('mv-body');
  const mvMeta = document.getElementById('mv-meta');
  try {
    const mv = await agraxAPI.movementLatest();
    if (!mv?.rows?.length) {
      mvBody.innerHTML = `<div style="font-size:12px;color:var(--muted)">No movement data for this date.</div>`;
    } else {
      // Filter to this commodity (fuzzy match — movement uses different capitalization sometimes)
      const cLower = commodity.toLowerCase();
      const forThis = mv.rows.filter(r =>
        String(r.commodity || '').toLowerCase().includes(cLower) ||
        cLower.includes(String(r.commodity || '').toLowerCase())
      );
      if (!forThis.length) {
        mvBody.innerHTML = `<div style="font-size:12px;color:var(--muted)">No movement data for ${escape(commodity)} on ${mv.date}.</div>`;
        mvMeta.textContent = mv.date;
      } else {
        // Group by origin
        const totalLbs = forThis.reduce((s, r) => s + (r.total_pounds || 0), 0);
        const byOrigin = {};
        const byMode = {};
        for (const r of forThis) {
          const o = r.origin_name || r.origin_code || 'Unknown';
          const m = r.trans_mode_full || r.trans_mode || 'Unknown';
          byOrigin[o] = (byOrigin[o] || 0) + (r.total_pounds || 0);
          byMode[m] = (byMode[m] || 0) + (r.total_pounds || 0);
        }
        const originList = Object.entries(byOrigin).sort((a, b) => b[1] - a[1]).slice(0, 5);
        const modeList = Object.entries(byMode).sort((a, b) => b[1] - a[1]);

        mvMeta.textContent = mv.date;
        mvBody.innerHTML = `
          <div class="info-row">
            <div class="kpi"><div class="kpi__lbl">Total volume</div><div class="kpi__val">${fmtLbs(totalLbs)}</div></div>
            <div class="kpi"><div class="kpi__lbl">Origins</div><div class="kpi__val">${Object.keys(byOrigin).length}</div></div>
            <div class="kpi"><div class="kpi__lbl">Lots</div><div class="kpi__val">${forThis.length}</div></div>
            <div class="kpi"><div class="kpi__lbl">Top mode</div><div class="kpi__val" style="font-size:13px">${escape(modeList[0]?.[0] || '—')}</div></div>
          </div>
          <div style="margin-top:12px">
            <div style="font-size:10.5px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;margin-bottom:6px">Top origins by volume</div>
            ${originList.map(([o, lbs]) => {
              const pct = totalLbs ? (lbs / totalLbs) * 100 : 0;
              return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0">
                <span style="flex:1">${escape(o)}</span>
                <span class="mono" style="color:var(--muted)">${fmtLbs(lbs)}</span>
                <div class="bar" style="width:80px"><div style="width:${pct.toFixed(0)}%"></div></div>
              </div>`;
            }).join('')}
          </div>
        `;
      }
    }
  } catch (err) {
    mvBody.innerHTML = `<div style="font-size:12px;color:var(--muted)">Movement endpoint unavailable.</div>`;
  }

  // ── USDA CONTEXT (national trends) ──
  const ctxBody = document.getElementById('ctx-body');
  try {
    const trends = await agraxAPI.reportTrends(latestDate);
    const forThis = (trends || []).filter(r =>
      String(r.commodity || '').toLowerCase() === commodity.toLowerCase()
    );
    if (!forThis.length) {
      ctxBody.innerHTML = `<div style="font-size:12px;color:var(--muted)">No national trends commentary for ${escape(commodity)} today.</div>`;
    } else {
      ctxBody.innerHTML = forThis.slice(0, 3).map(r => {
        const note = r.supply_note || r.trading_activity || r.movement || '—';
        return `<div class="quote-card" style="margin-bottom:8px">
          <b>${escape(r.commodity)}</b> — ${escape(note)}
          <span class="quote-card__src">USDA ${escape(r.source_report || 'National Trends')} · ${escape(latestDate)}</span>
        </div>`;
      }).join('');
    }
  } catch (err) {
    ctxBody.innerHTML = `<div style="font-size:12px;color:var(--muted)">Context unavailable.</div>`;
  }

  // ── helpers ──
  function fmtLbs(lbs) {
    if (!lbs) return '0';
    if (lbs >= 1e6) return (lbs / 1e6).toFixed(1) + 'M lbs';
    if (lbs >= 1e3) return (lbs / 1e3).toFixed(0) + 'K lbs';
    return lbs.toFixed(0) + ' lbs';
  }
  function escape(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function showError(err) {
    const el = document.createElement('div');
    el.className = 'err-banner';
    el.innerHTML = `<span class="err-banner__icn">!</span><span><b>Couldn't load.</b> ${escape(String(err.message || err))}</span>`;
    document.getElementById('err-slot').appendChild(el);
  }
})();
</script>
</body>
</html>
