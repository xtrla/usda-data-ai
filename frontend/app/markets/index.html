<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agraX — Terminal Markets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%230A0B0A'/%3E%3Ccircle cx='18' cy='18' r='4' fill='%2315A24A'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/components.css" />
<style>
/* Overview-specific layout */
.overview-body {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--sp-6);
}
@media(min-width: 1000px){
  .overview-body { grid-template-columns: 1fr 260px; gap: var(--sp-7); }
}

.section-hd {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: var(--sp-3) 0 var(--sp-5);
}

.mgrid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--sp-4);
}
@media(min-width: 640px){ .mgrid { grid-template-columns: 1fr 1fr; } }
@media(min-width: 1100px){ .mgrid { grid-template-columns: 1fr 1fr 1fr; } }

.mcard {
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: var(--r-card);
  padding: var(--sp-5) var(--sp-6);
  cursor: pointer;
  transition: border-color .15s, transform .15s;
  position: relative;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  min-height: 190px;
}
.mcard:hover { border-color: var(--pop-border); transform: translateY(-1px); }
.mcard--feat {
  background: var(--grad-card-mint);
  border-color: #E4EBD6;
}
.mcard--feat::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: var(--glow-corner-soft);
  pointer-events: none;
}
.mcard > * { position: relative; }
.mcard__top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.mcard__pin { width: 7px; height: 7px; border-radius: 50%; background: var(--pop); box-shadow: 0 0 6px var(--pop); flex-shrink: 0; }
.mcard__city { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
.mcard__code { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); }
.mcard__mood {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: var(--r-pill);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  flex-shrink: 0;
}
.mcard__mood.up { background: var(--up-08); color: var(--up); }
.mcard__mood.dn { background: var(--pop-09); color: var(--pop); }
.mcard__mood.st { background: var(--fill); color: var(--muted); }

.mcard__meta {
  display: flex; align-items: center; gap: var(--sp-4);
  font-size: 10.5px;
  color: var(--muted);
  margin-bottom: var(--sp-4);
  flex-wrap: wrap;
}
.mcard__meta b { color: var(--sub); font-weight: 500; }

.mcard__movers-lbl {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: var(--sp-2);
}
.mcard__movers { display: flex; flex-wrap: wrap; gap: 4px; }
.mover-chip {
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: var(--r-pill);
  background: var(--fill);
  color: var(--sub);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  max-width: 100%;
}
.mover-chip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80px; }
.mover-chip .p { font-family: var(--font-mono); font-weight: 600; color: var(--ink); font-size: 10px; }
.mover-chip .d { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; }
.mover-chip .d.dn { color: var(--pop); }
.mover-chip .d.up { color: var(--up); }

.mcard__foot {
  display: flex; align-items: center;
  margin-top: auto;
  padding-top: var(--sp-4);
  border-top: 0.5px solid var(--line-softer);
  font-size: 10.5px;
  color: var(--sub);
}
.mcard__cta { margin-left: auto; color: var(--pop); font-weight: 500; }

/* Right rail */
.rail { display: flex; flex-direction: column; gap: var(--sp-5); }
@media(max-width: 999px){
  /* On mobile the rail sits underneath, use two-column grid for compact display */
  .rail { display: grid; grid-template-columns: 1fr; gap: var(--sp-4); }
}
@media(min-width: 640px) and (max-width: 999px){
  .rail { grid-template-columns: 1fr 1fr; }
}
.rail-card {
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: var(--r-card);
  padding: var(--sp-6);
}
.rail-card--wl {
  background: var(--grad-card-mint);
  border-color: #E4EBD6;
  position: relative;
  overflow: hidden;
}
.rail-card--wl::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--glow-corner-soft);
  pointer-events: none;
}
.rail-card--wl > * { position: relative; }
.rail-card__hd {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--pop);
  margin-bottom: var(--sp-4);
  display: flex; align-items: center; gap: 6px;
}
.rail-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0;
  font-size: 12px;
  border-top: 0.5px solid var(--line-softer);
  cursor: pointer;
  color: inherit;
  text-decoration: none;
}
.rail-row:first-child { border-top: none; padding-top: 4px; }
.rail-row__idx { font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 12px; flex-shrink: 0; }
.rail-row__name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-row__meta { font-size: 10.5px; color: var(--muted); font-family: var(--font-mono); flex-shrink: 0; }
.rail-row__d { font-family: var(--font-mono); font-size: 10px; font-weight: 600; flex-shrink: 0; }
.rail-row__d.dn { color: var(--pop); }
.rail-row__d.up { color: var(--up); }
.rail-card__foot {
  font-size: 11px;
  color: var(--pop);
  margin-top: var(--sp-4);
  font-weight: 500;
  cursor: pointer;
}

/* Loading skeletons */
.skel { background: var(--fill); border-radius: 6px; display: inline-block; }
.skel-line { height: 12px; border-radius: 3px; background: linear-gradient(90deg, var(--fill) 0%, var(--card-alt) 50%, var(--fill) 100%); background-size: 200% 100%; animation: skel 1.4s ease-in-out infinite; }
@keyframes skel { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
</style>
</head>
<body>

<div class="app">
  <div id="mtop-slot"></div>
  <div id="side-slot"></div>

  <main class="main">
    <div class="topbar">
      <div class="topbar__search"><span>🔍</span>Search…<span class="topbar__kbd">⌘K</span></div>
      <div class="topbar__selector" style="color:var(--sub)"><span id="date-desktop">—</span> ▾</div>
      <div class="topbar__bell">🔔</div>
    </div>

    <div class="page-head">
      <div class="page-head__row">
        <div>
          <div class="eyebrow"><span id="stat-markets">—</span> markets · <span id="stat-lots">—</span> lots · <span id="date-eyebrow">—</span></div>
          <h1>Terminal markets</h1>
          <p>Pick a city to open its full market read.</p>
        </div>
        <div class="view-toggle">
          <span class="view-toggle__opt is-active"><span class="view-toggle__ico">◈</span>By city</span>
          <a href="/app/markets/compare" class="view-toggle__opt"><span class="view-toggle__ico">◆</span>By commodity</a>
        </div>
      </div>
    </div>

    <div id="err-slot"></div>

    <div class="overview-body">
      <!-- LEFT: mood strip + market cards -->
      <div id="left-col">
        <div class="loading-skel" style="height:56px;margin-bottom:16px"></div>
        <div class="mgrid">
          <div class="loading-skel" style="height:200px"></div>
          <div class="loading-skel" style="height:200px"></div>
          <div class="loading-skel" style="height:200px"></div>
          <div class="loading-skel" style="height:200px"></div>
        </div>
      </div>

      <!-- RIGHT RAIL -->
      <div class="rail" id="rail">
        <div class="loading-skel" style="height:180px"></div>
      </div>
    </div>
  </main>

  <div id="mtabs-slot"></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script>
(async function() {
  const U = window.agraxUtil;
  const shell = Shell.render('markets');
  document.getElementById('mtop-slot').outerHTML = shell.mtop;
  document.getElementById('side-slot').outerHTML = shell.side;
  document.getElementById('mtabs-slot').outerHTML = shell.mtabs;

  // Region mapping — the 12 USDA terminal markets
  const REGIONS = [
    { name: 'Northeast', markets: ['New York', 'Boston', 'Philadelphia', 'Baltimore'] },
    { name: 'Midwest',   markets: ['Chicago', 'Detroit'] },
    { name: 'Southeast', markets: ['Atlanta', 'Miami', 'Raleigh', 'Columbia', 'Asheville'] },
    { name: 'West',      markets: ['Los Angeles'] },
  ];
  // Fallback: any market not in a region goes to "Other markets"

  let today = [], prev = [], latestDate = null;
  try {
    const dates = await agraxAPI.dates();
    if (!dates?.length) throw new Error('No data available');
    latestDate = dates[0].date;
    document.getElementById('date-desktop').textContent = fmtDate(latestDate);
    document.getElementById('date-eyebrow').textContent = fmtDateLong(latestDate);
    today = await agraxAPI.reportTerminal(latestDate);
    if (dates[1]) prev = await agraxAPI.reportTerminal(dates[1].date);
  } catch (err) { return showError(err); }

  // Group by market
  const byMarket = U.groupBy(today, r => r.market);
  const prevByMarket = U.groupBy(prev, r => r.market);
  const allMarkets = Array.from(byMarket.keys());

  document.getElementById('stat-markets').textContent = allMarkets.length;
  document.getElementById('stat-lots').textContent = today.length.toLocaleString();

  // Featured market: user's selected market, else first alphabetical
  const featuredMkt = U.selMarket() && byMarket.has(U.selMarket()) ? U.selMarket() : allMarkets.sort()[0];

  // Build market summaries
  const marketData = new Map();
  for (const market of allMarkets) {
    const rows = byMarket.get(market) || [];
    const prevRows = prevByMarket.get(market) || [];
    const byCom = U.groupBy(rows, r => r.commodity);
    const prevByCom = U.groupBy(prevRows, r => r.commodity);

    const comChanges = [];
    for (const [name, rs] of byCom) {
      const agg = U.aggregateCommodity(rs);
      const prevAgg = prevByCom.has(name) ? U.aggregateCommodity(prevByCom.get(name)) : null;
      const d = U.delta(agg.mostly, prevAgg?.mostly);
      comChanges.push({ name, mostly: agg.mostly, pct: d.pct });
    }
    const withChg = comChanges.filter(c => c.pct != null);
    const avgChg = withChg.length ? withChg.reduce((s, c) => s + c.pct, 0) / withChg.length : null;
    const mood = U.moodFromAvgChg(avgChg);
    const movers = [...withChg]
      .sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct))
      .slice(0, 3);
    marketData.set(market, {
      commodityCount: byCom.size,
      lotCount: rows.length,
      mood,
      movers,
    });
  }

  // Render market cards, grouped by region
  const leftCol = document.getElementById('left-col');
  leftCol.innerHTML = '';

  // National mood strip
  const nationalChanges = today.map(r => r).flatMap(() => []);
  // Compute overall mood from all commodities across all markets
  let downN = 0, upN = 0, totalChg = 0, chgCount = 0;
  for (const md of marketData.values()) {
    const movers = md.movers;
    for (const m of movers) {
      if (m.pct == null) continue;
      totalChg += m.pct;
      chgCount++;
      if (m.pct < -0.5) downN++;
      else if (m.pct > 0.5) upN++;
    }
  }
  const avgAll = chgCount ? totalChg / chgCount : null;
  const nationalMood = U.moodFromAvgChg(avgAll);
  const circ = 2 * Math.PI * 13;
  const fill = (nationalMood.score / 100) * circ;

  leftCol.innerHTML = `
    <div style="display:flex;align-items:center;gap:20px;padding:12px 16px;background:var(--card);border:0.5px solid var(--line);border-radius:10px;font-size:12px;margin-bottom:16px;flex-wrap:wrap">
      <div style="position:relative;width:32px;height:32px;flex-shrink:0">
        <svg width="32" height="32" viewBox="0 0 32 32" style="transform:rotate(-90deg)">
          <circle cx="16" cy="16" r="13" fill="none" stroke="#EFEFEC" stroke-width="3"/>
          <circle cx="16" cy="16" r="13" fill="none" stroke="var(--pop)" stroke-width="3" stroke-dasharray="${fill.toFixed(1)} ${(circ-fill).toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--pop)">${nationalMood.score}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;font-weight:600">National mood</span><span style="font-family:var(--font-mono);font-weight:600">${nationalMood.label}</span></div>
      <div style="width:1px;height:20px;background:var(--line)"></div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;font-weight:600">Down</span><span style="font-family:var(--font-mono);font-weight:600;color:var(--pop)">${downN}</span></div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;font-weight:600">Up</span><span style="font-family:var(--font-mono);font-weight:600;color:var(--up)">${upN}</span></div>
      <span style="margin-left:auto;font-size:11px;color:var(--muted)">Updated ${fmtDate(latestDate)}</span>
    </div>
  `;

  const usedMarkets = new Set();

  for (const region of REGIONS) {
    const regionMarkets = region.markets.filter(m => byMarket.has(m));
    if (!regionMarkets.length) continue;

    const secHd = document.createElement('div');
    secHd.className = 'section-hd';
    secHd.textContent = region.name;
    leftCol.appendChild(secHd);

    const grid = document.createElement('div');
    grid.className = 'mgrid';
    regionMarkets.forEach(market => {
      usedMarkets.add(market);
      grid.appendChild(renderCard(market, marketData.get(market), market === featuredMkt));
    });
    leftCol.appendChild(grid);
  }

  // Any markets not mapped to a region
  const other = allMarkets.filter(m => !usedMarkets.has(m));
  if (other.length) {
    const secHd = document.createElement('div');
    secHd.className = 'section-hd';
    secHd.textContent = 'Other markets';
    leftCol.appendChild(secHd);

    const grid = document.createElement('div');
    grid.className = 'mgrid';
    other.forEach(market => {
      grid.appendChild(renderCard(market, marketData.get(market), false));
    });
    leftCol.appendChild(grid);
  }

  // Render right rail
  renderRail();

  function renderCard(market, data, featured) {
    const a = document.createElement('a');
    a.className = 'mcard' + (featured ? ' mcard--feat' : '');
    a.href = `/app/markets/city?m=${encodeURIComponent(market)}`;

    const moodCls = data.mood.mod === 'up' ? 'up' : data.mood.mod === 'down' ? 'dn' : 'st';
    const moodTxt = data.mood.mod === 'up' ? '▲ Higher' : data.mood.mod === 'down' ? '▼ Lower' : '· Steady';

    a.innerHTML = `
      <div class="mcard__top">
        <span class="mcard__pin"></span>
        <span class="mcard__city">${escape(market)}</span>
        <span class="mcard__mood ${moodCls}">${moodTxt}</span>
      </div>
      <div class="mcard__meta">
        <span><b>${data.commodityCount}</b> commodities</span>
        <span>· <b>${data.lotCount.toLocaleString()}</b> lots</span>
      </div>
      ${data.movers.length ? `
        <div class="mcard__movers-lbl">Top movers today</div>
        <div class="mcard__movers">
          ${data.movers.map(m => {
            const arrow = m.pct < 0 ? '▼' : m.pct > 0 ? '▲' : '—';
            const cls = m.pct < 0 ? 'dn' : m.pct > 0 ? 'up' : '';
            return `<span class="mover-chip"><span class="n">${escape(m.name)}</span>${m.mostly != null ? `<span class="p">$${m.mostly.toFixed(0)}</span>` : ''}${m.pct != null ? `<span class="d ${cls}">${arrow}${Math.abs(m.pct).toFixed(0)}%</span>` : ''}</span>`;
          }).join('')}
        </div>
      ` : '<div class="mcard__movers-lbl" style="color:var(--muted)">No movement data</div>'}
      <div class="mcard__foot">
        <span>${fmtDate(latestDate)}</span>
        <span class="mcard__cta">Open report →</span>
      </div>
    `;
    return a;
  }

  function renderRail() {
    const rail = document.getElementById('rail');
    rail.innerHTML = '';

    // Watchlist quick jump
    const watch = U.watchList();
    const wlHtml = watch.length ? watch.slice(0, 4).map((name, i) => {
      // find price/delta for watched commodity in featured market
      const rows = today.filter(r => r.commodity === name && r.market === featuredMkt);
      const prevRows = prev.filter(r => r.commodity === name && r.market === featuredMkt);
      const agg = rows.length ? U.aggregateCommodity(rows) : null;
      const prevAgg = prevRows.length ? U.aggregateCommodity(prevRows) : null;
      const d = agg && prevAgg ? U.delta(agg.mostly, prevAgg.mostly) : { pct: null };
      const cls = d.pct == null ? '' : (d.pct < 0 ? 'dn' : d.pct > 0 ? 'up' : '');
      const arrow = d.pct == null ? '—' : (d.pct < 0 ? '▼' : d.pct > 0 ? '▲' : '—');
      const url = U.detailURL({ commodity: name, market: featuredMkt });
      return `<a class="rail-row" href="${url}">
        <span class="rail-row__idx">${i+1}</span>
        <span class="rail-row__name">${escape(name)}</span>
        <span class="rail-row__d ${cls}">${d.pct != null ? `${arrow}${Math.abs(d.pct).toFixed(1)}%` : '—'}</span>
      </a>`;
    }).join('') : `<div style="font-size:11.5px;color:var(--sub);padding:8px 0">
      No commodities watched yet. Star items to track them here.
    </div>`;

    // Popular hubs — by lot count
    const hubs = [...marketData.entries()]
      .map(([m, d]) => ({ market: m, lots: d.lotCount }))
      .sort((a, b) => b.lots - a.lots)
      .slice(0, 5);

    // Popular commodities across all markets — most common
    const comCount = new Map();
    for (const r of today) {
      const n = r.commodity;
      comCount.set(n, (comCount.get(n) || 0) + 1);
    }
    // Compute avg change per commodity for the price signal
    const comAvgChg = new Map();
    for (const [name, count] of comCount) {
      // sample average change across markets
      const chgs = [];
      for (const [m, d] of marketData) {
        const mover = d.movers.find(mv => mv.name === name);
        if (mover?.pct != null) chgs.push(mover.pct);
      }
      const avg = chgs.length ? chgs.reduce((s, x) => s + x, 0) / chgs.length : null;
      comAvgChg.set(name, avg);
    }
    const popularCom = [...comCount.entries()]
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

    rail.innerHTML = `
      <div class="rail-card rail-card--wl">
        <div class="rail-card__hd">★ Your watchlist</div>
        ${wlHtml}
        <a class="rail-card__foot" href="/app/watchlist">Manage watchlist →</a>
      </div>

      <div class="rail-card">
        <div class="rail-card__hd">Popular hubs · today</div>
        ${hubs.map((h, i) => `<a class="rail-row" href="/app/markets/city?m=${encodeURIComponent(h.market)}">
          <span class="rail-row__idx">${i+1}</span>
          <span class="rail-row__name">${escape(h.market)}</span>
          <span class="rail-row__meta">${h.lots.toLocaleString()} lots</span>
        </a>`).join('')}
      </div>

      <div class="rail-card">
        <div class="rail-card__hd">Popular commodities</div>
        ${popularCom.map(([name, count], i) => {
          const pct = comAvgChg.get(name);
          const cls = pct == null ? '' : (pct < 0 ? 'dn' : pct > 0 ? 'up' : '');
          const arrow = pct == null ? '' : (pct < 0 ? '▼' : pct > 0 ? '▲' : '—');
          return `<a class="rail-row" href="${U.detailURL({ commodity: name })}">
            <span class="rail-row__idx">${i+1}</span>
            <span class="rail-row__name">${escape(name)}</span>
            <span class="rail-row__d ${cls}">${pct != null ? `${arrow}${Math.abs(pct).toFixed(1)}%` : ''}</span>
          </a>`;
        }).join('')}
      </div>
    `;
  }

  function fmtDate(iso) { return U.fmtDate(iso); }
  function fmtDateLong(iso) { return U.fmtDateLong(iso); }
  function escape(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function showError(err) {
    const el = document.createElement('div');
    el.className = 'err-banner';
    el.innerHTML = `<span class="err-banner__icn">!</span><span><b>Couldn't load.</b> ${escape(String(err.message || err))}</span>`;
    document.getElementById('err-slot').appendChild(el);
  }
})();
</script>
</body>
</html>
