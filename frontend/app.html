<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agraX — Wholesale Produce Pricing</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%2315803d'/%3E%3Cpath d='M8 18 Q18 8 28 18 Q18 28 8 18Z' fill='rgba(255,255,255,0.25)'/%3E%3Cpath d='M18 8 Q28 18 18 28 Q8 18 18 8Z' fill='rgba(255,255,255,0.55)'/%3E%3Ccircle cx='18' cy='18' r='3.5' fill='%23fff'/%3E%3C/svg%3E" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin="anonymous"></script>
<style>
/* ── App shell ── */
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;padding:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
.app{display:grid;grid-template-columns:1fr;grid-template-rows:56px 1fr 26px;grid-template-areas:"bar""main""status";height:100dvh;height:100vh;}
.main{grid-area:main;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.statusbar{grid-area:status;display:flex;align-items:center;gap:8px;padding:0 20px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--text-dim);font-family:var(--font-mono);background:var(--surface);}
.statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--positive);flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.statusbar .sep{color:var(--border-strong);}
/* ── Appbar ── */
.appbar{grid-area:bar;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ab-brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);flex-shrink:0;padding-right:14px;border-right:1px solid var(--border-soft);height:36px;margin-right:4px;}
.ab-logo{width:28px;height:28px;border-radius:7px;flex-shrink:0;display:block;}
.ab-name{font-size:16px;font-weight:700;letter-spacing:-.025em;line-height:1;}
.ab-name .x{color:var(--accent);}
/* ── Top nav ── */
.topnav{display:flex;align-items:center;gap:1px;flex:1;min-width:0;overflow:hidden;}
.tn-sep{width:1px;height:18px;background:var(--border-soft);margin:0 4px;flex-shrink:0;}
.tn-btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border:0;background:transparent;border-radius:7px;color:var(--text-muted);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background 80ms,color 80ms;flex-shrink:0;}
.tn-btn:hover{background:var(--bg-2);color:var(--text);}
.tn-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.tn-ico{width:14px;height:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tn-ico svg{width:14px;height:14px;}
.tn-badge{background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;font-family:var(--font-mono);}
.tn-caret{font-size:8px;opacity:.4;margin-left:-2px;}
/* ── Dropdown ── */
.tn-menu{position:relative;flex-shrink:0;}
.tn-dropdown{position:absolute;top:calc(100% + 6px);left:0;min-width:216px;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,.04),0 16px 40px -12px rgba(0,0,0,.16);padding:5px;}
.tn-dd-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:7px 10px;border:0;background:transparent;border-radius:6px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;text-align:left;}
.tn-dd-item:hover{background:var(--bg-2);}
.tn-dd-cnt{font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);flex-shrink:0;}
.tn-dd-sep{height:1px;background:var(--border-soft);margin:4px 4px;}
.tn-dd-scroll{max-height:280px;overflow-y:auto;}
/* ── Appbar right ── */
.ab-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px;}
.ab-search{display:flex;align-items:center;gap:7px;background:var(--bg-2);border:1.5px solid var(--border);border-radius:8px;padding:0 12px;height:34px;cursor:pointer;transition:border-color 140ms;min-width:190px;flex-shrink:0;}
.ab-search:hover{border-color:var(--accent);}
.ab-search svg{width:14px;height:14px;color:var(--text-dim);flex-shrink:0;}
.ab-search-label{font-size:12.5px;color:var(--text-dim);flex:1;white-space:nowrap;}
.ab-search-kbd{font-size:10px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);flex-shrink:0;}
.ab-icon{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:background 80ms;flex-shrink:0;}
.ab-icon:hover{background:var(--bg-2);color:var(--text);}
.ab-icon svg{width:14px;height:14px;}
.ab-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:10px;font-family:var(--font-mono);border:1.5px solid var(--accent-soft);flex-shrink:0;}
/* ── Page ── */
.page{padding:20px 28px 40px;max-width:1480px;margin:0 auto;width:100%;}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border-soft);gap:12px;}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0;}
.page-sub{color:var(--text-muted);font-size:12px;margin:3px 0 0;}
/* ── Hero band ── */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 24px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.hero-l{}
.hero-eyebrow{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:8px;}
.hero-eyebrow .pill{font-size:9.5px;padding:1px 7px;border-radius:3px;}
.hero-date{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--text);margin:0 0 6px;}
.hero-meta{font-size:12px;color:var(--text-muted);}
.hero-meta .sep{margin:0 6px;color:var(--border-strong);}
.hero-r{flex-shrink:0;}
/* ── Popular cards grid ── */
.pop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.pop-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border-soft);transition:background 60ms;}
.pop-row:last-child{border-bottom:none;}
.pop-row:hover{background:var(--bg-2);}
/* ── Filter bar ── */
.fbar{display:flex;align-items:center;gap:6px;padding:10px 0;flex-wrap:wrap;margin-bottom:12px;}
.fbar .chip{padding:4px 11px;font-size:12px;}
/* ── Detail nav ── */
.detail-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.nav-arrows{display:flex;align-items:center;gap:4px;}
/* ── KPI strip ── */
.kpi{padding:14px 18px;border-right:1px solid var(--border-soft);flex-shrink:0;}
.kpi:last-child{border-right:none;}
.kpi .l{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);font-weight:500;margin-bottom:5px;}
.kpi .v{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;font-family:var(--font-mono);}
.kpi .v.lg{font-size:26px;}
.kpi .d{font-size:11.5px;color:var(--text-muted);margin-top:3px;font-family:var(--font-mono);}
/* ── Supply chain band ── */
.sc-band .card-h h3{font-size:13px;}
.sc-grid{display:grid;grid-template-columns:1fr 32px 1fr 32px 1fr;align-items:start;padding:16px;}
.sc-arrow{display:flex;align-items:center;justify-content:center;padding-top:28px;color:var(--text-dim);}
.sc-col{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;overflow:hidden;}
.sc-col-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border-soft);}
.sc-step{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-title{font-size:12px;font-weight:600;color:var(--text);}
.sc-sub{font-size:10.5px;color:var(--text-muted);margin-top:1px;}
.sc-rows{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:80px;}
.sc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sc-row-l{}
.sc-row-name{font-size:12px;font-weight:500;color:var(--text);}
.sc-row-meta{font-size:10.5px;color:var(--text-muted);}
.sc-row-r{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sc-row-val{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text);}
.sc-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-muted);}
.sc-foot .mono{font-family:var(--font-mono);}
.sc-reading{padding:12px 16px;background:var(--accent-soft);border-top:1px solid var(--border-soft);}
.sc-reading-text{font-size:12.5px;color:var(--text-muted);line-height:1.55;margin:0;}
.sc-spread{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border-soft);background:var(--surface);}
/* ── Search overlay ── */
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;}
.search-overlay .panel{width:580px;max-width:calc(100vw - 32px);background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.24);}
.search-overlay .field{display:flex;align-items:center;gap:10px;padding:0 18px;height:54px;border-bottom:1px solid var(--border);}
.search-overlay .field svg{width:18px;height:18px;color:var(--text-dim);flex-shrink:0;}
.search-overlay .field input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--text);}
.search-overlay .field input::placeholder{color:var(--text-dim);}
.search-overlay .field kbd{font-size:11px;color:var(--text-dim);background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;}
.search-overlay .results{max-height:380px;overflow-y:auto;padding:6px;}
.search-overlay .group-h{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);padding:8px 12px 4px;}
.search-overlay .result{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 60ms;}
.search-overlay .result:hover,.search-overlay .result.active{background:var(--bg-2);}
.search-overlay .cmd-name{font-size:13.5px;font-weight:500;color:var(--text);}
.search-overlay .cmd-cat{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.search-overlay .cmd-price{text-align:right;flex-shrink:0;}
.search-overlay .empty{padding:28px;text-align:center;color:var(--text-muted);}
/* ── Mobile ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0);z-index:100;}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px 4px;color:var(--text-dim);font-size:10px;font-family:var(--font-sans);font-weight:500;position:relative;}
.mob-nav-btn.on{color:var(--accent);}
.mob-nav-btn svg{width:21px;height:21px;}
.mob-badge{position:absolute;top:5px;left:calc(50% + 7px);background:var(--accent);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
/* ── Loading ── */
@keyframes lb{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.load-bar{height:3px;background:var(--accent);border-radius:99px;animation:lb 1.4s ease-in-out infinite;}
/* ── Responsive ── */
@media(max-width:1200px){.tn-btn{padding:0 8px;}.tn-btn span.tn-label{display:none;}.ab-search{min-width:150px;}.ab-search-kbd{display:none;}}
@media(max-width:768px){
  .app{grid-template-rows:52px 1fr;padding-bottom:58px;}
  .appbar{padding:0 12px;height:52px;}
  .topnav{display:none;}
  .ab-search{min-width:0;flex:1;margin:0 6px;}
  .ab-search-label{display:none;}
  .ab-avatar{display:none;}
  .statusbar{display:none;}
  .mob-nav{display:flex;}
  .page{padding:12px 12px 24px;}
  .pop-grid{grid-template-columns:1fr;}
  .hero{flex-direction:column;align-items:flex-start;gap:12px;padding:14px;}
  .hero-r{width:100%;}
  .fbar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding:8px 0;}
  .fbar::-webkit-scrollbar{display:none;}
  .dt th:nth-child(3),.dt td:nth-child(3),
  .dt th:nth-child(8),.dt td:nth-child(8),
  .dt th:nth-child(9),.dt td:nth-child(9){display:none;}
  .sc-grid{grid-template-columns:1fr;gap:8px;}
  .sc-arrow{display:none;}
  .kpi-wrap{flex-direction:column;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const API = 'https://produce-iq-production.up.railway.app';

// ── LOGO ──────────────────────────────────────────────────────────────────────
const Logo = () => (
  <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" className="ab-logo" width="28" height="28" style={{borderRadius:7}}>
    <rect width="36" height="36" rx="8" fill="#15803d"/>
    <path d="M8 18 Q18 8 28 18 Q18 28 8 18Z" fill="rgba(255,255,255,0.2)"/>
    <path d="M18 8 Q28 18 18 28 Q8 18 18 8Z" fill="rgba(255,255,255,0.5)"/>
    <circle cx="18" cy="18" r="3.5" fill="#fff"/>
  </svg>
);

// ── ICONS ─────────────────────────────────────────────────────────────────────
const Search = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>;
const Grid = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>;
const Star = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"><path d="M8 1.6 9.95 5.6l4.4.65-3.18 3.1.75 4.38L8 11.66l-3.93 2.07.75-4.38L1.65 6.25l4.4-.65L8 1.6z"/></svg>;
const StarFill = (p) => <svg {...p} viewBox="0 0 16 16" fill="#15803d"><path d="M8 1.6 9.95 5.6l4.4.65-3.18 3.1.75 4.38L8 11.66l-3.93 2.07.75-4.38L1.65 6.25l4.4-.65L8 1.6z"/></svg>;
const MapPin = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"><path d="M2 4v10l4-1.5 4 1.5 4-1.5V2.5L10 4 6 2.5 2 4z"/><path d="M6 2.5v10M10 4v10"/></svg>;
const Truck = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="1" y="4" width="8" height="6" rx="1"/><path d="M9 6h3l2 2v2H9z"/><circle cx="4" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/></svg>;
const Sun = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M8 12.5V14M14 8h-1.5M3.5 8H2M12.2 3.8l-1 1M4.8 11.2l-1 1M12.2 12.2l-1-1M4.8 4.8l-1-1"/></svg>;
const Download = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2v8m0 0 3-3m-3 3-3-3M3 12.5h10"/></svg>;
const ChevR = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m6 3 5 5-5 5"/></svg>;
const ChevL = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m10 3-5 5 5 5"/></svg>;
const ArrowL = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M13 8H3M7 4 3 8l4 4"/></svg>;
const Home = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 6.5 8 2l6 4.5V14H2z"/><path d="M6 14V9h4v5"/></svg>;
const X = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>;
const Refresh = (p) => <svg {...p} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M13.5 4A6 6 0 1 0 14 9"/><path d="M13.5 1.5V4H11"/></svg>;

// ── SPARKLINE ─────────────────────────────────────────────────────────────────
function Sparkline({ data, w = 80, h = 22 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data), max = Math.max(...data), pad = 1.5;
  const dx = (w - pad * 2) / (data.length - 1), range = max - min || 1;
  const pts = data.map((v, i) => [pad + i * dx, pad + (h - pad * 2) * (1 - (v - min) / range)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const up = data[data.length - 1] >= data[0];
  const c = up ? 'var(--positive)' : 'var(--negative)';
  const last = pts[pts.length - 1];
  return (
    <svg width={w} height={h} style={{ overflow: 'visible', display: 'block', flexShrink: 0 }}>
      <path d={d} fill="none" stroke={c} strokeWidth="1.3" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last[0]} cy={last[1]} r="1.8" fill={c} />
    </svg>
  );
}

// ── DELTA ─────────────────────────────────────────────────────────────────────
function Delta({ pct }) {
  if (pct == null || isNaN(pct)) return <span className="delta flat">—</span>;
  if (Math.abs(pct) < 0.05) return <span className="delta flat">0.0%</span>;
  return <span className={`delta ${pct > 0 ? 'up' : 'dn'}`}>{pct > 0 ? '+' : ''}{pct.toFixed(2)}%</span>;
}

// ── STAR BTN ──────────────────────────────────────────────────────────────────
function StarBtn({ on, toggle }) {
  return (
    <button className={`star-btn ${on ? 'on' : ''}`} onClick={e => { e.stopPropagation(); toggle(); }}>
      {on ? <StarFill width="14" height="14" /> : <Star width="14" height="14" />}
    </button>
  );
}

// ── SUPPLY PILL ───────────────────────────────────────────────────────────────
function SupplyPill({ v }) {
  if (!v) return <span className="pill">—</span>;
  const low = v.toLowerCase();
  const cls = /lower/.test(low) ? 'negative' : /higher/.test(low) ? 'positive' : '';
  return <span className={`pill ${cls}`}>{v}</span>;
}

// ── DATA CONSTANTS ────────────────────────────────────────────────────────────
const MARKETS = [
  { code: 'ALL', city: 'All Markets', state: '' },
  { code: 'NYC', city: 'New York', state: 'NY', region: 'Northeast' },
  { code: 'BOS', city: 'Boston', state: 'MA', region: 'Northeast' },
  { code: 'PHL', city: 'Philadelphia', state: 'PA', region: 'Mid-Atlantic' },
  { code: 'BAL', city: 'Baltimore', state: 'MD', region: 'Mid-Atlantic' },
  { code: 'ATL', city: 'Atlanta', state: 'GA', region: 'Southeast' },
  { code: 'MIA', city: 'Miami', state: 'FL', region: 'Southeast' },
  { code: 'CHI', city: 'Chicago', state: 'IL', region: 'Midwest' },
  { code: 'DET', city: 'Detroit', state: 'MI', region: 'Midwest' },
  { code: 'LAX', city: 'Los Angeles', state: 'CA', region: 'West' },
  { code: 'SFO', city: 'San Francisco', state: 'CA', region: 'West' },
];

function mktName(code) {
  const m = MARKETS.find(t => t.code === code);
  return m ? (m.state ? `${m.city}, ${m.state}` : m.city) : code;
}

function mktCodeFromName(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('new york')) return 'NYC';
  if (n.includes('boston')) return 'BOS';
  if (n.includes('philadelphia')) return 'PHL';
  if (n.includes('baltimore')) return 'BAL';
  if (n.includes('atlanta')) return 'ATL';
  if (n.includes('miami')) return 'MIA';
  if (n.includes('chicago')) return 'CHI';
  if (n.includes('detroit')) return 'DET';
  if (n.includes('los angeles')) return 'LAX';
  if (n.includes('san francisco')) return 'SFO';
  return null;
}

function guessCategory(name) {
  const n = name.toLowerCase();
  if (/apple|pear|grape|peach|plum|cherry|kiwi|melon|mango|papaya|pineapple|banana|avocado|orange|lemon|lime|grapefruit|strawberr|blueberr|raspberr|blackberr/.test(n)) return 'Fruits';
  if (/onion|shallot|potato|yam/.test(n)) return 'Onions & Potatoes';
  if (/almond|walnut|pecan|pistachio|cashew|nut/.test(n)) return 'Nuts';
  return 'Vegetables';
}

function buildComms(rows, prevRows) {
  const termRows = rows.filter(r => r.market_type === 'terminal' && r.price_low != null);
  const fobRows = rows.filter(r => r.market_type === 'shipping_point' && r.market !== 'National Trends' && r.price_low != null);
  const natRows = rows.filter(r => r.market === 'National Trends');
  const byComm = {};
  termRows.forEach(r => {
    if (!byComm[r.commodity]) byComm[r.commodity] = { name: r.commodity, cat: guessCategory(r.commodity), termRows: [], fobRows: [], nat: null };
    byComm[r.commodity].termRows.push(r);
  });
  fobRows.forEach(r => { if (byComm[r.commodity]) byComm[r.commodity].fobRows.push(r); });
  natRows.forEach(r => { if (byComm[r.commodity]) byComm[r.commodity].nat = r; });
  const prevMap = {};
  if (prevRows) prevRows.filter(r => r.market_type === 'terminal' && r.price_low != null).forEach(r => {
    if (!prevMap[r.commodity]) prevMap[r.commodity] = [];
    prevMap[r.commodity].push(parseFloat(r.price_low));
  });
  return Object.values(byComm).map(c => {
    const prices = c.termRows.map(r => parseFloat(r.price_low));
    const low = Math.min(...prices), high = Math.max(...prices);
    const mostly = prices.reduce((a, b) => a + b, 0) / prices.length;
    const prev = prevMap[c.name];
    const prevAvg = prev ? prev.reduce((a, b) => a + b, 0) / prev.length : null;
    const wow = prevAvg ? ((mostly - prevAvg) / prevAvg) * 100 : 0;
    const origins = [...new Set(c.termRows.map(r => r.origin).filter(Boolean))];
    const fobPrices = c.fobRows.map(r => parseFloat(r.price_low));
    const fobAvg = fobPrices.length ? fobPrices.reduce((a, b) => a + b, 0) / fobPrices.length : null;
    const seed = c.name.charCodeAt(0);
    const spark = Array.from({ length: 7 }, (_, i) => mostly * (1 + ((seed * 7 + i * 13) % 20 - 10) / 100 + (wow / 100) * (i / 6)));
    return {
      id: c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      name: c.name, cat: c.cat, origins, low, high, mostly, wow, prevAvg,
      supply: c.nat ? c.nat.movement : (c.termRows[0] ? c.termRows[0].movement : null),
      supplyNote: c.nat ? c.nat.supply_note : null,
      fobAvg, termRows: c.termRows, fobRows: c.fobRows, spark,
    };
  }).sort((a, b) => Math.abs(b.wow) - Math.abs(a.wow));
}

function priceFor(c, code) {
  if (!code || code === 'ALL') return { low: c.low, high: c.high, mostly: c.mostly };
  const m = MARKETS.find(t => t.code === code);
  if (!m) return { low: c.low, high: c.high, mostly: c.mostly };
  const rel = c.termRows.filter(r => r.market && r.market.toLowerCase().includes(m.city.toLowerCase()) && r.price_low != null);
  if (!rel.length) return { low: c.low, high: c.high, mostly: c.mostly };
  const prices = rel.map(r => parseFloat(r.price_low));
  return { low: Math.min(...prices), high: Math.max(...prices), mostly: prices.reduce((a, b) => a + b, 0) / prices.length };
}

function fmtDate(s) { if (!s) return ''; return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtShort(s) { if (!s) return ''; return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtPrice(n) { return n != null ? '$' + n.toFixed(2) : '—'; }

function MarketPicker({ market, setMarket }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const cur = MARKETS.find(t => t.code === market) || MARKETS[0];
  useEffect(() => {
    if (!open) return;

  }, [open]);
  const byRegion = useMemo(() => {

    const out = [];

    return out.slice(0, 4);
  }, [comms]);

  const watchItems = useMemo(() => comms.filter(c => watchlist[c.id]).slice(0, 4), [comms, watchlist]);

  const filtered = useMemo(() => {
    let list = [...comms];
    if (cat !== 'All') list = list.filter(c => c.cat === cat);

    if (orgFilter === 'Imported') list = list.filter(c => c.origins.some(o => /(mexico|chile|peru|ecuador|guatemala|colombia|costa rica)/i.test(o)));
    if (trendF === 'Up today') list = list.filter(c => c.wow > 0.5);

    });
    return list;

            <strong>{comms.length} commodities</strong>

        </div>

          <MarketPicker market={market} setMarket={setMarket} />

            <div><h3 style={{ fontSize: 13, margin: 0 }}>Your watchlist</h3><span className="sub">{Object.keys(watchlist).length} tracked</span></div>

                </div>

// ── SEARCH OVERLAY ────────────────────────────────────────────────────────────
function SearchOverlay({ comms, onClose, onOpen }) {
  const [q, setQ] = useState('');
  const [active, setActive] = useState(0);
  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  const results = useMemo(() => {
    if (!q.trim()) return comms.slice(0, 8);
    const ql = q.toLowerCase();
    return comms.filter(c => c.name.toLowerCase().includes(ql) || c.cat.toLowerCase().includes(ql) || c.origins.some(o => o.toLowerCase().includes(ql)));
  }, [q, comms]);
  useEffect(() => { setActive(0); }, [q]);
  function onKey(e) {
    if (e.key === 'Escape') onClose();
    else if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(results.length - 1, a + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(0, a - 1)); }
    else if (e.key === 'Enter' && results[active]) { onOpen(results[active].id); }
  }
  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="panel" onClick={e => e.stopPropagation()}>
        <div className="field">
          <Search width="18" height="18" />
          <input ref={ref} value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey} placeholder="Search commodities, origins…" />
          <kbd>esc</kbd>
        </div>
        <div className="results">
          <div className="group-h">{q ? `${results.length} result${results.length !== 1 ? 's' : ''}` : 'Top movers today'}</div>
          {results.map((c, i) => (
            <div key={c.id} className={`result ${i === active ? 'active' : ''}`} onMouseEnter={() => setActive(i)} onClick={() => onOpen(c.id)}>
              <span style={{ fontSize: 10, color: 'var(--text-dim)', minWidth: 88, textTransform: 'uppercase', letterSpacing: '.06em', fontFamily: 'var(--font-mono)' }}>{c.cat}</span>
              <div style={{ flex: 1 }}>
                <div className="cmd-name">{c.name}</div>
                <div className="cmd-cat">{c.origins.slice(0, 2).join(', ')}</div>
              </div>
              <div className="cmd-price" style={{ textAlign: 'right', flexShrink: 0 }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, fontSize: 13 }}>{fmtPrice(c.mostly)}</div>
                <Delta pct={c.wow} />
              </div>
            </div>
          ))}
          {!results.length && <div className="empty"><p>No results for "{q}"</p></div>}
        </div>
        <div style={{ display: 'flex', padding: '8px 16px', borderTop: '1px solid var(--border)', gap: 14, fontSize: 11, color: 'var(--text-dim)' }}>
          <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>
  );
}

// ── LOADING ───────────────────────────────────────────────────────────────────

// ── ROOT APP ──────────────────────────────────────────────────────────────────
function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [todayStr, setTodayStr] = useState('');
  const [allRows, setAllRows] = useState([]);
  const [comms, setComms] = useState([]);
  const [route, setRoute] = useState('markets');
  const [openId, setOpenId] = useState(null);
  const [catFilter, setCatFilter] = useState(null);
  const [market, setMarket] = useState('NYC');
  const [watchlist, setWatchlist] = useState({});
  const [searchOpen, setSearchOpen] = useState(false);
  const [dark, setDark] = useState(false);

  useEffect(() => { document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); }, [dark]);

  useEffect(() => {
    const fn = e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearchOpen(true); }
      if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); setSearchOpen(true); }
    };
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, []);

  useEffect(() => {
    (async function load() {
      try {
        const dates = await fetch(API + '/dates').then(r => r.json());
        if (!dates.length) throw new Error('No dates available');
        const today = dates[0].date;
        setTodayStr(today);
        const rows = await fetch(API + '/commodities/by-date/' + today).then(r => r.json());
        setAllRows(rows);
        let prev = [];
        if (dates.length > 1) {
          try { prev = await fetch(API + '/commodities/by-date/' + dates[Math.min(6, dates.length - 1)].date).then(r => r.json()); } catch (_) {}
        }
        setComms(buildComms(rows, prev));
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
    })();
  }, []);

  function toggleWatch(id) { setWatchlist(w => { const n = { ...w }; n[id] ? delete n[id] : (n[id] = true); return n; }); }
  function openComm(id) { setSearchOpen(false); setOpenId(id); setRoute('commodity'); }
  function goHome() { setRoute('markets'); setOpenId(null); setCatFilter(null); }

  const openCommObj = useMemo(() => route === 'commodity' && openId ? comms.find(c => c.id === openId) || null : null, [openId, route, comms]);
  const watchCount = Object.keys(watchlist).length;

  const commTree = useMemo(() => {
    const tree = { Fruits: [], Vegetables: [], 'Onions & Potatoes': [], Nuts: [] };
    [...comms].sort((a, b) => a.name.localeCompare(b.name)).forEach(c => { if (tree[c.cat]) tree[c.cat].push(c); });
    return tree;
  }, [comms]);

  if (loading) return <LoadScreen />;
  if (error) return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 12 }}>
      <div style={{ color: 'var(--negative)', fontWeight: 600 }}>Failed to load USDA data</div>
      <div style={{ color: 'var(--text-muted)', fontSize: 12 }}>{error}</div>
      <button className="btn primary" onClick={() => window.location.reload()} style={{ display: 'flex', alignItems: 'center', gap: 6 }}><Refresh width="13" height="13" /> Retry</button>
    </div>
  );

  return (
    <div className="app">
      {/* Appbar */}
      <header className="appbar">
        <a className="ab-brand" href="/">
          <Logo />
          <div className="ab-name">agra<span className="x">X</span></div>
        </a>

        <nav className="topnav">
          <button className={`tn-btn ${(route === 'markets' || route === 'commodity') && !catFilter ? 'on' : ''}`} onClick={goHome}>
            <span className="tn-ico"><Home width="14" height="14" /></span>
            <span className="tn-label">Today</span>
          </button>

          <TnMenu icon={<Grid width="14" height="14" />} label="Commodities" active={route === 'markets' || route === 'commodity'}>
            <button className="tn-dd-item" onClick={goHome}>
              <span>All commodities</span><span className="tn-dd-cnt">{comms.length}</span>
            </button>
            <div className="tn-dd-sep" />
            {['Fruits', 'Vegetables', 'Onions & Potatoes', 'Nuts'].map(cat => (
              <button key={cat} className="tn-dd-item" onClick={() => { setCatFilter(cat); setRoute('markets'); setOpenId(null); }}>
                <span>{cat}</span><span className="tn-dd-cnt">{(commTree[cat] || []).length}</span>
              </button>
            ))}
          </TnMenu>

          <TnMenu icon={<MapPin width="14" height="14" />} label="Terminal markets" active={false}>
            <button className="tn-dd-item" onClick={() => { setMarket('ALL'); setRoute('markets'); }}>
              <span>All terminal markets</span><span className="tn-dd-cnt">12</span>
            </button>
            <div className="tn-dd-sep" />
            <div className="tn-dd-scroll">
              {MARKETS.slice(1).map(t => (
                <button key={t.code} className="tn-dd-item" onClick={() => { setMarket(t.code); setRoute('markets'); }}>
                  <span>{t.city}, {t.state}</span><span className="tn-dd-cnt">{t.region}</span>
                </button>
              ))}
            </div>
          </TnMenu>

          <button className={`tn-btn ${route === 'shipping' ? 'on' : ''}`} onClick={() => setRoute('shipping')}>
            <span className="tn-ico"><Truck width="14" height="14" /></span>
            <span className="tn-label">Shipping points</span>
          </button>

          <span className="tn-sep" />

          <button className={`tn-btn ${route === 'watchlist' ? 'on' : ''}`} onClick={() => setRoute('watchlist')}>
            <span className="tn-ico"><Star width="14" height="14" /></span>
            <span className="tn-label">Watchlist</span>
            {watchCount > 0 && <span className="tn-badge">{watchCount}</span>}
          </button>
        </nav>

        <div className="ab-right">
          <button className="ab-search" onClick={() => setSearchOpen(true)}>
            <Search width="14" height="14" />
            <span className="ab-search-label">Search commodities…</span>
            <span className="ab-search-kbd">⌘K</span>
          </button>
          <button className="ab-icon" onClick={() => setDark(d => !d)} title="Toggle dark mode"><Sun width="14" height="14" /></button>
          <div className="ab-avatar">AX</div>
        </div>
      </header>

      {/* Main */}
      <main className="main">
        {(route === 'markets') && (
          <MarketsScreen comms={comms} market={market} setMarket={setMarket}
            watchlist={watchlist} toggleWatch={toggleWatch} onOpen={openComm}
            todayStr={todayStr} catFilter={catFilter} />
        )}
        {route === 'commodity' && openCommObj && (
          <CommScreen c={openCommObj} market={market} setMarket={setMarket}
            watchlist={watchlist} toggleWatch={toggleWatch}
            onBack={() => { setRoute('markets'); setOpenId(null); }}
            allComms={comms} onOpen={openComm} todayStr={todayStr} />
        )}
        {route === 'watchlist' && (
          <WatchScreen comms={comms} watchlist={watchlist} toggleWatch={toggleWatch}
            onOpen={openComm} market={market} todayStr={todayStr} />
        )}
        {route === 'shipping' && (
          <ShipScreen allRows={allRows} todayStr={todayStr} onOpen={openComm} />
        )}
      </main>

      {/* Status bar */}
      <div className="statusbar">
        <span className="dot" />
        <span>Connected · USDA AMS</span>
        <span className="sep">|</span>
        <span>{fmtShort(todayStr)}</span>
        <span className="sep">|</span>
        <span>{comms.length} commodities · {allRows.filter(r => r.market_type === 'terminal').length} terminal listings</span>
      </div>

      {/* Mobile bottom nav */}
      <div className="mob-nav">
        <button className={`mob-nav-btn ${(route === 'markets' || route === 'commodity') ? 'on' : ''}`} onClick={goHome}>
          <Grid width="21" height="21" />Markets
        </button>
        <button className="mob-nav-btn" onClick={() => setSearchOpen(true)}>
          <Search width="21" height="21" />Search
        </button>
        <button className={`mob-nav-btn ${route === 'watchlist' ? 'on' : ''}`} onClick={() => setRoute('watchlist')} style={{ position: 'relative' }}>
          <Star width="21" height="21" />Watchlist
          {watchCount > 0 && <span className="mob-badge">{watchCount}</span>}
        </button>
        <button className={`mob-nav-btn ${route === 'shipping' ? 'on' : ''}`} onClick={() => setRoute('shipping')}>
          <Truck width="21" height="21" />Shipping
        </button>
      </div>

      {searchOpen && <SearchOverlay comms={comms} onClose={() => setSearchOpen(false)} onOpen={openComm} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
