<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agraX — Wholesale Produce Pricing</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg transform='translate(50,50)'%3E%3Cpath d='M-40,0 Q0,-11.5 40,0 Q0,11.5 -40,0 Z' transform='rotate(-45)' fill='%2315803d'/%3E%3Cpath d='M-40,0 Q0,-11.5 40,0 Q0,11.5 -40,0 Z' transform='rotate(45)' fill='%2334c759'/%3E%3C/g%3E%3C/svg%3E" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
/* ── App grid ── */
.app {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 56px 1fr 26px;
  grid-template-areas: "bar" "main" "status";
  height: 100vh;
}
.main { grid-area: main; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.statusbar { grid-area: status; }

/* ── Appbar ── */
.appbar {
  grid-area: bar;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 calc(max(16px, (100% - 1480px) / 2));
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 20;
  box-shadow: 0 1px 0 var(--border-soft);
}

/* Brand */
.appbar-brand {
  display: flex; align-items: center; gap: 8px;
  flex: 0 0 auto; padding: 0 16px 0 0;
  text-decoration: none; color: var(--text);
  border-right: 1px solid var(--border-soft);
  height: 56px; margin-right: 6px;
}
.appbar-brand .logo-mark { width: 30px; height: 30px; flex: 0 0 30px; display: block; border-radius: 7px; }
.appbar-brand .wm { font-weight: 700; font-size: 17px; letter-spacing: -0.025em; }
.appbar-brand .wm .x { color: var(--accent); }

/* Top nav */
.topnav { display: flex; align-items: center; gap: 1px; flex: 1 1 auto; min-width: 0; overflow: hidden; }
.topnav-div { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
.topnav-menu { position: relative; flex: 0 0 auto; }
.topnav-item {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 10px;
  border: 0; background: transparent; border-radius: 7px;
  color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: background 80ms, color 80ms;
}
.topnav-item:hover { background: var(--bg-2); color: var(--text); }
.topnav-item.active { background: var(--accent-soft); color: var(--accent); }
.tni-ico { width: 15px; height: 15px; display: inline-flex; opacity: .85; flex-shrink: 0; }
.tni-ico svg { width: 15px; height: 15px; }
.topnav-item.active .tni-ico { opacity: 1; }
.tni-label { font-size: 13px; }
.tni-badge { background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 10px; font-family: var(--font-mono); font-weight: 600; }
.tni-caret { font-size: 8px; opacity: 0.45; margin-left: -2px; }
.topnav-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 220px;
  z-index: 40; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,.04), 0 16px 40px -12px rgba(0,0,0,.18);
  padding: 5px;
}
.tnd-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 8px 10px; border: 0; background: transparent;
  border-radius: 6px; font: inherit; font-size: 13px; color: var(--text);
  cursor: pointer; text-align: left;
}
.tnd-item:hover { background: var(--bg-2); }
.tnd-count { font-size: 10.5px; color: var(--text-dim); font-family: var(--font-mono); flex-shrink: 0; }
.tnd-sep { height: 1px; background: var(--border-soft); margin: 4px 4px; }
.tnd-scroll { max-height: 300px; overflow-y: auto; }

/* Right side */
.appbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 8px; }

/* Search bar — prominent */
.appbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 0 12px; height: 36px;
  cursor: pointer; transition: border-color 140ms, box-shadow 140ms;
  min-width: 200px;
}
.appbar-search:hover { border-color: var(--accent); }
.appbar-search svg { width: 15px; height: 15px; color: var(--text-dim); flex-shrink: 0; }
.appbar-search-text { font-size: 13px; color: var(--text-dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-search-kbd { font-size: 10px; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: var(--font-mono); flex-shrink: 0; }
.appbar-icon-btn {
  width: 34px; height: 34px; border-radius: 7px;
  border: 1px solid var(--border); background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); transition: background 80ms, color 80ms;
  flex-shrink: 0;
}
.appbar-icon-btn:hover { background: var(--bg-2); color: var(--text); }
.appbar-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
  font-weight: 700; font-size: 11px; font-family: var(--font-mono);
  border: 1.5px solid var(--accent-soft); flex-shrink: 0;
}

/* Popular card rows */
.popular-row { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; border-bottom: 1px solid var(--border-soft); transition: background 60ms; }
.popular-row:last-child { border-bottom: none; }
.popular-row:hover { background: var(--bg-2); }

/* Mobile search overlay */
.mob-search-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.5); flex-direction: column;
}
.mob-search-overlay.open { display: flex; }
.mob-search-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.mob-search-bar input {
  flex: 1; border: none; outline: none; font-size: 16px;
  background: transparent; font-family: var(--font-sans); color: var(--text);
}
.mob-search-bar input::placeholder { color: var(--text-dim); }
.mob-search-bar svg { width: 20px; height: 20px; color: var(--text-muted); flex-shrink: 0; }
.mob-search-cancel { background: none; border: none; font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer; white-space: nowrap; font-family: var(--font-sans); padding: 0 4px; }
.mob-search-results { flex: 1; background: var(--surface); overflow-y: auto; }

/* Mobile bottom nav */
.mob-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom,0); z-index: 100; }
.mob-nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 8px 4px; color: var(--text-dim); font-size: 10px; font-family: var(--font-sans); font-weight: 500; position: relative; }
.mob-nav-btn.active { color: var(--accent); }
.mob-nav-btn svg { width: 22px; height: 22px; }
.mob-nav-badge { position: absolute; top: 5px; left: calc(50% + 6px); background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; min-width: 14px; height: 14px; border-radius: 99px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }

/* Loading */
@keyframes lb { 0%{width:0;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0;margin-left:100%} }

/* ── Responsive ── */
@media(max-width:1200px) {
  .tni-label { display: none; }
  .topnav-item { padding: 0 8px; }
  .tni-caret { margin-left: 2px; }
  .appbar-search { min-width: 160px; }
  .appbar-search-kbd { display: none; }
}
@media(max-width:768px) {
  .app { grid-template-rows: 52px 1fr; padding-bottom: 60px; }
  .appbar { padding: 0 12px; height: 52px; gap: 0; }
  .appbar-brand { padding-right: 12px; height: 52px; }
  .topnav { display: none; }
  .appbar-search { min-width: 0; flex: 1; margin: 0 8px; }
  .appbar-search-text { display: none; }
  .appbar-search { padding: 0 10px; }
  .appbar-avatar { display: none; }
  .appbar-icon-btn.hide-mobile { display: none; }
  .mob-nav { display: flex; }
  .statusbar { display: none; }
  .page { padding-bottom: 20px; }
  .popular-grid { grid-template-columns: 1fr !important; }
  .hero { flex-direction: column; gap: 12px; padding: 14px 14px 18px; }
  .hero-r { width: 100%; }
  .market-btn { width: 100%; }
  .fbar { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding: 8px 10px; }
  .fbar::-webkit-scrollbar { display: none; }
  .fbar .label-eyebrow { display: none; }
  .card { border-radius: 10px; margin: 0 10px 10px; }
  .dt thead th:nth-child(3), .dt td:nth-child(3),
  .dt thead th:nth-child(8), .dt td:nth-child(8),
  .dt thead th:nth-child(9), .dt td:nth-child(9) { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const API = 'https://produce-iq-production.up.railway.app';

// ── Icons ─────────────────────────────────────────────────────────────────────
const Ico = {
  Search:  (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>,
  Grid:    (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>,
  Star:    (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"><path d="M8 1.6 9.95 5.6l4.4.65-3.18 3.1.75 4.38L8 11.66l-3.93 2.07.75-4.38L1.65 6.25l4.4-.65L8 1.6z"/></svg>,
  StarF:   (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 1.6 9.95 5.6l4.4.65-3.18 3.1.75 4.38L8 11.66l-3.93 2.07.75-4.38L1.65 6.25l4.4-.65L8 1.6z"/></svg>,
  Map:     (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"><path d="M2 4v10l4-1.5 4 1.5 4-1.5V2.5L10 4 6 2.5 2 4z"/><path d="M6 2.5v10M10 4v10"/></svg>,
  Truck:   (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="1" y="4" width="8" height="6" rx="1"/><path d="M9 6h3l2 2v2H9z"/><circle cx="4" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/></svg>,
  Trend:   (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"><path d="M2 11l4-4 3 3 5-6"/><path d="M10 4h4v4"/></svg>,
  Sun:     (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M8 12.5V14M14 8h-1.5M3.5 8H2M12.2 3.8l-1 1M4.8 11.2l-1 1M12.2 12.2l-1-1M4.8 4.8l-1-1"/></svg>,
  Bell:    (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12h10l-1.2-1.6V7a3.8 3.8 0 1 0-7.6 0v3.4L3 12z"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>,
  Settings:(p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="2"/><path d="M13 8a5 5 0 0 0-.1-.9l1.2-.9-1-1.7-1.4.5a5 5 0 0 0-1.5-.9L10 2.5h-2L7.8 4.1a5 5 0 0 0-1.5.9l-1.4-.5-1 1.7 1.2.9A5 5 0 0 0 5 8c0 .3 0 .6.1.9l-1.2.9 1 1.7 1.4-.5a5 5 0 0 0 1.5.9l.2 1.6h2l.2-1.6a5 5 0 0 0 1.5-.9l1.4.5 1-1.7-1.2-.9c.1-.3.1-.6.1-.9z"/></svg>,
  Download:(p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2v8m0 0 3-3m-3 3-3-3M3 12.5h10"/></svg>,
  ChevR:   (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m6 3 5 5-5 5"/></svg>,
  ChevL:   (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m10 3-5 5 5 5"/></svg>,
  ArrowL:  (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M13 8H3M7 4 3 8l4 4"/></svg>,
  X:       (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>,
  Refresh: (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M13.5 4A6 6 0 1 0 14 9"/><path d="M13.5 1.5V4H11"/></svg>,
  Home:    (p) => <svg {...p} viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 6.5 8 2l6 4.5V14H2z"/><path d="M6 14V9h4v5"/></svg>,
};

// ── Sparkline ─────────────────────────────────────────────────────────────────
function Sparkline({ data, w = 88, h = 22 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data), max = Math.max(...data), pad = 1.5;
  const dx = (w - pad * 2) / (data.length - 1), range = max - min || 1;
  const pts = data.map((v, i) => [pad + i * dx, pad + (h - pad * 2) * (1 - (v - min) / range)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
  const trend = data[data.length - 1] >= data[0];
  const color = trend ? 'var(--positive)' : 'var(--negative)';
  const last = pts[pts.length - 1];
  return (
    <svg width={w} height={h} style={{ overflow: 'visible', display: 'block' }}>
      <path d={d} fill="none" stroke={color} strokeWidth="1.25" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last[0]} cy={last[1]} r="1.7" fill={color} />
    </svg>
  );
}

// ── Delta ─────────────────────────────────────────────────────────────────────
function Delta({ pct }) {
  if (pct == null || isNaN(pct)) return <span className="delta flat">—</span>;
  if (Math.abs(pct) < 0.05) return <span className="delta flat">0.0%</span>;
  return <span className={`delta ${pct > 0 ? 'up' : 'dn'}`}>{pct > 0 ? '+' : ''}{pct.toFixed(2)}%</span>;
}

// ── Star ──────────────────────────────────────────────────────────────────────
function StarBtn({ on, onToggle }) {
  return (
    <button className={`star-btn ${on ? 'on' : ''}`} onClick={e => { e.stopPropagation(); onToggle(); }}>
      {on ? <Ico.StarF /> : <Ico.Star />}
    </button>
  );
}

// ── Supply pill ───────────────────────────────────────────────────────────────
function SupplyPill({ v }) {
  if (!v) return <span className="pill">—</span>;
  const low = v.toLowerCase();
  const cls = low.includes('lower') ? 'negative' : low.includes('higher') ? 'positive' : '';
  return <span className={`pill ${cls}`}>{v}</span>;
}

// ── Terminals ─────────────────────────────────────────────────────────────────
const TERMINALS = [
  { code: 'ALL', city: 'All Markets', state: '', region: '' },
  { code: 'NYC', city: 'New York', state: 'NY', region: 'Northeast' },
  { code: 'BOS', city: 'Boston', state: 'MA', region: 'Northeast' },
  { code: 'PHL', city: 'Philadelphia', state: 'PA', region: 'Mid-Atlantic' },
  { code: 'BAL', city: 'Baltimore', state: 'MD', region: 'Mid-Atlantic' },
  { code: 'ATL', city: 'Atlanta', state: 'GA', region: 'Southeast' },
  { code: 'MIA', city: 'Miami', state: 'FL', region: 'Southeast' },
  { code: 'CHI', city: 'Chicago', state: 'IL', region: 'Midwest' },
  { code: 'DET', city: 'Detroit', state: 'MI', region: 'Midwest' },
  { code: 'LAX', city: 'Los Angeles', state: 'CA', region: 'West' },
  { code: 'SFO', city: 'San Francisco', state: 'CA', region: 'West' },
];

function marketCodeFromName(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('new york')) return 'NYC';
  if (n.includes('boston')) return 'BOS';
  if (n.includes('philadelphia')) return 'PHL';
  if (n.includes('baltimore')) return 'BAL';
  if (n.includes('atlanta')) return 'ATL';
  if (n.includes('miami')) return 'MIA';
  if (n.includes('chicago')) return 'CHI';
  if (n.includes('detroit')) return 'DET';
  if (n.includes('los angeles')) return 'LAX';
  if (n.includes('san francisco')) return 'SFO';
  return null;
}

function guessCategory(name) {
  const n = name.toLowerCase();
  if (/apple|pear|grape|peach|plum|cherry|kiwi|melon|mango|papaya|pineapple|banana|avocado|orange|lemon|lime|grapefruit|strawberr|blueberr|raspberr|blackberr/.test(n)) return 'Fruits';
  if (/onion|shallot|potato|yam/.test(n)) return 'Onions & Potatoes';
  if (/almond|walnut|pecan|pistachio|cashew|nut/.test(n)) return 'Nuts';
  return 'Vegetables';
}

function buildCommodities(rows, prevRows) {
  const termRows = rows.filter(r => r.market_type === 'terminal' && r.price_low != null);
  const fobRows = rows.filter(r => r.market_type === 'shipping_point' && r.market !== 'National Trends' && r.price_low != null);
  const natRows = rows.filter(r => r.market === 'National Trends');
  const byComm = {};
  termRows.forEach(r => {
    if (!byComm[r.commodity]) byComm[r.commodity] = { name: r.commodity, cat: guessCategory(r.commodity), termRows: [], fobRows: [], nat: null };
    byComm[r.commodity].termRows.push(r);
  });
  fobRows.forEach(r => { if (byComm[r.commodity]) byComm[r.commodity].fobRows.push(r); });
  natRows.forEach(r => { if (byComm[r.commodity]) byComm[r.commodity].nat = r; });
  const prevPrices = {};
  if (prevRows) prevRows.filter(r => r.market_type === 'terminal' && r.price_low != null).forEach(r => {
    if (!prevPrices[r.commodity]) prevPrices[r.commodity] = [];
    prevPrices[r.commodity].push(parseFloat(r.price_low));
  });
  return Object.values(byComm).map(c => {
    const prices = c.termRows.map(r => parseFloat(r.price_low));
    const low = Math.min(...prices), high = Math.max(...prices);
    const mostly = prices.reduce((a, b) => a + b, 0) / prices.length;
    const prev = prevPrices[c.name];
    const prevAvg = prev ? prev.reduce((a, b) => a + b, 0) / prev.length : null;
    const wow = prevAvg ? ((mostly - prevAvg) / prevAvg) * 100 : 0;
    const origins = [...new Set(c.termRows.map(r => r.origin).filter(Boolean))];
    const fobPrices = c.fobRows.map(r => parseFloat(r.price_low));
    const fobAvg = fobPrices.length ? fobPrices.reduce((a, b) => a + b, 0) / fobPrices.length : null;
    const spark = Array.from({ length: 7 }, (_, i) => mostly * (1 + ((c.name.charCodeAt(0) * 7 + i * 13) % 20 - 10) / 100 + (wow / 100) * (i / 6)));
    return {
      id: c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      name: c.name, cat: c.cat, origins, low, high, mostly, wow, prevAvg,
      supply: c.nat?.movement || c.termRows[0]?.movement || null,
      supplyNote: c.nat?.supply_note || null,
      fobAvg, termRows: c.termRows, fobRows: c.fobRows, spark,
    };
  }).sort((a, b) => Math.abs(b.wow) - Math.abs(a.wow));
}

function priceForMarket(c, marketCode) {
  if (!marketCode || marketCode === 'ALL') return { low: c.low, high: c.high, mostly: c.mostly };
  const mInfo = TERMINALS.find(t => t.code === marketCode);
  if (!mInfo) return { low: c.low, high: c.high, mostly: c.mostly };
  const relevant = c.termRows.filter(r => r.market && r.market.toLowerCase().includes(mInfo.city.toLowerCase()) && r.price_low != null);
  if (!relevant.length) return { low: c.low, high: c.high, mostly: c.mostly };
  const prices = relevant.map(r => parseFloat(r.price_low));
  return { low: Math.min(...prices), high: Math.max(...prices), mostly: prices.reduce((a, b) => a + b, 0) / prices.length };
}

function fmtDate(s) { if (!s) return ''; return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtShort(s) { if (!s) return ''; return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

function MarketPicker({ market, setMarket }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const cur = TERMINALS.find(t => t.code === market) || TERMINALS[0];
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  const byRegion = useMemo(() => {
    const m = {};
    TERMINALS.slice(1).forEach(t => { (m[t.region] = m[t.region] || []).push(t); });
    return m;
  }, []);
  return (
    <div className="market-picker" ref={ref}>
      <button className="market-btn" onClick={() => setOpen(o => !o)}>
        <div className="m-ico"><Ico.Map /></div>
        <div className="m-main">
          <span className="m-city">{cur.city}{cur.state ? `, ${cur.state}` : ''}</span>
          <span className="m-hint">Terminal market · click to change</span>

        <Ico.ChevR />

                <button key={t.code} className={`mm-item ${market === t.code ? 'active' : ''}`}

// ── Markets Screen ────────────────────────────────────────────────────────────
const POPULAR_FRUITS = ['Avocados', 'Strawberries', 'Limes', 'Apples, Gala'];
const POPULAR_VEGS = ['Tomatoes', 'Lettuce, Iceberg', 'Onions', 'Potatoes, Russet'];

function MarketsScreen({ commodities, market, setMarket, watchlist, toggleWatch, onOpen, todayStr, catFilter, setCatFilter }) {
  const [sortKey, setSortKey] = useState('wow');
  const [sortDir, setSortDir] = useState('desc');
  const [category, setCategory] = useState(catFilter || 'All');
  const [originFilter, setOriginFilter] = useState('All');
  const [trendFilter, setTrendFilter] = useState('All');
  const [watchOnly, setWatchOnly] = useState(false);
  const [searchQ, setSearchQ] = useState('');

  useEffect(() => { if (catFilter) setCategory(catFilter); }, [catFilter]);

  const popularFruit = useMemo(() => {
    const out = [];
    POPULAR_FRUITS.forEach(name => { const c = commodities.find(x => x.name.toLowerCase().includes(name.toLowerCase())); if (c) out.push(c); });
    if (out.length < 4) commodities.filter(c => c.cat === 'Fruits').slice(0, 4 - out.length).forEach(c => { if (!out.find(x => x.id === c.id)) out.push(c); });
    return out.slice(0, 4);
  }, [commodities]);

  const popularVeg = useMemo(() => {
    const out = [];
    POPULAR_VEGS.forEach(name => { const c = commodities.find(x => x.name.toLowerCase().includes(name.toLowerCase())); if (c) out.push(c); });
    if (out.length < 4) commodities.filter(c => c.cat === 'Vegetables').slice(0, 4 - out.length).forEach(c => { if (!out.find(x => x.id === c.id)) out.push(c); });
    return out.slice(0, 4);
  }, [commodities]);

  const watchItems = useMemo(() => commodities.filter(c => watchlist[c.id]).slice(0, 4), [commodities, watchlist]);

  const filtered = useMemo(() => {
    let list = [...commodities];
    if (category !== 'All') list = list.filter(c => c.cat === category);
    if (originFilter === 'Domestic') list = list.filter(c => c.origins.some(o => /(california|florida|washington|arizona|texas|georgia|oregon|michigan|idaho)/i.test(o)));
    if (originFilter === 'Imported') list = list.filter(c => c.origins.some(o => /(mexico|chile|peru|ecuador|guatemala|colombia|costa rica)/i.test(o)));
    if (trendFilter === 'Up today') list = list.filter(c => c.wow > 0.5);
    if (trendFilter === 'Down today') list = list.filter(c => c.wow < -0.5);
    if (watchOnly) list = list.filter(c => watchlist[c.id]);
    if (searchQ) { const q = searchQ.toLowerCase(); list = list.filter(c => c.name.toLowerCase().includes(q) || c.origins.some(o => o.toLowerCase().includes(q))); }
    list.sort((a, b) => {
      const get = r => sortKey === 'name' ? r.name : sortKey === 'low' ? priceForMarket(r, market).low : sortKey === 'high' ? priceForMarket(r, market).high : sortKey === 'mostly' ? priceForMarket(r, market).mostly : sortKey === 'wow' ? r.wow : r.name;
      const A = get(a), B = get(b);
      if (typeof A === 'number') return (A - B) * (sortDir === 'asc' ? 1 : -1);
      return String(A).localeCompare(String(B)) * (sortDir === 'asc' ? 1 : -1);
    });
    return list;
  }, [commodities, category, originFilter, trendFilter, watchOnly, searchQ, sortKey, sortDir, market, watchlist]);

  function sortBy(k) { if (sortKey === k) setSortDir(d => d === 'asc' ? 'desc' : 'asc'); else { setSortKey(k); setSortDir(k === 'name' ? 'asc' : 'desc'); } }
  const si = k => sortKey === k ? (sortDir === 'asc' ? '▲' : '▼') : '↕';
  const mLabel = market === 'ALL' ? 'All Markets' : (TERMINALS.find(t => t.code === market)?.city || market);

  return (
    <div className="page">
      <div className="hero">
        <div className="hero-l">
          <div className="hero-eyebrow">
            <span className="pill live">Live</span>
            <span>Wholesale produce prices</span>
            <span className="sep">·</span>
            <span>USDA AMS Market News</span>
          </div>
          <h1 className="hero-date">{fmtDate(todayStr)}</h1>
          <div className="hero-meta">
            <strong>{commodities.length} commodities</strong>
            <span className="sep">·</span>
            <span>Updated daily from USDA AMS</span>
          </div>
        </div>
        <div className="hero-r">
          <MarketPicker market={market} setMarket={setMarket} />
        </div>
      </div>

      {/* Popular cards */}
      <div className="popular-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 14, marginBottom: 20 }}>
        <PopularCard title="Popular fruit" subtitle="Today's wholesale prices" items={popularFruit} market={market} onOpen={onOpen} onSeeAll={() => setCategory('Fruits')} />
        <PopularCard title="Popular vegetables" subtitle="Today's wholesale prices" items={popularVeg} market={market} onOpen={onOpen} onSeeAll={() => setCategory('Vegetables')} />
        <div className="card">
          <div className="card-h">
            <div><h3>Your watchlist</h3><span className="sub">{Object.keys(watchlist).length} tracked</span></div>
          </div>
          {watchItems.length === 0 ? (
            <div style={{ padding: '20px 16px', color: 'var(--text-muted)', fontSize: 13, textAlign: 'center' }}>
              <div style={{ fontWeight: 500, color: 'var(--text)', marginBottom: 4 }}>No items yet</div>
              Star a commodity to track it here
            </div>
          ) : watchItems.map(c => {
            const p = priceForMarket(c, market);
            return (
              <div key={c.id} className="popular-row" onClick={() => onOpen(c.id)}>
                <Ico.StarF style={{ color: 'var(--accent)', width: 14, height: 14, flexShrink: 0 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 500, fontSize: 13 }}>{c.name}</div>
                  <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 1 }}>{c.origins.slice(0, 1).join(', ')}</div>
                </div>
                <Sparkline data={c.spark} w={60} h={18} />
                <div style={{ textAlign: 'right', minWidth: 72 }}>
                  <div style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13 }}>${p.mostly.toFixed(2)}</div>
                  <Delta pct={c.wow} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Filters */}
      <div className="fbar">
        <span className="label-eyebrow" style={{ marginRight: 4 }}>Category</span>
        {['All','Fruits','Vegetables','Onions & Potatoes','Nuts'].map(c => <button key={c} className={`chip ${category === c ? 'active' : ''}`} onClick={() => setCategory(c)}>{c}</button>)}
        <span style={{ width: 12 }} />
        <span className="label-eyebrow" style={{ marginRight: 4 }}>Origin</span>
        {['All','Domestic','Imported'].map(o => <button key={o} className={`chip ${originFilter === o ? 'active' : ''}`} onClick={() => setOriginFilter(o)}>{o}</button>)}
        <span style={{ width: 12 }} />
        {['Up today','Down today'].map(t => <button key={t} className={`chip ${trendFilter === t ? 'active' : ''}`} onClick={() => setTrendFilter(trendFilter === t ? 'All' : t)}>{t}</button>)}
        <span style={{ flex: 1 }} />
        <button className={`chip ${watchOnly ? 'active' : ''}`} onClick={() => setWatchOnly(w => !w)}>
          <Ico.Star /> Watchlist only
        </button>
      </div>

      {/* Table */}
      <div className="card" style={{ padding: 0 }}>
        <div className="card-h">
          <div>
            <h3>{mLabel} · wholesale prices</h3>
            <span className="sub">{filtered.length} commodities · prices in <span className="mono">USD per unit</span> · USDA terminal market</span>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <div className="search" style={{ maxWidth: 200 }}>
              <Ico.Search />
              <input value={searchQ} onChange={e => setSearchQ(e.target.value)} placeholder="Filter…" />
              {searchQ && <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-dim)', padding: 0 }} onClick={() => setSearchQ('')}><Ico.X /></button>}
            </div>
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead>
              <tr>
                <th style={{ width: 32 }}></th>
                <th className={`sortable ${sortKey === 'name' ? 'sorted' : ''}`} onClick={() => sortBy('name')}>Commodity <span className="sort-ind">{si('name')}</span></th>
                <th>Unit / Origin</th>
                <th className={`num sortable ${sortKey === 'low' ? 'sorted' : ''}`} onClick={() => sortBy('low')}>Low <span className="sort-ind">{si('low')}</span></th>
                <th className={`num sortable ${sortKey === 'high' ? 'sorted' : ''}`} onClick={() => sortBy('high')}>High <span className="sort-ind">{si('high')}</span></th>
                <th className={`num sortable ${sortKey === 'mostly' ? 'sorted' : ''}`} onClick={() => sortBy('mostly')}>Mostly <span className="sort-ind">{si('mostly')}</span></th>
                <th className={`num sortable ${sortKey === 'wow' ? 'sorted' : ''}`} onClick={() => sortBy('wow')}>WoW % <span className="sort-ind">{si('wow')}</span></th>
                <th>Supply</th>
                <th className="center">7-day</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const p = priceForMarket(c, market);
                return (
                  <tr key={c.id} onClick={() => onOpen(c.id)}>
                    <td><StarBtn on={!!watchlist[c.id]} onToggle={() => toggleWatch(c.id)} /></td>
                    <td><div style={{ fontWeight: 500 }}>{c.name}</div><div style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>{c.cat}</div></td>
                    <td className="muted" style={{ fontSize: 11.5 }}>{c.origins.slice(0, 2).join(', ')}</td>
                    <td className="num">${p.low.toFixed(2)}</td>
                    <td className="num">${p.high.toFixed(2)}</td>
                    <td className="num" style={{ fontWeight: 500 }}>${p.mostly.toFixed(2)}</td>
                    <td className="num"><Delta pct={c.wow} /></td>
                    <td><SupplyPill v={c.supply} /></td>
                    <td className="center"><Sparkline data={c.spark} w={70} h={20} /></td>
                  </tr>
                );
              })}
              {filtered.length === 0 && <tr><td colSpan={9} style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>No commodities match your filters</td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{ padding: '10px 16px', borderTop: '1px solid var(--border-soft)', fontSize: 11.5, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>
          {filtered.length} of {commodities.length} commodities · {fmtShort(todayStr)}
        </div>
      </div>
    </div>
  );
}

// ── Commodity Detail ──────────────────────────────────────────────────────────
function CommodityScreen({ c, market, setMarket, watchlist, toggleWatch, onBack, allComms, onOpen, todayStr }) {
  if (!c) return null;
  const p = priceForMarket(c, market);
  const spread = c.fobAvg ? c.mostly - c.fobAvg : null;
  const termMarkets = useMemo(() => {
    const byM = {};
    c.termRows.forEach(r => {
      const code = marketCodeFromName(r.market);
      if (!code) return;
      const info = TERMINALS.find(t => t.code === code);
      if (!info) return;
      if (!byM[code]) byM[code] = { code, city: info.city, region: info.region, prices: [], movement: null };
      byM[code].prices.push(parseFloat(r.price_low));
      if (r.movement) byM[code].movement = r.movement;
    });
    return Object.values(byM).map(m => ({
      ...m, low: Math.min(...m.prices), high: Math.max(...m.prices),

  const idx = allComms.findIndex(x => x.id === c.id);

            {c.name.slice(0, 2).toUpperCase()}

            <div className="hero-eyebrow" style={{ marginBottom: 6 }}><span>{c.cat}</span><span className="sep">·</span><span>{c.origins.slice(0, 2).join(', ')}</span></div>

      <div className="card" style={{ display: 'flex', padding: 0, marginBottom: 18 }}>
        <div className="kpi" style={{ flex: 2 }}>
          <span className="l">Average price today</span>
          <span className="v lg num">${p.mostly.toFixed(2)}</span>

            </div>
          </div>
          <div className="sc-arrow"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></div>
          <div className="sc-col">
            <div className="sc-col-h"><span className="sc-step">3</span><div><div className="sc-title">Terminal Market</div><div className="sc-sub">Wholesale landed price</div></div></div>
            <div className="sc-rows">
              {termMarkets.slice(0, 4).map((m, i) => (
                <div key={i} className="sc-row">
                  <div className="sc-row-l"><div className="sc-row-name">{m.city}</div><div className="sc-row-meta">{m.region}</div></div>
                  <div className="sc-row-r"><span className="sc-row-val">${m.mostly.toFixed(2)}</span></div>
                </div>
              ))}
            </div>
            <div className="sc-foot"><span>National avg</span><span className="mono" style={{ fontWeight: 500 }}>${c.mostly.toFixed(2)}</span></div>
          </div>
        </div>
        {c.supplyNote && <div className="sc-reading"><p className="sc-reading-text">{c.supplyNote}</p></div>}
      </div>

      <div className="card" style={{ marginBottom: 18 }}>
        <div className="card-h"><h3>All terminal markets · {fmtShort(todayStr)}</h3><span className="sub">{termMarkets.length} cities reporting</span></div>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead><tr><th>City</th><th>Region</th><th className="num">Low</th><th className="num">High</th><th className="num">Mostly</th><th>Movement</th></tr></thead>
            <tbody>
              {termMarkets.map(m => (
                <tr key={m.code} className={m.code === market ? 'is-selected' : ''}>
                  <td style={{ fontWeight: 500 }}>{m.city}</td>
                  <td className="muted">{m.region}</td>
                  <td className="num">${m.low.toFixed(2)}</td>
                  <td className="num">${m.high.toFixed(2)}</td>
                  <td className="num" style={{ fontWeight: 500 }}>${m.mostly.toFixed(2)}</td>
                  <td><SupplyPill v={m.movement} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {c.fobRows.length > 0 && (
        <div className="card">
          <div className="card-h"><h3>Shipping-point / FOB origin prices</h3></div>
          <div style={{ overflowX: 'auto' }}>
            <table className="dt">
              <thead><tr><th>Origin</th><th>Variety / Package</th><th className="num">FOB Low</th><th className="num">FOB High</th><th>Movement</th></tr></thead>
              <tbody>
                {c.fobRows.map((r, i) => (
                  <tr key={i}>
                    <td style={{ fontWeight: 500 }}>{r.origin || r.market || '—'}</td>
                    <td className="muted" style={{ fontSize: 12 }}>{[r.variety, r.package].filter(Boolean).join(' · ') || '—'}</td>
                    <td className="num">${parseFloat(r.price_low).toFixed(2)}</td>
                    <td className="num">{r.price_high ? '$' + parseFloat(r.price_high).toFixed(2) : '—'}</td>
                    <td><SupplyPill v={r.movement} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Watchlist Screen ──────────────────────────────────────────────────────────
function WatchlistScreen({ commodities, watchlist, toggleWatch, onOpen, market, todayStr }) {
  const items = commodities.filter(c => watchlist[c.id]);
  return (
    <div className="page">
      <div className="page-h"><div><h1 className="page-title">Watchlist</h1><p className="page-sub">{fmtDate(todayStr)} · {items.length} commodities tracked</p></div></div>
      {items.length === 0 ? (
        <div className="card"><div className="empty"><h4>No commodities yet</h4><p>Star any commodity to track it here.</p></div></div>
      ) : (
        <div className="card" style={{ padding: 0 }}>
          <table className="dt">
            <thead><tr><th style={{ width: 32 }}></th><th>Commodity</th><th>Origins</th><th className="num">Low</th><th className="num">High</th><th className="num">Mostly</th><th className="num">WoW %</th><th>Supply</th></tr></thead>
            <tbody>
              {items.map(c => {
                const p = priceForMarket(c, market);
                return (
                  <tr key={c.id} onClick={() => onOpen(c.id)}>
                    <td><StarBtn on onToggle={() => toggleWatch(c.id)} /></td>
                    <td><div style={{ fontWeight: 500 }}>{c.name}</div><div style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>{c.cat}</div></td>
                    <td className="muted" style={{ fontSize: 11.5 }}>{c.origins.slice(0, 2).join(', ')}</td>
                    <td className="num">${p.low.toFixed(2)}</td>
                    <td className="num">${p.high.toFixed(2)}</td>
                    <td className="num" style={{ fontWeight: 500 }}>${p.mostly.toFixed(2)}</td>
                    <td className="num"><Delta pct={c.wow} /></td>
                    <td><SupplyPill v={c.supply} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── Shipping Screen ───────────────────────────────────────────────────────────
function ShippingScreen({ allRows, todayStr, onOpen }) {
  const rows = allRows.filter(r => r.market_type === 'shipping_point' && r.market !== 'National Trends' && r.price_low != null);
  const [q, setQ] = useState('');
  const filtered = q ? rows.filter(r => r.commodity.toLowerCase().includes(q.toLowerCase()) || (r.origin || '').toLowerCase().includes(q.toLowerCase())) : rows;
  return (
    <div className="page">
      <div className="page-h">
        <div><h1 className="page-title">Shipping Points</h1><p className="page-sub">F.O.B. origin pricing · {fmtDate(todayStr)}</p></div>
        <div className="search" style={{ maxWidth: 260 }}><Ico.Search /><input value={q} onChange={e => setQ(e.target.value)} placeholder="Search commodity or origin…" /></div>
      </div>
      <div className="card" style={{ padding: 0 }}>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead><tr><th>Commodity</th><th>Origin</th><th>Hub</th><th>Package</th><th className="num">FOB Low</th><th className="num">FOB High</th><th>Movement</th></tr></thead>
            <tbody>
              {filtered.map((r, i) => (
                <tr key={i} onClick={() => onOpen(r.commodity.toLowerCase().replace(/[^a-z0-9]+/g, '-'))}>
                  <td style={{ fontWeight: 500 }}>{r.commodity}</td>
                  <td className="muted">{r.origin || '—'}</td>
                  <td className="muted" style={{ fontSize: 11.5 }}>{r.market || '—'}</td>
                  <td className="muted" style={{ fontSize: 11.5 }}>{r.package || '—'}</td>
                  <td className="num">${parseFloat(r.price_low).toFixed(2)}</td>
                  <td className="num">{r.price_high ? '$' + parseFloat(r.price_high).toFixed(2) : '—'}</td>
                  <td><SupplyPill v={r.movement} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Search Overlay ────────────────────────────────────────────────────────────
function SearchOverlay({ commodities, onClose, onOpen }) {
  const [q, setQ] = useState('');
  const [active, setActive] = useState(0);
  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  const results = useMemo(() => {
    if (!q.trim()) return commodities.slice(0, 8);
    const ql = q.toLowerCase();
    return commodities.filter(c => c.name.toLowerCase().includes(ql) || c.cat.toLowerCase().includes(ql) || c.origins.some(o => o.toLowerCase().includes(ql)));
  }, [q, commodities]);
  useEffect(() => { setActive(0); }, [q]);
  function onKey(e) {
    if (e.key === 'Escape') onClose();
    else if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(results.length - 1, a + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(0, a - 1)); }
    else if (e.key === 'Enter' && results[active]) onOpen(results[active].id);
  }
  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="panel" onClick={e => e.stopPropagation()}>
        <div className="field">
          <Ico.Search />
          <input ref={ref} value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey} placeholder="Search commodities, origins…" />
          <kbd>esc</kbd>
        </div>
        <div className="results">
          <div className="group-h">{q ? `${results.length} results` : 'Top movers today'}</div>
          {results.map((c, i) => (
            <div key={c.id} className={`result ${i === active ? 'active' : ''}`} onMouseEnter={() => setActive(i)} onClick={() => onOpen(c.id)}>
              <span className="mono" style={{ fontSize: 10, color: 'var(--text-dim)', minWidth: 80, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{c.cat}</span>
              <div><div className="cmd-name">{c.name}</div><div className="cmd-cat">{c.origins.slice(0, 2).join(', ')}</div></div>
              <div style={{ textAlign: 'right' }}><div className="num" style={{ fontWeight: 500 }}>${c.mostly.toFixed(2)}</div><Delta pct={c.wow} /></div>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', padding: '8px 18px', borderTop: '1px solid var(--border)', gap: 16, fontSize: 11, color: 'var(--text-dim)' }}>
          <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>
  );
}

// ── Loading ───────────────────────────────────────────────────────────────────
function LoadingScreen() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 16, background: 'var(--bg)' }}>
      <div style={{ width: 40, height: 40, borderRadius: 8, background: 'var(--accent)', display: 'grid', placeItems: 'center', color: 'white', fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 18 }}>a</div>
      <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>Loading USDA market data…</div>
      <div style={{ width: 180, height: 3, background: 'var(--bg-2)', borderRadius: 99, overflow: 'hidden' }}>
        <div style={{ height: '100%', background: 'var(--accent)', borderRadius: 99, animation: 'lb 1.4s ease-in-out infinite' }} />
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [todayStr, setTodayStr] = useState('');
  const [allRows, setAllRows] = useState([]);
  const [commodities, setCommodities] = useState([]);
  const [route, setRoute] = useState('commodities');
  const [openId, setOpenId] = useState(null);
  const [catFilter, setCatFilter] = useState(null);
  const [market, setMarket] = useState('NYC');
  const [watchlist, setWatchlist] = useState({});
  const [searchOpen, setSearchOpen] = useState(false);
  const [dark, setDark] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearchOpen(true); }
      if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); setSearchOpen(true); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => {
    async function load() {
      try {
        const dates = await fetch(`${API}/dates`).then(r => r.json());
        if (!dates.length) throw new Error('No dates available');
        const today = dates[0].date;
        setTodayStr(today);
        const rows = await fetch(`${API}/commodities/by-date/${today}`).then(r => r.json());
        setAllRows(rows);
        let prev = [];
        if (dates.length > 1) {
          const prevDate = dates[Math.min(6, dates.length - 1)].date;
          prev = await fetch(`${API}/commodities/by-date/${prevDate}`).then(r => r.json()).catch(() => []);
        }
        setCommodities(buildCommodities(rows, prev));
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  function toggleWatch(id) { setWatchlist(w => { const n = { ...w }; n[id] ? delete n[id] : (n[id] = true); return n; }); }
  function openCommodity(id) { setSearchOpen(false); setOpenId(id); setRoute('commodity'); }

  const openComm = useMemo(() => route === 'commodity' && openId ? commodities.find(c => c.id === openId) || null : null, [openId, route, commodities]);
  const watchCount = Object.keys(watchlist).length;

  const commTree = useMemo(() => {
    const tree = { Fruits: [], Vegetables: [], 'Onions & Potatoes': [], Nuts: [] };
    [...commodities].sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
      if (tree[c.cat]) tree[c.cat].push({ name: c.name, id: c.id });
    });
    return tree;
  }, [commodities]);

  if (loading) return <LoadingScreen />;
  if (error) return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 16 }}>
      <div style={{ color: 'var(--negative)', fontWeight: 600 }}>Failed to load USDA data</div>
      <div style={{ color: 'var(--text-muted)', fontSize: 12 }}>{error}</div>
      <button className="btn primary" onClick={() => window.location.reload()}><Ico.Refresh /> Retry</button>
    </div>
  );

  return (
    <div className="app">
      {/* Horizontal appbar — matches Claude Design exactly */}
      <header className="appbar">
        <a className="appbar-brand" href="/">
          <svg className="logo-mark" viewBox="0 0 36 36" fill="none">
            <rect width="36" height="36" rx="8" fill="#15803d"/>
            <path d="M8 18 Q18 8 28 18 Q18 28 8 18Z" fill="rgba(255,255,255,0.25)"/>
            <path d="M18 8 Q28 18 18 28 Q8 18 18 8Z" fill="rgba(255,255,255,0.55)"/>
            <circle cx="18" cy="18" r="3.5" fill="#fff"/>
          </svg>
          <div className="wm">agra<span className="x">X</span></div>
        </a>

        <nav className="topnav">
          <TopNavItem icon={<Ico.Home />} label="Today" active={route === 'today'}
            onClick={() => { setRoute('commodities'); setOpenId(null); setCatFilter(null); }} />

          <TopNavMenu icon={<Ico.Grid />} label="Commodities" active={route === 'commodities' || route === 'commodity'}>
            <button className="tnd-item" onClick={() => { setRoute('commodities'); setOpenId(null); setCatFilter(null); }}>
              <span>All commodities</span><span className="tnd-count">{commodities.length}</span>
            </button>
            <div className="tnd-sep" />
            {['Fruits', 'Vegetables', 'Onions & Potatoes', 'Nuts'].map(cat => (
              <button key={cat} className="tnd-item" onClick={() => { setCatFilter(cat); setRoute('commodities'); setOpenId(null); }}>
                <span>{cat}</span><span className="tnd-count">{(commTree[cat] || []).length}</span>
              </button>
            ))}
          </TopNavMenu>

          <TopNavMenu icon={<Ico.Map />} label="Terminal markets" active={false}>
            <button className="tnd-item" onClick={() => { setMarket('ALL'); setRoute('commodities'); }}>
              <span>All terminal markets</span><span className="tnd-count">12</span>
            </button>
            <div className="tnd-sep" />
            <div className="tnd-scroll">
              {TERMINALS.slice(1).map(t => (
                <button key={t.code} className="tnd-item" onClick={() => { setMarket(t.code); setRoute('commodities'); }}>
                  <span>{t.city}, {t.state}</span><span className="tnd-count">{t.region}</span>
                </button>
              ))}
            </div>
          </TopNavMenu>

          <TopNavItem icon={<Ico.Truck />} label="Shipping points" active={route === 'shipping'}
            onClick={() => setRoute('shipping')} />

          <span className="topnav-div" />

          <TopNavItem icon={<Ico.Star />} label="Watchlist" badge={watchCount || null}
            active={route === 'watchlist'} onClick={() => setRoute('watchlist')} />
        </nav>

        <div className="appbar-right">
          <button className="appbar-search" onClick={() => setSearchOpen(true)} aria-label="Search">
            <Ico.Search />
            <span className="appbar-search-text">Search commodities…</span>
            <span className="appbar-search-kbd">⌘K</span>
          </button>
          <button className="appbar-icon-btn hide-mobile" onClick={() => setDark(d => !d)} title="Toggle dark mode"><Ico.Sun /></button>
          <div className="appbar-avatar">AX</div>
        </div>{/* end appbar-right */}
      </header>

      {/* Main */}
      <main className="main">
        {(route === 'commodities' || route === 'today') && (
          <MarketsScreen commodities={commodities} market={market} setMarket={setMarket}
            watchlist={watchlist} toggleWatch={toggleWatch} onOpen={openCommodity}
            todayStr={todayStr} catFilter={catFilter} setCatFilter={setCatFilter} />
        )}
        {route === 'commodity' && openComm && (
          <CommodityScreen c={openComm} market={market} setMarket={setMarket}
            watchlist={watchlist} toggleWatch={toggleWatch}
            onBack={() => { setRoute('commodities'); setOpenId(null); }}
            allComms={commodities} onOpen={openCommodity} todayStr={todayStr} />
        )}
        {route === 'watchlist' && (
          <WatchlistScreen commodities={commodities} watchlist={watchlist}
            toggleWatch={toggleWatch} onOpen={openCommodity} market={market} todayStr={todayStr} />
        )}
        {route === 'shipping' && (
          <ShippingScreen allRows={allRows} todayStr={todayStr} onOpen={openCommodity} />
        )}
      </main>

      {/* Status bar */}
      <div className="statusbar">
        <span><span className="dot" />Connected · USDA AMS</span>
        <span className="sep">|</span>
        <span>{fmtShort(todayStr)}</span>
        <span className="sep">|</span>
        <span>{commodities.length} commodities · {allRows.filter(r => r.market_type === 'terminal').length} terminal listings</span>
      </div>

      {/* Mobile bottom nav */}
      <div className="mob-nav">
        <button className={`mob-nav-btn ${(route==='commodities'||route==='commodity'||route==='today')?'active':''}`} onClick={() => { setRoute('commodities'); setOpenId(null); setCatFilter(null); }}>
          <Ico.Grid /><span>Markets</span>
        </button>
        <button className="mob-nav-btn" onClick={() => setSearchOpen(true)}>
          <Ico.Search /><span>Search</span>
        </button>
        <button className={`mob-nav-btn ${route==='watchlist'?'active':''}`} onClick={() => setRoute('watchlist')} style={{ position: 'relative' }}>
          <Ico.Star /><span>Watchlist</span>
          {watchCount > 0 && <span className="mob-nav-badge">{watchCount}</span>}
        </button>
        <button className={`mob-nav-btn ${route==='shipping'?'active':''}`} onClick={() => setRoute('shipping')}>
          <Ico.Truck /><span>Shipping</span>
        </button>
      </div>

      {searchOpen && <SearchOverlay commodities={commodities} onClose={() => setSearchOpen(false)} onOpen={openCommodity} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
