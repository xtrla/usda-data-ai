/* Desktop and mobile are two separate layouts in the design export, not one
   fluid grid. Both are rendered; this picks which is painted. 900px is the
   breakpoint the design was authored against. */
.dc-narrow { display: none; }
@media (max-width: 899px) {
  .dc-wide   { display: none; }
  .dc-narrow { display: block; }
}

/* iOS Safari zooms the page when a focused input has a font smaller than
   16px. The design's inputs are 13-15px, which is right for desktop, so the
   size is bumped only on touch layouts rather than changing the design.
   Using maximum-scale in the viewport tag would also stop the zoom, but it
   disables pinch-zoom for everyone, which is an accessibility regression. */
@media (max-width: 899px) {
  input, select, textarea { font-size: 16px !important; }
}

/* Search suggestions. Positioned against the input's own wrapper so the
   dropdown tracks the field on both layouts without duplicating markup. */
.agx-sug {
  position: absolute; z-index: 200; left: 0; right: 0; top: calc(100% + 6px);
  background: #fff; border: 1px solid #E4E6DF; border-radius: 10px;
  box-shadow: 0 8px 28px rgba(23,26,22,0.13); overflow: hidden; display: none;
}
.agx-sug[data-open] { display: block; }
.agx-sug__item {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  padding: 10px 14px; border: 0; background: none; cursor: pointer;
  text-align: left; font-family: inherit; border-bottom: 1px solid #F1F2ED;
}
.agx-sug__item:last-child { border-bottom: 0; }
.agx-sug__item:hover, .agx-sug__item[data-active] { background: #F4F6F1; }
.agx-sug__label { font-size: 13px; font-weight: 500; color: #171A16; }
.agx-sug__sub { font-size: 11.5px; color: #8A8F86; margin-left: auto; white-space: nowrap; }
@media (max-width: 899px) { .agx-sug__item { padding: 13px 14px; } }

/* Mobile data density.
 *
 * The mobile layout stacks each price into a labelled block, which is
 * readable but shows only two or three prices per screen — a buyer comparing
 * eight packs ends up scrolling past most of them. These rules tighten the
 * rhythm and let the price tables use the full width of the device rather
 * than sitting inside the page gutter.
 *
 * The commodity column is pinned so the variety stays visible while the
 * numeric columns scroll sideways. Without it, scrolling right to reach
 * Spread leaves you looking at figures with nothing identifying them.
 */
@media (max-width: 899px) {
  /* Full-bleed tables: escape the page padding, keep everything else inset. */
  .dc-narrow [data-table-scroll] {
    margin-left: -14px;
    margin-right: -14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .dc-narrow [data-table-scroll]::-webkit-scrollbar { display: none; }

  /* Tighter rows. The design's phone spacing is generous for reading one
     price; these tables are for comparing many. */
  .dc-narrow [data-price-row] { padding-top: 9px !important; padding-bottom: 9px !important; }
  .dc-narrow [data-com-row]   { padding-top: 11px !important; padding-bottom: 11px !important; }

  /* Pinned first column. */
  .dc-narrow [data-sticky-col] {
    position: sticky;
    left: 0;
    z-index: 2;
    background: inherit;
    padding-left: 14px;
    box-shadow: 1px 0 0 #EDEEE9;
  }
}

        <div style="display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid #EDEEE9">

          <span data-on-click="onClearAll" style="margin-left:auto;font-size:11.5px;color:#6B7268;cursor:pointer">Clear all</span>
          <span data-on-click="onCloseSheet" style="width:30px;height:30px;border-radius:7px;border:1px solid #E4E6DF;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#171A16" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </span>
        </div>
        <template data-for="filterGroups" data-as="g">
          <div style="padding:12px 0 4px">
            <span style="display:block;font-size:11px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">{{ g.title }}</span>
            <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:9px">
              <template data-for="g.options" data-as="o">
                <button type="button" aria-pressed="{{ o.on }}" data-filter-kind="{{ o.filterKind }}" data-filter-key="{{ o.filterKey }}" data-filter-selected="{{ o.on }}" data-on-click="o.onToggle" style="min-height:40px;font-family:inherit;padding:0 12px;border-radius:17px;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;white-space:nowrap;cursor:pointer;background:{{ o.chipBg }};color:{{ o.chipFg }};border:1px solid {{ o.chipBd }}"><template data-if="o.on"><span aria-hidden="true">✓</span></template>{{ o.name }}
                  <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;opacity:0.7">{{ o.count }}</span>
                </button>
              </template>
            </div>
          </div>
        </template>
        <span class="browse-filter-apply" data-on-click="onCloseSheet" style="margin-top:14px;height:46px;border-radius:7px;background:#186B39;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer">{{ mSheetApplyTxt }}</span>
      </div>
    </template>
  </div>
  </template>
</div>

</template>
