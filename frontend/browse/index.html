<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse prices — AgraX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; }
  body { margin:0; background:#F5F5F2; font-family:'Geist',system-ui,sans-serif; color:#171A16; -webkit-font-smoothing:antialiased; }
  a { color:#186B39; text-decoration:none; }
  a:hover { color:#14562F; }
  input { font-family:inherit; color:#171A16; }
  input::placeholder { color:#8A8F86; }

/* hover rules lifted from style-hover */
.h0:hover{background:#14562F !important}
.h1:hover{background:#14562F;color:#fff !important}
.h2:hover{background:#E3EFE6 !important}
.h3:hover{background:#E8EAE4 !important}
.h4:hover{background:#F4F4F0 !important}
.h5:hover{background:#FAFBF9 !important}
.h6:hover{background:#fff !important}
.h7:hover{border-color:#186B39 !important}
.h8:hover{border-color:#186B39;color:#186B39 !important}
.h9:hover{color:#186B39 !important}
.h10:hover{color:#6B4F17 !important}
.h11:hover{color:#fff !important}

/* Desktop and mobile are two separate layouts in the design export, not one
   fluid grid. Both are rendered; this picks which is painted. 900px is the
   breakpoint the design was authored against. */
.dc-narrow { display: none; }
@media (max-width: 899px) {
  .dc-wide   { display: none; }
  .dc-narrow { display: block; }
}

/* iOS Safari zooms the page when a focused input has a font smaller than
   16px. The design's inputs are 13-15px, which is right for desktop, so the
   size is bumped only on touch layouts rather than changing the design.
   Using maximum-scale in the viewport tag would also stop the zoom, but it
   disables pinch-zoom for everyone, which is an accessibility regression. */
@media (max-width: 899px) {
  input, select, textarea { font-size: 16px !important; }
}

/* Search suggestions. Positioned against the input's own wrapper so the
   dropdown tracks the field on both layouts without duplicating markup. */
.agx-sug {
  position: absolute; z-index: 200; left: 0; right: 0; top: calc(100% + 6px);
  background: #fff; border: 1px solid #E4E6DF; border-radius: 10px;
  box-shadow: 0 8px 28px rgba(23,26,22,0.13); overflow: hidden; display: none;
}
.agx-sug[data-open] { display: block; }
.agx-sug__item {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  padding: 10px 14px; border: 0; background: none; cursor: pointer;
  text-align: left; font-family: inherit; border-bottom: 1px solid #F1F2ED;
}
.agx-sug__item:last-child { border-bottom: 0; }
.agx-sug__item:hover, .agx-sug__item[data-active] { background: #F4F6F1; }
.agx-sug__label { font-size: 13px; font-weight: 500; color: #171A16; }
.agx-sug__sub { font-size: 11.5px; color: #8A8F86; margin-left: auto; white-space: nowrap; }
@media (max-width: 899px) { .agx-sug__item { padding: 13px 14px; } }

/* Mobile data density.
 *
 * The mobile layout stacks each price into a labelled block, which is
 * readable but shows only two or three prices per screen — a buyer comparing
 * eight packs ends up scrolling past most of them. These rules tighten the
 * rhythm and let the price tables use the full width of the device rather
 * than sitting inside the page gutter.
 *
 * The commodity column is pinned so the variety stays visible while the
 * numeric columns scroll sideways. Without it, scrolling right to reach
 * Spread leaves you looking at figures with nothing identifying them.
 */
@media (max-width: 899px) {
  /* Full-bleed tables: escape the page padding, keep everything else inset. */
  .dc-narrow [data-table-scroll] {
    margin-left: -14px;
    margin-right: -14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .dc-narrow [data-table-scroll]::-webkit-scrollbar { display: none; }

  /* Tighter rows. The design's phone spacing is generous for reading one
     price; these tables are for comparing many. */
  .dc-narrow [data-price-row] { padding-top: 9px !important; padding-bottom: 9px !important; }
  .dc-narrow [data-com-row]   { padding-top: 11px !important; padding-bottom: 11px !important; }

  /* Pinned first column. */
  .dc-narrow [data-sticky-col] {
    position: sticky;
    left: 0;
    z-index: 2;
    background: inherit;
    padding-left: 14px;
    box-shadow: 1px 0 0 #EDEEE9;
  }
}
</style>
</head>
<body>

<!-- Markup exported from Claude Design, unmodified apart from link targets. -->
<template id="page-template">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; background:#F5F5F2; font-family:'Geist',system-ui,sans-serif; color:#171A16; -webkit-font-smoothing:antialiased; }
  a { color:#186B39; text-decoration:none; }
  a:hover { color:#14562F; }
  input { font-family:inherit; color:#171A16; }
  input::placeholder { color:#8A8F86; }
</style>


<div style="min-height:100vh;display:flex;flex-direction:column">

  <template data-if="wide">
  <header style="background:#fff;border-bottom:1px solid #EDEEE9;padding:0 20px;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <a href="/" style="flex:none;min-height:52px;display:inline-flex;align-items:center" aria-label="AgraX"><span style="width:66px;height:24px;display:block;background:#072B18;-webkit-mask-image:url(/assets/agrax-logo-white-cropped.png);mask-image:url(/assets/agrax-logo-white-cropped.png);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center"></span></a>
    <nav style="display:flex;align-items:center;gap:2px;flex:none">
      <span style="height:30px;padding:0 12px;border-radius:15px;background:#EFF1EB;color:#072B18;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer">Home</span>
      <a href="/browse" style="height:30px;padding:0 12px;border-radius:15px;color:#6B7268;font-size:13px;font-weight:500;display:inline-flex;align-items:center" class="h4">Browse</a>
      <span style="height:30px;padding:0 12px;border-radius:15px;color:#6B7268;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h4">Movers</span>
      <span style="height:30px;padding:0 12px;border-radius:15px;color:#6B7268;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h4">Watchlist</span>
      <span style="height:30px;padding:0 12px;border-radius:15px;color:#6B7268;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h4">Reports</span>
    </nav>
    <!-- Browse needs search in the header. On the home page search lives in
         the hero, so the shared header has none; here there is no hero and
         search is the fastest route to a commodity. Styled to match the rest
         of the header rather than reintroducing the old dark bar. -->
    <div style="flex:1;min-width:150px;max-width:340px;position:relative;display:flex;align-items:center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8F86" stroke-width="2.2" stroke-linecap="round" style="position:absolute;left:11px;pointer-events:none"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input data-search-input data-value="query" data-on-change="onQuery" placeholder="Commodity, variety, origin" style="width:100%;height:32px;background:#F4F4F0;border:1px solid #EDEEE9;border-radius:16px;padding:0 14px 0 32px;font-size:13px;color:#171A16;outline:none">
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#6B7268;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#186B39"></span>{{ stamp }}</span>
      <span style="height:30px;padding:0 14px;border-radius:15px;background:#186B39;color:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h0">Sign in</span>
    </div>
    </div>
  </header>

  <div style="flex:1;width:100%;max-width:1480px;margin:0 auto;display:flex;flex-direction:column;padding:14px 20px 28px;box-sizing:border-box">

    <main data-shot="wide" style="min-width:0;display:flex;flex-direction:column;gap:12px">

      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span data-on-click="onToggleOverview" style="height:28px;padding:0 10px;border-radius:7px;border:1px solid #E4E6DF;background:#fff;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap" class="h7">
            <template data-if="overviewOpen"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg></template>
            <template data-if="overviewClosed"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></template>
            {{ overviewToggleTxt }}
          </span>
          <template data-if="overviewClosed">
            <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <span style="font-size:13px;font-weight:600;letter-spacing:-0.015em">{{ overview.title }}</span>
              <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#6B7268">{{ overview.collapsedMeta }}</span>
            </span>
          </template>
        </div>

        <template data-if="overviewOpen">
        <div style="display:flex;gap:12px;align-items:stretch;flex-wrap:nowrap;height:184px">
        <div data-shot="terminals" style="flex:0 0 216px;min-height:0;background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column">
          <div style="flex:none;min-height:34px;padding:7px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid #E4E6DF">
            <span style="font-size:11.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Terminal markets</span>
          </div>
          <div style="flex:1;height:0;min-height:0;overflow-y:auto;scrollbar-width:thin" data-market-rail>
            <template data-for="terminals" data-as="t">
              <span data-active-pill="{{ t.activeFlag }}" data-on-click="t.onSelect" style="position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-bottom:1px solid #EDEEE9;cursor:pointer" class="h5">
                <template data-if="t.active"><span style="position:absolute;inset:0;background:#F0F6F1;box-shadow:inset 3px 0 0 #186B39"></span></template>
                <template data-if="t.up"><span style="position:relative;width:5px;height:5px;border-radius:50%;background:#186B39;flex:none"></span></template>
                <template data-if="t.down"><span style="position:relative;width:5px;height:5px;border-radius:50%;background:#8A4B2A;flex:none"></span></template>
                <template data-if="t.flat"><span style="position:relative;width:5px;height:5px;border-radius:50%;border:1px solid #6B7268;flex:none"></span></template>
                <span style="position:relative;min-width:0;flex:1;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.name }}</span>
                <span style="position:relative;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:#6B7268;font-variant-numeric:tabular-nums">{{ t.skuCount }}</span>
                <span style="position:relative;font-size:10.5px;color:#4A5148;white-space:nowrap;width:44px;text-align:right">{{ t.toneTxt }}</span>
              </span>
            </template>
          </div>
        </div>

        <div data-shot="overview" style="flex:1 1 0;min-width:0;min-height:0;background:#fff;border-radius:10px;padding:14px 20px 12px;display:flex;flex-direction:column;overflow:hidden">
          <div style="flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:24px">
            <div style="min-width:0">
              <h1 style="margin:0;font-size:26px;font-weight:600;letter-spacing:-0.032em;line-height:1.02">{{ overview.title }}</h1>
              <div style="margin-top:4px;font-size:12px;color:#6B7268;letter-spacing:-0.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ overview.subtitle }}</div>
            </div>
            <div style="flex:none;text-align:right">
              <div style="font-size:13px;color:#6B7268;letter-spacing:-0.005em;white-space:nowrap">{{ overview.dateTxt }}</div>
              <div style="margin-top:6px;display:flex;align-items:baseline;gap:7px;justify-content:flex-end">
                <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums">{{ overview.tempNow }}</span>
                <span style="font-size:12px;color:#8A8F86;white-space:nowrap">{{ overview.precip }}</span>
              </div>
            </div>
          </div>

          <div style="flex:none;display:flex;align-items:flex-end;gap:30px;margin-top:12px;padding-top:11px;border-top:1px solid #E8EAE4">
            <div style="min-width:0">
              <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:23px;font-weight:500;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums">{{ overview.skusTxt }}</div>
              <div style="margin-top:5px;font-size:11.5px;color:#6B7268;letter-spacing:-0.005em">Prices reporting</div>
            </div>
            <div style="min-width:0">
              <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:23px;font-weight:500;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums">{{ overview.commoditiesTxt }}</div>
              <div style="margin-top:5px;font-size:11.5px;color:#6B7268;letter-spacing:-0.005em">Commodities</div>
            </div>
            <div style="min-width:0">
              <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:23px;font-weight:500;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums">{{ overview.districtsTxt }}</div>
              <div style="margin-top:5px;font-size:11.5px;color:#6B7268;letter-spacing:-0.005em">Shipping points</div>
            </div>
            <div style="min-width:0">
              <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:23px;font-weight:500;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums">{{ overview.tempRange }}</div>
              <div style="margin-top:5px;font-size:11.5px;color:#6B7268;letter-spacing:-0.005em">Temperature 7am</div>
            </div>
          </div>

          <div style="flex:none;height:30px;display:flex;align-items:center;gap:9px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-top:11px">
            <span style="flex:none;font-size:12px;color:#8A8F86;letter-spacing:-0.005em;white-space:nowrap">Today's reports</span>
            <template data-for="reports" data-as="r">
              <span style="flex:none;display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 11px;border-radius:13px;background:#F4F4F0;cursor:pointer;white-space:nowrap" class="h3">
                <span style="font-size:11.5px;font-weight:600;letter-spacing:-0.01em">{{ r.name }}</span>
                <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;color:#186B39">{{ r.code }}</span>
                <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;color:#6B7268">{{ r.skusTxt }}</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4A5148" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><polyline points="7 11 12 16 17 11"></polyline><line x1="5" y1="20" x2="19" y2="20"></line></svg>
              </span>
            </template>
          </div>
        </div>
        </div>
        </template>
      </div>

      <div style="background:#fff;border:1px solid #EDEEE9;border-radius:10px;overflow:hidden;display:flex;align-items:stretch;flex-wrap:wrap">

        <aside style="width:228px;flex:none;border-right:1px solid #EDEEE9;padding:16px 14px 20px;display:flex;flex-direction:column;gap:22px">
          <template data-for="filterGroups" data-as="g">
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;padding:0 8px 7px">
              <span style="font-size:12px;font-weight:600;letter-spacing:-0.01em;color:#171A16">{{ g.title }}</span>
              <template data-if="g.dirty"><span data-on-click="g.onClear" style="margin-left:auto;font-size:12px;color:#186B39;cursor:pointer">Clear</span></template>
            </div>
            <template data-for="g.options" data-as="o">
              <div data-on-click="o.onToggle" style="position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:7px;cursor:pointer" class="h4">
                <template data-if="o.on"><span style="position:absolute;inset:0;border-radius:7px;background:#F0F6F1"></span></template>
                <template data-if="o.dotMostly"><span style="position:relative;width:6px;height:6px;border-radius:50%;background:#186B39;flex:none"></span></template>
                <template data-if="o.dotMid"><span style="position:relative;width:6px;height:6px;border-radius:50%;background:#C9922F;flex:none"></span></template>
                <template data-if="o.dotReported"><span style="position:relative;width:6px;height:6px;border-radius:50%;border:1px solid #8A8F86;flex:none"></span></template>
                <span style="position:relative;min-width:0;font-size:13px;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.name }}</span>
                <span style="position:relative;margin-left:auto;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#8A8F86;font-variant-numeric:tabular-nums">{{ o.count }}</span>
                <template data-if="o.on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#186B39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position:relative;flex:none"><polyline points="5 13 10 18 19 7"></polyline></svg></template>
              </div>
            </template>
          </div>
          </template>
          <template data-if="detailMode">
          <div style="background:#fff;border:1px solid #EDEEE9;border-radius:10px;overflow:hidden">
            <div style="padding:11px 12px 10px;border-bottom:1px solid #EDEEE9">
              <div style="font-size:12px;font-weight:600;letter-spacing:-0.01em;color:#171A16">In this filter</div>
              <div style="font-size:11px;color:#6B7268;margin-top:5px">{{ siblingMeta }}</div>
            </div>
            <div style="max-height:340px;overflow-y:auto;scrollbar-width:thin">
              <template data-for="siblings" data-as="c">
                <span data-on-click="c.onSelect" style="position:relative;display:flex;align-items:center;gap:8px;min-height:38px;padding:6px 11px;border-bottom:1px solid #EDEEE9;cursor:pointer" class="h5">
                  <template data-if="c.active"><span style="position:absolute;inset:0;background:#F0F6F1;box-shadow:inset 3px 0 0 #186B39"></span></template>
                  <template data-if="c.up"><span style="position:relative;width:5px;height:5px;border-radius:50%;background:#186B39;flex:none"></span></template>
                  <template data-if="c.down"><span style="position:relative;width:5px;height:5px;border-radius:50%;background:#8A4B2A;flex:none"></span></template>
                  <template data-if="c.flat"><span style="position:relative;width:5px;height:5px;border-radius:50%;border:1px solid #6B7268;flex:none"></span></template>
                  <span style="position:relative;min-width:0;flex:1;font-size:12px;font-weight:500;letter-spacing:-0.01em;line-height:1.25">{{ c.name }}</span>
                  <span style="position:relative;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:#6B7268">{{ c.skusTxt }}</span>
                </span>
              </template>
            </div>
            <div style="padding:9px 11px 11px;border-top:1px solid #EDEEE9;background:#FAFBF9">
              <span data-on-click="onBackToTable" style="font-size:11.5px;font-weight:500;color:#186B39;cursor:pointer">Back to all commodities</span>
            </div>
          </div>
          </template>
        </aside>

        <template data-if="browseMode">
        <div style="flex:1;min-width:280px;display:flex;flex-direction:column">
        <div style="min-height:44px;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #E4E6DF">
          <span style="font-size:11.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Commodities</span>
          <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#6B7268">{{ rowCountTxt }}</span>
          <span style="font-size:11px;color:#6B7268;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ filterSummary }}</span>
          <template data-if="olderCount">
            <span data-on-click="onToggleOlder" style="flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;border:1px solid #E4E6DF;background:#fff;cursor:pointer;font-size:11px;color:#6B7268;white-space:nowrap" class="h3">{{ olderTxt }}<span style="font-weight:500;color:#186B39">{{ olderToggleTxt }}</span></span>
          </template>
          <span style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 100%">
            <span style="position:relative;display:flex;align-items:center;flex:none;width:300px;margin-right:auto">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8F86" stroke-width="2" stroke-linecap="round" style="position:absolute;left:11px"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>

          </span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="flex:1;min-width:0;font-size:11px;color:#6B7268;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ filterSummary }}</span>
          <span style="flex:none;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:#6B7268">{{ rowCountTxt }}</span>
        </div>
      </div>

      <template data-for="rows" data-as="c">
        <template data-if="c.sponsorSlot">
          <div style="border-bottom:1px solid #EDEEE9;background:#FCFAF4;box-shadow:inset 3px 0 0 #C9922F;padding:10px 14px 11px 16px">
            <span style="display:block;font-size:11px;font-weight:500;letter-spacing:-0.005em;color:#8A6520">Sponsored</span>
            <span style="display:block;font-size:12.5px;margin-top:5px">Valle Verde Logistics — reefer capacity out of South Texas, brokered same day</span>
            <span style="margin-top:9px;height:34px;border-radius:7px;border:1px solid #E0CFA5;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;color:#8A6520;cursor:pointer">Get a rate
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="18" y2="12"></line><polyline points="13 7 18 12 13 17"></polyline></svg>
            </span>
          </div>
        </template>

        <div style="border-bottom:1px solid #EDEEE9">
          <div data-on-click="c.onToggle" style="position:relative;padding:11px 14px 12px;cursor:pointer">
            <template data-if="c.expanded"><span style="position:absolute;inset:0;background:#F7F9F6;box-shadow:inset 3px 0 0 #186B39"></span></template>
            <div style="position:relative;display:flex;align-items:center;gap:8px">
              <span style="min-width:0;flex:1;font-size:14px;font-weight:600;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.name }}</span>
              <template data-if="c.up"><span style="flex:none;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:#EAF3EA;color:#1F5F32">↑ Higher</span></template>
              <template data-if="c.down"><span style="flex:none;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:#F7EFE8;color:#7A4223">↓ Lower</span></template>
              <template data-if="c.flat"><span style="flex:none;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:#F0F1EE;color:#5A6158">→ Steady</span></template>
            </div>
            <div style="position:relative;margin-top:4px;display:flex;align-items:center;gap:7px">
              <span style="flex:none;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#4A5148">{{ c.skusTxt }} prices</span>
              <span style="flex:none;width:3px;height:3px;border-radius:5px;background:#C9CCC3"></span>
              <span style="min-width:0;font-size:12.5px;color:#8A8F86;letter-spacing:-0.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.origins }}</span>
            </div>
          </div>

          <template data-if="c.expanded">
            <div style="background:#F7F9F6;box-shadow:inset 3px 0 0 #186B39;padding:0 0 12px 3px">
              <!-- A real table rather than a stack of labelled blocks.
                   Repeating "FOB / Terminal / Spread" on every price cost
                   three lines per row and fit barely two prices on a phone
                   screen; the labels belong in a header shown once. The
                   variety column is pinned so it stays visible while the
                   numbers scroll. -->
              <div data-table-scroll>
                <div style="min-width:430px">
                  <div style="display:grid;grid-template-columns:minmax(132px,1.3fr) 62px 62px 58px 62px;gap:8px;padding:7px 14px 6px 0;border-bottom:1px solid #E4E6DF">
                    <span data-sticky-col style="background:#F7F9F6;font-size:10.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Variety · pack</span>
                    <span style="font-size:10.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86;text-align:right">FOB</span>
                    <span style="font-size:10.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86;text-align:right">Terminal</span>
                    <span style="font-size:10.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86;text-align:right">Spread</span>
                    <span style="font-size:10.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Source</span>
                  </div>
                  <template data-for="c.skus" data-as="s">
                    <span data-on-click="s.onOpen" data-price-row style="display:grid;grid-template-columns:minmax(132px,1.3fr) 62px 62px 58px 62px;gap:8px;align-items:baseline;padding:9px 14px 9px 0;border-bottom:1px solid #EAEDE6;background:#F7F9F6">
                      <span data-sticky-col style="background:#F7F9F6;min-width:0">
                        <span style="display:block;font-size:12px;font-weight:500;letter-spacing:-0.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.variety }}</span>
                        <span style="display:block;font-size:10.5px;color:#8A8F86;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.origin }} · {{ s.pack }} {{ s.size }}<template data-if="s.quality"> · {{ s.quality }}</template></span>
                      </span>
                      <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#8A4B2A;text-align:right;font-variant-numeric:tabular-nums">{{ s.fobTxt }}</span>
                      <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums">{{ s.termTxt }}</span>
                      <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#4A5148;text-align:right;font-variant-numeric:tabular-nums">{{ s.spreadTxt }}</span>
                      <span style="display:inline-flex;align-items:center;gap:4px;min-width:0">
                        <template data-if="s.mostly"><span style="flex:none;width:5px;height:5px;border-radius:50%;background:#186B39"></span></template>
                        <template data-if="s.midRange"><span style="flex:none;width:5px;height:5px;border-radius:50%;background:#C9922F"></span></template>
                        <template data-if="s.reported"><span style="flex:none;width:5px;height:5px;border-radius:50%;border:1px solid #6B7268"></span></template>
                        <span style="font-size:10.5px;color:#6B7268;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.src }}</span>
                      </span>
                    </span>
                  </template>
                </div>
              </div>
              <span data-on-click="c.onDetails" style="margin-top:11px;height:38px;border-radius:7px;background:#186B39;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:500;cursor:pointer">View all {{ c.skusTxt }} prices
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="18" y2="12"></line><polyline points="13 7 18 12 13 17"></polyline></svg>
              </span>
            </div>
          </template>
        </div>
      </template>

      <div style="padding:12px 14px 22px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">
        <span style="font-size:11px;color:#6B7268">Prices sit on the rows inside.</span>
        <span style="margin-left:auto;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:#6B7268">{{ pageTxt }}</span>
        <template data-if="hasPrev">
          <span data-on-click="onPrev" style="height:32px;padding:0 11px;border-radius:7px;border:1px solid #E4E6DF;display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;cursor:pointer">Previous</span>
        </template>
        <template data-if="hasNext">
          <span data-on-click="onNext" style="height:32px;padding:0 11px;border-radius:7px;border:1px solid #E4E6DF;display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;cursor:pointer">Next</span>
        </template>
      </div>
    </div>
    </template>

    <template data-if="detailMode">
    <div style="flex:1;min-height:0;background:#fff">
      <div style="position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #EDEEE9;padding:9px 14px;display:flex;align-items:center;gap:9px">
        <span data-on-click="onBackToTable" style="flex:none;width:32px;height:32px;border-radius:7px;border:1px solid #E4E6DF;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#171A16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="6" y2="12"></line><polyline points="11 7 6 12 11 17"></polyline></svg>
        </span>
        <span style="min-width:0;flex:1">
          <span style="display:block;font-size:13.5px;font-weight:600;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ commodity.name }}</span>
          <span style="display:block;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:#6B7268">{{ mDetailSubTxt }}</span>
        </span>
      </div>

      <div style="padding:12px 14px 14px;border-bottom:1px solid #EDEEE9;background:#FAFBF9">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Movement into the country</span>
          <span style="font-size:11px;color:#6B7268">{{ movement.dateTxt }}</span>
        </div>

        <template data-if="movement.has">
        <div style="margin-top:9px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
          <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:22px;font-weight:500;letter-spacing:-0.035em;line-height:1;font-variant-numeric:tabular-nums">{{ movement.totalTxt }}</span>
          <span style="font-size:11px;color:#8A8F86">loads</span>
          <template data-if="movement.up"><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;color:#1F5F32">{{ movement.changeTxt }}</span></template>
          <template data-if="movement.down"><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;color:#8A4B2A">{{ movement.changeTxt }}</span></template>
          <template data-if="movement.flat"><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;color:#6B7268">{{ movement.changeTxt }}</span></template>
          <span style="font-size:11px;color:#6B7268">{{ movement.prevTxt }}</span>
        </div>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
          <template data-for="movement.rows" data-as="r">
            <div style="display:grid;grid-template-columns:minmax(0,92px) minmax(0,1fr) 48px;gap:10px;max-width:380px;align-items:center">
              <span style="min-width:0;font-size:11.5px;color:{{ r.nameColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.origin }}</span>
              <span style="min-width:0;height:5px;border-radius:3px;background:#EDEEE9;display:block;position:relative">
                <span style="position:absolute;top:0;left:0;height:5px;border-radius:3px;background:{{ r.barColor }};width:{{ r.pctTxt }}"></span>
              </span>
              <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#4A5148;text-align:right;font-variant-numeric:tabular-nums">{{ r.loadsTxt }}</span>
            </div>
          </template>
        </div>
        <div style="display:flex;align-items:center;gap:7px;margin-top:9px">
          <span style="width:14px;height:4px;border-radius:2px;background:#186B39;flex:none"></span>
          <span style="font-size:10.5px;color:#6B7268">{{ movement.legendTxt }}</span>
        </div>
        <div style="margin-top:9px;font-size:10.5px;line-height:1.5;color:#6B7268;text-wrap:pretty">{{ movement.footnote }}</div>
        </template>

        <template data-if="movement.none">
        <div style="margin-top:8px;font-size:12px;color:#4A5148">{{ movement.emptyTxt }}</div>
        <div style="margin-top:5px;font-size:10.5px;line-height:1.5;color:#6B7268;text-wrap:pretty">National truck and rail arrivals as reported by USDA. Not specific to any one pack or terminal.</div>
        </template>
      </div>

      <template data-for="skuRows" data-as="s">
        <div style="border-bottom:1px solid #EDEEE9">
          <div data-on-click="s.onSelect" style="position:relative;padding:11px 14px 12px;cursor:pointer">
            <template data-if="s.expanded"><span style="position:absolute;inset:0;background:#F7F9F6;box-shadow:inset 3px 0 0 #186B39"></span></template>
            <div style="position:relative;display:flex;align-items:baseline;gap:7px">
              <span style="min-width:0;flex:1;font-size:13px;font-weight:600;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.variety }}</span>
              <span style="flex:none;display:inline-flex;align-items:center;gap:5px">
                <template data-if="s.mostly"><span style="width:5px;height:5px;border-radius:50%;background:#186B39"></span></template>
                <template data-if="s.midRange"><span style="width:5px;height:5px;border-radius:50%;background:#C9922F"></span></template>
                <template data-if="s.reported"><span style="width:5px;height:5px;border-radius:50%;border:1px solid #6B7268"></span></template>
                <span style="font-size:11.5px;letter-spacing:-0.005em;color:#6B7268">{{ s.src }}</span>
              </span>
            </div>
            <div style="position:relative;font-size:11px;color:#6B7268;margin-top:3px">{{ s.origin }} · {{ s.packSize }}</div>
            <div style="position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">
              <span style="display:block">
                <span style="display:block;font-size:11px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">FOB</span>
                <span style="display:block;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#8A4B2A;margin-top:2px;font-variant-numeric:tabular-nums">{{ s.fobTxt }}</span>
              </span>
              <span style="display:block">
                <span style="display:block;font-size:11px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Terminal</span>
                <span style="display:block;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums">{{ s.termTxt }}</span>
              </span>
              <span style="display:block">
                <span style="display:block;font-size:11px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Spread</span>
                <span style="display:block;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#4A5148;margin-top:2px;font-variant-numeric:tabular-nums">{{ s.spreadTxt }}</span>
              </span>
            </div>
          </div>

          <template data-if="s.expanded">
            <div style="background:#F7F9F6;box-shadow:inset 3px 0 0 #186B39;padding:2px 14px 14px 16px">
              <div style="font-size:11px;color:#6B7268">{{ s.basis }} · {{ s.gradeSize }}</div>
              <div style="margin-top:10px;display:flex;align-items:baseline;gap:8px">
                <span style="font-size:11.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Price history</span>
                <span style="margin-left:auto;font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;color:#6B7268">{{ s.chartLowTxt }} – {{ s.chartHighTxt }}</span>
              </div>
              <svg viewBox="0 0 340 112" width="100%" height="108" preserveAspectRatio="none" style="display:block;margin-top:6px">
                <line x1="10" y1="102" x2="330" y2="102" stroke="#DCDFD6" stroke-width="1"></line>
                <line x1="10" y1="58" x2="330" y2="58" stroke="#EDEEE9" stroke-width="1"></line>
                <polyline points="{{ s.fobPts }}" fill="none" stroke="#8A4B2A" stroke-width="1.6"></polyline>
                <polyline points="{{ s.termPts }}" fill="none" stroke="#186B39" stroke-width="2"></polyline>
              </svg>
              <div style="display:flex;gap:14px;margin-top:8px">
                <span style="display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:#4A5148"><span style="width:14px;height:2px;background:#186B39"></span>Terminal</span>
                <span style="display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:#4A5148"><span style="width:14px;height:2px;background:#8A4B2A"></span>FOB</span>
              </div>
              <div style="margin-top:14px;display:flex;align-items:baseline;gap:8px;padding-bottom:7px;border-bottom:1px solid #E4E6DF">
                <span style="font-size:11.5px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">Across terminals</span>
                <span style="margin-left:auto;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:#6B7268">spread {{ s.marketSpreadTxt }}</span>
              </div>
              <template data-for="s.terminals" data-as="m">
                <div data-on-click="m.onSelect" style="position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) 74px;gap:10px;align-items:center;height:38px;border-bottom:1px solid #E4E9E1;cursor:pointer">
                  <template data-if="m.active"><span style="position:absolute;inset:0;background:#F0F6F1;box-shadow:inset 2px 0 0 #186B39"></span></template>
                  <span style="position:relative;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;color:#8A8F86">{{ m.rank }}</span>
                  <span style="position:relative;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ m.name }}</span>
                  <span style="position:relative;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;text-align:right;font-variant-numeric:tabular-nums">{{ m.priceTxt }}</span>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <div style="padding:13px 14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:11px;color:#6B7268">{{ commodity.moreTxt }}</span>
      </div>
    </div>
    </template>

    <div style="flex:none;position:sticky;bottom:0;z-index:3;background:#fff;border-top:1px solid #EDEEE9;padding:7px 6px 10px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr">
      <template data-for="mTabs" data-as="t">
        <span data-on-click="t.onSelect" style="min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ t.color }}">
          <span style="display:inline-flex">{{ t.icon }}</span>
          <span style="font-size:10px;font-weight:500;letter-spacing:0.02em">{{ t.label }}</span>
        </span>
      </template>
    </div>

    <template data-if="mSheetOpen">
      <span data-on-click="onCloseSheet" style="position:fixed;inset:0;background:rgba(23,26,22,0.42);z-index:5"></span>
      <div style="position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(23,26,22,0.18);padding:12px 14px 22px;max-height:78vh;overflow-y:auto;scrollbar-width:thin">
        <div style="display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid #EDEEE9">
          <span style="font-size:13px;font-weight:600;letter-spacing:-0.01em">Filters</span>
          <span data-on-click="onClearAll" style="margin-left:auto;font-size:11.5px;color:#6B7268;cursor:pointer">Clear all</span>
          <span data-on-click="onCloseSheet" style="width:30px;height:30px;border-radius:7px;border:1px solid #E4E6DF;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#171A16" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </span>
        </div>
        <template data-for="filterGroups" data-as="g">
          <div style="padding:12px 0 4px">
            <span style="display:block;font-size:11px;font-weight:500;letter-spacing:-0.005em;color:#8A8F86">{{ g.title }}</span>
            <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:9px">
              <template data-for="g.options" data-as="o">
                <span data-on-click="o.onToggle" style="height:34px;padding:0 12px;border-radius:17px;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;white-space:nowrap;cursor:pointer;background:{{ o.chipBg }};color:{{ o.chipFg }};border:1px solid {{ o.chipBd }}">{{ o.name }}
                  <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;opacity:0.7">{{ o.count }}</span>
                </span>
              </template>
            </div>
          </div>
        </template>
        <span data-on-click="onCloseSheet" style="margin-top:14px;height:46px;border-radius:7px;background:#186B39;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer">{{ mSheetApplyTxt }}</span>
      </div>
    </template>
  </div>
  </template>
</div>

</template>

<div id="page-root"></div>

<script src="/js/config.js"></script>
<script src="/js/util.js"></script>
<script src="/js/api.js"></script>
<script src="/js/dc-runtime.js"></script>
<script src="/js/agrax-data.js"></script>
<script src="/js/agrax-search.js"></script>
<script src="/js/browse-app.js"></script>
</body>
</html>
