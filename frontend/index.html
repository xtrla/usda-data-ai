<body class="agrax-home">

<template id="page-template">
<main class="home-shell">
  <section class="home-intro" aria-labelledby="home-title">
    <div class="home-intro__content"><p class="agx-eyebrow"><span aria-hidden="true"></span> Produce markets, in focus</p>
    <h1 id="home-title">Know the market.<br>See the details.</h1>
    <p class="home-intro__description">Compare USDA wholesale produce prices across US markets, with variety, origin, and pack details in view.</p>
    <a class="home-explore" href="/browse">Explore prices <span aria-hidden="true">→</span></a>
    </div>
    <figure class="home-intro__image"><img src="/assets/farm-hero.webp" alt="Rows of produce growing in a sunlit field" width="884" height="663" fetchpriority="high"><figcaption>From the field.<br><strong>Into perspective.</strong></figcaption></figure>
  </section>
  <div class="home-source-strip"><span>Built around the reported price.</span><span>USDA AMS sources</span><span>Original report dates</span><span>Full quote details</span></div>
  <section class="home-section" aria-labelledby="home-categories-title">
    <div class="home-section__heading"><h2 id="home-categories-title">Browse by category</h2></div>
    <div class="home-categories">
<a class="home-category" href="/browse?category=fruits"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8c-7-3-9 8-4 12 2 1 3-1 4-1s2 2 4 1c5-4 3-15-4-12Zm0 0V4m0 2c1-4 5-4 5-4-1 4-5 4-5 4Z"/></svg><span><strong>Fruit</strong><small>{{ catFruit }} commodities</small></span><span class="agx-chevron" aria-hidden="true">›</span></a>
<a class="home-category" href="/browse?category=vegetables"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 10-9 11 4-14c1-3 7-1 5 3ZM13 6V2m1 4 4-3m-5 5-3-2m0 8-3-1"/></svg><span><strong>Vegetables</strong><small>{{ catVegetables }} commodities</small></span><span class="agx-chevron" aria-hidden="true">›</span></a>
<a class="home-category" href="/browse?category=onions_potatoes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8V3M8 5 5 3m3 2 3-2"/><circle cx="8" cy="14" r="6"/><ellipse cx="19" cy="16" rx="4" ry="5"/></svg><span><strong>Onions & potatoes</strong><small>{{ catOnions }} commodities</small></span><span class="agx-chevron" aria-hidden="true">›</span></a>
<a class="home-category" href="/browse?category=nuts"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3c-6 5-6 12 0 18C13 15 13 8 7 3Zm10 0c-6 5-6 12 0 18 6-6 6-13 0-18ZM7 6v12M17 6v12"/></svg><span><strong>Nuts</strong><small>{{ catNuts }} commodities</small></span><span class="agx-chevron" aria-hidden="true">›</span></a>
    </div>
  </section>
  <section class="home-section home-section--markets" aria-labelledby="home-markets-title">
    <div class="home-section__heading"><h2 id="home-markets-title">Choose a market</h2><span>Terminal prices</span></div>
    <p class="home-status" role="status">{{ marketStatus }}</p>
    <div class="home-markets"><template data-for="featuredMarkets" data-as="t"><a class="home-market" href="{{ t.href }}"><span><strong>{{ t.name }}</strong><small>{{ t.date }} · {{ t.lines }} prices</small></span><span class="agx-chevron" aria-hidden="true">›</span></a></template></div>
    <template data-if="hasMoreMarkets"><details class="home-more"><summary>More markets <span aria-hidden="true">+</span></summary><div class="home-markets"><template data-for="moreMarkets" data-as="t"><a class="home-market" href="{{ t.href }}"><span><strong>{{ t.name }}</strong><small>{{ t.date }} · {{ t.lines }} prices</small></span><span class="agx-chevron" aria-hidden="true">›</span></a></template></div></details></template>
  </section>
  <section class="home-context" aria-labelledby="home-context-title">
    <h2 id="home-context-title">The details behind your next purchase.</h2>
    <dl><div><dt>Market prices</dt><dd>USDA terminal and shipping point reports.</dd></div><div><dt>Comparable products</dt><dd>Variety, origin, size, and pack stay with each quote.</dd></div><div><dt>Clear context</dt><dd>Report dates and commentary inform your buying decisions.</dd></div></dl>
  </section>
  <section class="home-subscribe" aria-labelledby="newsletter-heading">
    <div class="home-subscribe__copy"><p class="home-subscribe__eyebrow">THE AGRAX REPORT</p><h2 id="newsletter-heading">Your markets.<br>Your daily reports.</h2><p>Choose your cities and produce categories. Get new reports by email after publication and successful import.</p><button type="button" data-newsletter-open>Choose my reports <span aria-hidden="true">↗</span></button><small>Confirm your email to start. Unsubscribe anytime.</small></div>
    <div class="home-subscribe__art" aria-hidden="true"><div class="home-report-preview"><div class="home-report-preview__top">AgraX <span>MARKET BRIEF</span></div><p>A closer look at<br>your market.</p><div><span>01</span> Your cities <b>↗</b></div><div><span>02</span> Your commodities <b>↗</b></div><div><span>03</span> The reported details <b>↗</b></div><small>CHOSEN BY YOU. GROUNDED IN THE REPORT.</small></div></div>
  </section>
</main>
<footer class="home-footer"><span>AgraX · Independent presentation of USDA market data.</span><nav aria-label="Footer"><a href="/browse">Browse</a><a href="/about">About the data</a><a href="/privacy">Privacy</a></nav></footer>
