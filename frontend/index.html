<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>agraX</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════ */
:root {
  --c-body:     #0B1612;
  --c-surf:     #132219;
  --c-surf2:    #1C3026;
  --c-surf3:    #243B2F;
  --c-border:   #2A4A38;
  --c-border2:  #38614A;
  --c-text:     #F0FFF6;
  --c-text2:    #7AAB8E;
  --c-text3:    #4A7060;
  --c-green:    #34D973;
  --c-green2:   #22C55E;
  --c-green-dim:#1A3D28;
  --c-red:      #FF5C5C;
  --c-red-dim:  #3D1A1A;
  --c-amber:    #FFB347;
  --c-amber-dim:#3D2E1A;
  --c-pill-bg:  rgba(19,34,25,0.92);
  --font:       'Inter', sans-serif;
  --mono:       'JetBrains Mono', monospace;
  --radius-sm:  8px;
  --radius-md:  14px;
  --radius-lg:  20px;
  --radius-xl:  28px;
  --nav-h:      72px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ═══════════════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--c-body);
  color: var(--c-text);
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; border: none; outline: none; background: none; }

/* ═══════════════════════════════════════════════
   VIEWS
═══════════════════════════════════════════════ */
.view { display: none; }
.view.active { display: block; }

/* ═══════════════════════════════════════════════
   TOP BAR  (minimal — just logo + live + toggle)
═══════════════════════════════════════════════ */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px;
  background: linear-gradient(180deg, var(--c-body) 70%, transparent 100%);
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 700; letter-spacing: -0.04em; color: var(--c-text);
}
.logo-mark {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--c-green); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--c-body); font-family: var(--mono);
}
.logo span { color: var(--c-green); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: 100px; padding: 5px 10px;
  font-family: var(--mono); font-size: 10px; color: var(--c-text2);
  letter-spacing: 0.06em;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c-green);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.75); }
}

/* ═══════════════════════════════════════════════
   FLOATING BOTTOM NAV
═══════════════════════════════════════════════ */
.bottom-nav {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 1000;
  display: flex; align-items: center;
  background: var(--c-pill-bg);
  border: 1px solid var(--c-border);
  border-radius: 100px;
  padding: 6px;
  gap: 2px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(52,217,115,0.08);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 16px; border-radius: 100px;
  font-size: 11px; font-weight: 500; color: var(--c-text3);
  transition: all 0.18s ease;
  white-space: nowrap;
}
.nav-item .nav-icon { font-size: 18px; line-height: 1; }
.nav-item.active { background: var(--c-green); color: var(--c-body); }
.nav-item:not(.active):hover { color: var(--c-text2); background: var(--c-surf2); }

/* ═══════════════════════════════════════════════
   SEARCH BAR
═══════════════════════════════════════════════ */
.search-block { padding: 0 20px 20px; }
.search-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--c-surf2);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  transition: border-color 0.15s;
}
.search-bar:focus-within { border-color: var(--c-green); }
.search-icon { font-size: 18px; color: var(--c-text3); flex-shrink: 0; }
.search-bar input {
  flex: 1; font-size: 15px; color: var(--c-text); letter-spacing: -0.01em;
}
.search-bar input::placeholder { color: var(--c-text3); }
.search-kbd {
  font-family: var(--mono); font-size: 10px; color: var(--c-text3);
  background: var(--c-surf3); border: 1px solid var(--c-border);
  padding: 2px 7px; border-radius: 5px; flex-shrink: 0;
}

/* ═══════════════════════════════════════════════
   MOVERS TICKER
═══════════════════════════════════════════════ */
.movers-strip {
  padding: 0 20px 24px;
  overflow-x: auto;
  display: flex; gap: 10px;
  scrollbar-width: none;
}
.movers-strip::-webkit-scrollbar { display: none; }
.mover-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--c-surf); border: 1px solid var(--c-border);
  border-radius: var(--radius-md); padding: 10px 14px;
  flex-shrink: 0; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.mover-chip:hover { border-color: var(--c-border2); background: var(--c-surf2); }
.mover-chip.up { border-color: rgba(52,217,115,0.3); background: rgba(52,217,115,0.05); }
.mover-chip.dn { border-color: rgba(255,92,92,0.3); background: rgba(255,92,92,0.05); }
.mc-emoji { font-size: 20px; }
.mc-info { display: flex; flex-direction: column; gap: 1px; }
.mc-name { font-size: 12px; font-weight: 500; color: var(--c-text); }
.mc-pct { font-family: var(--mono); font-size: 11px; font-weight: 500; }
.mc-pct.up { color: var(--c-green); }
.mc-pct.dn { color: var(--c-red); }

/* ═══════════════════════════════════════════════
   SECTION LABEL
═══════════════════════════════════════════════ */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 12px;
}
.sec-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--c-text3);
}
.sec-action {
  font-size: 12px; color: var(--c-green); font-weight: 500;
  cursor: pointer; background: none; border: none;
}

/* ═══════════════════════════════════════════════
   CATEGORY PILLS
═══════════════════════════════════════════════ */
.cat-scroll {
  display: flex; gap: 8px; padding: 0 20px 20px;
  overflow-x: auto; scrollbar-width: none;
}
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0; padding: 7px 16px; border-radius: 100px;
  font-size: 13px; font-weight: 500;
  border: 1px solid var(--c-border);
  color: var(--c-text2); background: var(--c-surf);
  transition: all 0.15s;
}
.cat-btn.active { background: var(--c-green); color: var(--c-body); border-color: var(--c-green); }
.cat-btn:not(.active):hover { border-color: var(--c-border2); color: var(--c-text); }

/* ═══════════════════════════════════════════════
   MOSAIC TILE GRID
═══════════════════════════════════════════════ */
.tile-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 0 20px;
}
@media (min-width: 600px) { .tile-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .tile-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1200px) { .tile-grid { grid-template-columns: repeat(5, 1fr); } }

.tile {
  background: var(--c-surf);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s, box-shadow 0.18s;
  position: relative; overflow: hidden;
}
.tile::before {
  content: '';
  position: absolute; inset: 0; border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(52,217,115,0.04) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.18s;
}
.tile:hover { transform: translateY(-2px); border-color: var(--c-border2); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.tile:hover::before { opacity: 1; }
.tile.up { border-color: rgba(52,217,115,0.2); }
.tile.dn { border-color: rgba(255,92,92,0.15); }

.tile-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.tile-emoji { font-size: 28px; line-height: 1; }
.tile-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  padding: 3px 7px; border-radius: 6px; letter-spacing: 0.02em;
}
.tile-badge.up { background: rgba(52,217,115,0.15); color: var(--c-green); }
.tile-badge.dn { background: rgba(255,92,92,0.15); color: var(--c-red); }
.tile-badge.flat { background: rgba(255,179,71,0.15); color: var(--c-amber); }

.tile-name { font-size: 13px; font-weight: 500; color: var(--c-text); line-height: 1.2; margin-bottom: 4px; }
.tile-spec { font-family: var(--mono); font-size: 10px; color: var(--c-text3); margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tile-price { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--c-text); letter-spacing: -0.02em; margin-bottom: 8px; }

/* mini spark inside tile */
.tile-spark { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
.ts-bar { flex: 1; border-radius: 2px; background: var(--c-surf3); min-height: 3px; transition: background 0.2s; }
.tile.up .ts-bar:last-child { background: var(--c-green); }
.tile.dn .ts-bar:last-child { background: var(--c-red); }
.tile.flat .ts-bar:last-child { background: var(--c-amber); }

/* ═══════════════════════════════════════════════
   LOAD MORE
═══════════════════════════════════════════════ */
.load-more-wrap { padding: 20px; text-align: center; }
.load-more-btn {
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: 100px; padding: 10px 28px;
  font-size: 13px; color: var(--c-text2); font-weight: 500;
  transition: all 0.15s;
}
.load-more-btn:hover { border-color: var(--c-green); color: var(--c-green); }

/* ═══════════════════════════════════════════════
   COMMODITY DETAIL SHEET  (slide up)
═══════════════════════════════════════════════ */
.sheet-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: none; opacity: 0; transition: opacity 0.25s;
}
.sheet-overlay.open { display: block; opacity: 1; }

.sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
  background: var(--c-surf);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  border: 1px solid var(--c-border); border-bottom: none;
  max-height: 88vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 20px);
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--c-border2); margin: 14px auto 0;
}
.sheet-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 20px 22px 16px;
}
.sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--c-text); }
.sheet-meta { font-family: var(--mono); font-size: 10px; color: var(--c-text3); margin-top: 4px; letter-spacing: 0.06em; }
.sheet-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--c-surf2); border: 1px solid var(--c-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--c-text2); cursor: pointer;
  flex-shrink: 0;
}

/* stats row in sheet */
.sheet-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--c-border);
  margin: 0 22px 24px; border-radius: var(--radius-md); overflow: hidden;
}
.stat-box { background: var(--c-surf2); padding: 14px 12px; }
.stat-box-label {
  font-family: var(--mono); font-size: 9px; color: var(--c-text3);
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px;
}
.stat-box-val {
  font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--c-text);
}
.stat-box-val.up { color: var(--c-green); }
.stat-box-val.dn { color: var(--c-red); }

/* chart area */
.sheet-chart-wrap {
  margin: 0 22px 24px;
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: var(--radius-md); padding: 18px;
}
.sheet-chart-label {
  font-family: var(--mono); font-size: 10px; color: var(--c-text3);
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px;
}
.chart-canvas-wrap { height: 180px; }

/* market breakdown in sheet */
.sheet-section-label {
  font-family: var(--mono); font-size: 10px; color: var(--c-text3);
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0 22px 12px;
}
.mkt-list { display: flex; flex-direction: column; gap: 2px; padding: 0 22px; }
.mkt-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: var(--radius-sm); padding: 13px 14px;
  transition: border-color 0.15s;
}
.mkt-row.best { border-color: rgba(52,217,115,0.35); background: var(--c-green-dim); }
.mkt-row:hover { border-color: var(--c-border2); }
.mkt-row-left { display: flex; flex-direction: column; gap: 2px; }
.mkt-name { font-size: 13px; font-weight: 500; color: var(--c-text); }
.mkt-origin { font-family: var(--mono); font-size: 10px; color: var(--c-text3); }
.mkt-row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.mkt-price { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--c-text); }
.mkt-row.best .mkt-price { color: var(--c-green); }
.best-tag {
  font-family: var(--mono); font-size: 9px; color: var(--c-green);
  letter-spacing: 0.1em; text-transform: uppercase;
}

/* ═══════════════════════════════════════════════
   MARKETS VIEW (full market breakdown)
═══════════════════════════════════════════════ */
.markets-header { padding: 20px 20px 0; }
.markets-title { font-size: 26px; font-weight: 700; letter-spacing: -0.04em; color: var(--c-text); margin-bottom: 4px; }
.markets-sub { font-size: 13px; color: var(--c-text2); }

.hub-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px; padding: 20px;
}
@media (min-width: 700px) { .hub-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1000px) { .hub-grid { grid-template-columns: repeat(4, 1fr); } }

.hub-card {
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: var(--radius-lg); padding: 18px;
  cursor: pointer; transition: all 0.18s;
}
.hub-card.active { border-color: var(--c-green); background: var(--c-green-dim); }
.hub-card:not(.active):hover { border-color: var(--c-border2); }
.hub-name { font-size: 15px; font-weight: 600; color: var(--c-text); margin-bottom: 4px; }
.hub-count { font-family: var(--mono); font-size: 11px; color: var(--c-text3); }
.hub-bar {
  height: 3px; background: var(--c-border); border-radius: 2px;
  margin-top: 14px; overflow: hidden;
}
.hub-bar-fill { height: 100%; background: var(--c-green); border-radius: 2px; }

/* market commodity list */
.mkt-commodity-list { padding: 0 20px; display: flex; flex-direction: column; gap: 2px; }
.mkt-com-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center; gap: 16px;
  background: var(--c-surf); border: 1px solid var(--c-border);
  border-radius: var(--radius-md); padding: 14px 16px;
  cursor: pointer; transition: all 0.15s;
}
.mkt-com-row:hover { border-color: var(--c-border2); background: var(--c-surf2); }
.mcr-left { display: flex; align-items: center; gap: 12px; }
.mcr-emoji { font-size: 22px; }
.mcr-name { font-size: 13px; font-weight: 500; color: var(--c-text); }
.mcr-spec { font-family: var(--mono); font-size: 10px; color: var(--c-text3); margin-top: 2px; }
.mcr-price { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--c-text); }
.mcr-delta {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  padding: 3px 8px; border-radius: 6px;
}
.mcr-delta.up { color: var(--c-green); background: rgba(52,217,115,0.12); }
.mcr-delta.dn { color: var(--c-red); background: rgba(255,92,92,0.12); }
.mcr-delta.flat { color: var(--c-amber); background: rgba(255,179,71,0.12); }

/* ═══════════════════════════════════════════════
   COMPARE VIEW
═══════════════════════════════════════════════ */
.compare-wrap { padding: 20px; }
.compare-title { font-size: 26px; font-weight: 700; letter-spacing: -0.04em; color: var(--c-text); margin-bottom: 4px; }
.compare-sub { font-size: 13px; color: var(--c-text2); margin-bottom: 20px; }

.compare-selector {
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: var(--radius-md); padding: 14px 16px; width: 100%;
  font-size: 14px; color: var(--c-text); font-family: var(--font);
  appearance: none; cursor: pointer; transition: border-color 0.15s;
}
.compare-selector:focus { border-color: var(--c-green); outline: none; }

.compare-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
.cmp-card {
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: var(--radius-lg); padding: 18px;
  transition: all 0.18s;
}
.cmp-card.best { border-color: rgba(52,217,115,0.4); background: var(--c-green-dim); box-shadow: 0 0 0 1px rgba(52,217,115,0.15); }
.cmp-best-tag { font-family: var(--mono); font-size: 9px; color: var(--c-green); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
.cmp-mkt { font-size: 13px; font-weight: 600; color: var(--c-text); }
.cmp-origin { font-family: var(--mono); font-size: 10px; color: var(--c-text3); margin-top: 3px; margin-bottom: 16px; }
.cmp-price { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--c-text); }
.cmp-card.best .cmp-price { color: var(--c-green); }

/* ═══════════════════════════════════════════════
   SEARCH VIEW
═══════════════════════════════════════════════ */
.search-view-wrap { padding: 20px; }
.search-view-title { font-size: 26px; font-weight: 700; letter-spacing: -0.04em; color: var(--c-text); margin-bottom: 16px; }
.search-view-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 8px;
}
.search-view-bar:focus-within { border-color: var(--c-green); }
.search-view-bar input { flex: 1; font-size: 15px; color: var(--c-text); }
.search-view-bar input::placeholder { color: var(--c-text3); }
.srch-controls { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.srch-sel {
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: 100px; padding: 7px 14px;
  font-size: 12px; color: var(--c-text2); font-family: var(--font);
  appearance: none; cursor: pointer;
}
.srch-sel:focus { border-color: var(--c-green); outline: none; }
.srch-btn {
  background: var(--c-green); color: var(--c-body);
  border-radius: 100px; padding: 8px 20px;
  font-size: 13px; font-weight: 600;
  transition: opacity 0.15s;
}
.srch-btn:hover { opacity: 0.85; }

.srch-results { display: flex; flex-direction: column; gap: 2px; }
.srch-row {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 12px;
  background: var(--c-surf); border: 1px solid var(--c-border);
  border-radius: var(--radius-md); padding: 14px 16px;
  cursor: pointer; transition: all 0.15s;
}
.srch-row:hover { border-color: var(--c-border2); background: var(--c-surf2); }
.srch-row-left { display: flex; align-items: center; gap: 12px; }
.srch-em { font-size: 22px; }
.srch-name { font-size: 13px; font-weight: 500; color: var(--c-text); }
.srch-details { font-family: var(--mono); font-size: 10px; color: var(--c-text3); margin-top: 2px; }
.srch-right { text-align: right; }
.srch-price { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--c-text); }
.srch-delta { font-family: var(--mono); font-size: 11px; margin-top: 2px; }
.srch-delta.up { color: var(--c-green); }
.srch-delta.dn { color: var(--c-red); }
.srch-delta.flat { color: var(--c-amber); }

.srch-empty {
  padding: 60px 20px; text-align: center;
  font-family: var(--mono); font-size: 12px; color: var(--c-text3);
}

/* pagination */
.pg-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 0; }
.pg-info { font-family: var(--mono); font-size: 10px; color: var(--c-text3); }
.pg-btns { display: flex; gap: 6px; }
.pg-btn {
  background: var(--c-surf2); border: 1px solid var(--c-border);
  border-radius: 100px; padding: 6px 16px;
  font-size: 12px; color: var(--c-text2); font-family: var(--mono);
  transition: all 0.15s;
}
.pg-btn:hover:not(:disabled) { border-color: var(--c-green); color: var(--c-green); }
.pg-btn:disabled { opacity: 0.3; cursor: default; }

.spacer { height: 10px; }
</style>

<!-- ═══════════════ SCRIPT ═══════════════ -->
<script>
const API = 'https://produce-iq-production.up.railway.app';
let ALL = [], DATED = {}, DATES = [];
let homeActiveCat = 'All', homePage = 0;
let mktActiveHub = null, mktActiveCat = 'All';
let srchPage = 1, srchRes = [];
const PER_PAGE = 20;

/* ── Emoji map ── */
const EM = {
  avocado:'🥑',tomato:'🍅',strawberr:'🍓',blueberr:'🫐',raspberr:'🍓',blackberr:'🍇',
  lettuce:'🥬',pepper:'🌶',corn:'🌽',carrot:'🥕',apple:'🍎',pear:'🍐',grape:'🍇',
  lemon:'🍋',orange:'🍊',mango:'🥭',pineapple:'🍍',banana:'🍌',watermelon:'🍉',
  melon:'🍈',coconut:'🥥',kiwi:'🥝',broccoli:'🥦',cauliflower:'🥦',cabbage:'🥬',
  spinach:'🥬',kale:'🥬',cucumber:'🥒',squash:'🥒',zucchini:'🥒',eggplant:'🍆',
  bean:'🫘',garlic:'🧄',onion:'🧅',potato:'🥔',mushroom:'🍄',celery:'🥬',
  cilantro:'🌿',herb:'🌿',basil:'🌿',parsley:'🌿',mint:'🌿',almond:'🥜',
  walnut:'🥜',pecan:'🥜',pistachio:'🥜',cashew:'🥜',nut:'🥜',cherry:'🍒',
  peach:'🍑',plum:'🍑',lime:'🍋',grapefruit:'🍊',tangerine:'🍊',papaya:'🥭',
  yam:'🥔',asparagus:'🌱',beet:'🫚',fennel:'🌿',okra:'🌱',leek:'🥬',
  shallot:'🧅',pea:'🫛',artichoke:'🥦',nectarine:'🍑',sprout:'🌱',alfalfa:'🌱',
  chard:'🥬',arugula:'🥬',cranberr:'🍓',
};
function em(name){const l=name.toLowerCase();for(const[k,v]of Object.entries(EM))if(l.includes(k))return v;return'🌱';}

/* ── Category map ── */
const CATS = {
  'Fruits':['apple','pear','grape','peach','plum','cherry','nectarine','kiwi','melon','watermelon','mango','papaya','pineapple','banana','avocado','orange','lemon','lime','grapefruit','tangerine','mandarin','clementine','strawberr','blueberr','raspberr','blackberr','cranberr','coconut'],
  'Vegetables':['lettuce','tomato','pepper','carrot','celery','broccoli','cauliflower','cabbage','spinach','kale','cucumber','squash','zucchini','eggplant','corn','bean','pea','asparagus','garlic','leek','artichoke','beet','radish','turnip','parsnip','fennel','okra','mushroom','cilantro','herb','basil','mint','chive','dill','parsley','sprout','alfalfa','chard','arugula'],
  'Onions & Potatoes':['onion','potato','yam','sweet potato','shallot'],
  'Nuts':['almond','walnut','pecan','pistachio','cashew','hazelnut','macadamia','peanut','nut']
};
function cat(name){const l=name.toLowerCase();for(const[c,ks]of Object.entries(CATS))if(ks.some(k=>l.includes(k)))return c;return'Other';}

/* ── Math helpers ── */
function avgP(items){const p=items.map(i=>parseFloat(i.price_low||0)).filter(p=>p>0);return p.length?p.reduce((a,b)=>a+b,0)/p.length:null;}
function fmtP(v){return(v==null||isNaN(v))?'—':'$'+Number(v).toFixed(2);}
function trend(commodity){
  if(DATES.length<2)return 0;
  const t=DATED[DATES[0].date]?.filter(x=>x.commodity===commodity)||[];
  const w=DATED[DATES[Math.min(6,DATES.length-1)].date]?.filter(x=>x.commodity===commodity)||[];
  if(!t.length||!w.length)return 0;
  const at=t.reduce((s,x)=>s+parseFloat(x.price_low||0),0)/t.length;
  const aw=w.reduce((s,x)=>s+parseFloat(x.price_low||0),0)/w.length;
  return aw?((at-aw)/aw)*100:0;
}
function sparkData(commodity){
  const bars=[];
  for(let i=Math.min(6,DATES.length-1);i>=0;i--){
    const d=DATES[i]?.date;if(!d)continue;
    bars.push(avgP(DATED[d]?.filter(x=>x.commodity===commodity)||[])||0);
  }
  return bars;
}

/* ── Navigation ── */
function goView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById(`view-${v}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  window.scrollTo(0,0);
}

/* ── Sheet ── */
let sheetChart = null;
function openSheet(commodity){
  const items = ALL.filter(i=>i.commodity===commodity);
  const prices = items.map(i=>parseFloat(i.price_low||0)).filter(p=>p>0);
  const markets = [...new Set(items.map(i=>i.market))];
  const ch = trend(commodity);
  const avg = prices.length?prices.reduce((a,b)=>a+b,0)/prices.length:0;
  const abs = avg?Math.abs(avg*ch/100):0;

  document.getElementById('sheetTitle').textContent = commodity;
  document.getElementById('sheetMeta').textContent = `${markets.length} MARKETS · ${items.length} LISTINGS · USDA`;

  const dCls = ch>0.5?'up':ch<-0.5?'dn':'';
  const dStr = ch>0.5?`+${fmtP(abs)}`:ch<-0.5?`−${fmtP(abs)}`:'—';
  document.getElementById('sheetStats').innerHTML = `
    <div class="stat-box"><div class="stat-box-label">Avg price</div><div class="stat-box-val">${fmtP(avg)}</div></div>
    <div class="stat-box"><div class="stat-box-label">Wk change</div><div class="stat-box-val ${dCls}">${dStr}</div></div>
    <div class="stat-box"><div class="stat-box-label">Markets</div><div class="stat-box-val">${markets.length}</div></div>
  `;

  // market list
  document.getElementById('sheetMktList').innerHTML = items
    .sort((a,b)=>parseFloat(a.price_low||0)-parseFloat(b.price_low||0))
    .map((item,i)=>{
      const p=avgP([item]),best=i===0;
      const variety=[item.variety,item.size,item.grade].filter(Boolean).join(', ');
      return`<div class="mkt-row${best?' best':''}">
        <div class="mkt-row-left">
          <div class="mkt-name">${item.market||'—'}</div>
          <div class="mkt-origin">${item.origin||'—'} · ${variety||item.package||'—'}</div>
        </div>
        <div class="mkt-row-right">
          <div class="mkt-price">${fmtP(p)}</div>
          ${best?'<div class="best-tag">Best</div>':''}
        </div>
      </div>`;
    }).join('');

  // chart
  const history=[];
  for(let i=Math.min(6,DATES.length-1);i>=0;i--){
    const d=DATES[i]?.date;if(!d)continue;
    const a=avgP(DATED[d]?.filter(x=>x.commodity===commodity)||[]);
    if(a)history.push({date:d,price:a});
  }
  setTimeout(()=>{
    const canvas=document.getElementById('sheetChart');
    if(sheetChart)sheetChart.destroy();
    if(canvas&&history.length){
      sheetChart=new Chart(canvas,{
        type:'line',
        data:{
          labels:history.map(h=>new Date(h.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})),
          datasets:[{
            data:history.map(h=>h.price),
            borderColor:'#34D973',
            backgroundColor:'rgba(52,217,115,0.08)',
            fill:true,tension:0.4,
            pointRadius:4,pointBackgroundColor:'#34D973',
            pointBorderColor:'#132219',pointBorderWidth:2
          }]
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false}},
          scales:{
            x:{grid:{color:'rgba(42,74,56,0.5)'},ticks:{color:'#4A7060',font:{family:"'JetBrains Mono'",size:10}}},
            y:{grid:{color:'rgba(42,74,56,0.5)'},ticks:{color:'#4A7060',font:{family:"'JetBrains Mono'",size:10},callback:v=>'$'+v.toFixed(0)}}
          }
        }
      });
    }
  },80);

  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow='';
}

/* ═══════════════════════════════
   HOME DASHBOARD
═══════════════════════════════ */
let tileData=[], tilesShown=0;

function homeCat(el,c){
  homeActiveCat=c;homePage=0;tilesShown=0;
  document.querySelectorAll('#homeCatScroll .cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));
  buildTiles();
}

function getDeduped(){
  let rows=ALL.filter(i=>i.market_type==='terminal'||!i.market_type);
  if(homeActiveCat!=='All')rows=rows.filter(i=>cat(i.commodity)===homeActiveCat);
  const seen=new Set(),dd=[];
  rows.sort((a,b)=>a.commodity.localeCompare(b.commodity)).forEach(r=>{
    if(!seen.has(r.commodity)){seen.add(r.commodity);dd.push(r);}
  });
  return dd;
}

function buildTiles(){
  tileData=getDeduped();
  tilesShown=Math.min(PER_PAGE,tileData.length);
  document.getElementById('tileLabel').textContent=homeActiveCat==='All'?'All Commodities':homeActiveCat;
  document.getElementById('tileCount').textContent=`${tileData.length} commodities`;
  renderTiles();
}

function renderTiles(){
  const visible=tileData.slice(0,tilesShown);
  document.getElementById('tileGrid').innerHTML=visible.map(item=>{
    const ch=trend(item.commodity);
    const avg=avgP([item]);
    const cls=ch>1?'up':ch<-1?'dn':'flat';
    const pctStr=ch>0.5?`+${ch.toFixed(1)}%`:ch<-0.5?`${ch.toFixed(1)}%`:'—';
    const bars=sparkData(item.commodity);
    const mx=Math.max(...bars)||1,mn=Math.min(...bars),rng=mx-mn||1;
    const barsHtml=bars.map((v,i)=>{
      const h=Math.max(6,Math.round(((v-mn)/rng)*28));
      return`<div class="ts-bar" style="height:${h}px;"></div>`;
    }).join('');
    return`<div class="tile ${cls}" onclick="openSheet('${item.commodity.replace(/'/g,"\\'")}')">
      <div class="tile-top">
        <div class="tile-emoji">${em(item.commodity)}</div>
        <div class="tile-badge ${cls}">${pctStr}</div>
      </div>
      <div class="tile-name">${item.commodity}</div>
      <div class="tile-spec">${item.market||'—'}</div>
      <div class="tile-price">${fmtP(avg)}</div>
      <div class="tile-spark">${barsHtml}</div>
    </div>`;
  }).join('');
  const wrap=document.getElementById('loadMoreWrap');
  wrap.style.display=tilesShown<tileData.length?'block':'none';
}

function loadMore(){
  tilesShown=Math.min(tilesShown+PER_PAGE,tileData.length);
  renderTiles();
}

function buildMovers(){
  const comms=[...new Set(ALL.map(i=>i.commodity))];
  const changes=comms.map(c=>({commodity:c,ch:trend(c)})).filter(x=>Math.abs(x.ch)>0.5);
  const top=[
    ...changes.filter(x=>x.ch>0).sort((a,b)=>b.ch-a.ch).slice(0,5),
    ...changes.filter(x=>x.ch<0).sort((a,b)=>a.ch-b.ch).slice(0,5),
  ];
  document.getElementById('moversStrip').innerHTML=top.map(x=>{
    const cls=x.ch>0?'up':'dn';
    const pct=x.ch>0?`+${x.ch.toFixed(1)}%`:`${x.ch.toFixed(1)}%`;
    return`<div class="mover-chip ${cls}" onclick="openSheet('${x.commodity.replace(/'/g,"\\'")}')">
      <div class="mc-emoji">${em(x.commodity)}</div>
      <div class="mc-info">
        <div class="mc-name">${x.commodity}</div>
        <div class="mc-pct ${cls}">${pct}</div>
      </div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════
   MARKETS VIEW
═══════════════════════════════ */
let mktCatActive='All';

function buildHubGrid(){
  const markets=[...new Set(ALL.filter(i=>i.market_type==='terminal'||!i.market_type).map(i=>i.market).filter(Boolean))];
  const maxCount=Math.max(...markets.map(m=>ALL.filter(i=>i.market===m).length));
  document.getElementById('hubGrid').innerHTML=markets.map(m=>{
    const count=ALL.filter(i=>i.market===m).length;
    const pct=Math.round((count/maxCount)*100);
    return`<div class="hub-card${mktActiveHub===m?' active':''}" onclick="selectHub('${m.replace(/'/g,"\\'")}')">
      <div class="hub-name">${m}</div>
      <div class="hub-count">${count} listings</div>
      <div class="hub-bar"><div class="hub-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function selectHub(m){
  mktActiveHub=m; mktCatActive='All';
  document.querySelectorAll('.hub-card').forEach(c=>c.classList.toggle('active',c.querySelector('.hub-name')?.textContent===m));
  document.getElementById('mktComHead').style.display='flex';
  document.getElementById('mktCatScroll').style.display='flex';
  document.querySelectorAll('#mktCatScroll .cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat==='All'));
  document.getElementById('mktComLabel').textContent=m;
  renderMktComs();
}

function mktCat(el,c){
  mktCatActive=c;
  document.querySelectorAll('#mktCatScroll .cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));
  renderMktComs();
}

function renderMktComs(){
  if(!mktActiveHub)return;
  let items=ALL.filter(i=>i.market===mktActiveHub);
  if(mktCatActive!=='All')items=items.filter(i=>cat(i.commodity)===mktCatActive);
  const seen=new Set(),dd=[];
  items.sort((a,b)=>a.commodity.localeCompare(b.commodity)).forEach(r=>{
    if(!seen.has(r.commodity)){seen.add(r.commodity);dd.push(r);}
  });
  document.getElementById('mktComCount').textContent=`${dd.length} commodities`;
  document.getElementById('mktComList').innerHTML=dd.map(item=>{
    const ch=trend(item.commodity);
    const avg=avgP([item]);
    const cls=ch>1?'up':ch<-1?'dn':'flat';
    const pct=ch>0.5?`+${ch.toFixed(1)}%`:ch<-0.5?`${ch.toFixed(1)}%`:'—';
    return`<div class="mkt-com-row" onclick="openSheet('${item.commodity.replace(/'/g,"\\'")}')">
      <div class="mcr-left">
        <div class="mcr-emoji">${em(item.commodity)}</div>
        <div>
          <div class="mcr-name">${item.commodity}</div>
          <div class="mcr-spec">${item.origin||'—'}</div>
        </div>
      </div>
      <div class="mcr-price">${fmtP(avg)}</div>
      <div class="mcr-delta ${cls}">${pct}</div>
    </div>`;
  }).join('')||'<div class="srch-empty">No results</div>';
}

/* ═══════════════════════════════
   COMPARE
═══════════════════════════════ */
function buildCompareSelect(){
  const comms=[...new Set(ALL.map(i=>i.commodity))].sort();
  document.getElementById('compareSelect').innerHTML='<option value="">Choose a commodity…</option>'+comms.map(c=>`<option value="${c}">${c}</option>`).join('');
}
function runCompare(){
  const com=document.getElementById('compareSelect').value;
  if(!com){document.getElementById('compareResults').style.display='none';return;}
  const items=ALL.filter(i=>i.commodity===com);
  document.getElementById('compareResults').style.display='block';
  document.getElementById('compareSubtitle').textContent=`${com.toUpperCase()} · ${items.length} LISTINGS · ${[...new Set(items.map(i=>i.market))].length} MARKETS`;
  document.getElementById('compareCards').innerHTML=items
    .sort((a,b)=>parseFloat(a.price_low||0)-parseFloat(b.price_low||0))
    .map((item,i)=>{
      const p=avgP([item]),best=i===0;
      const variety=[item.variety,item.size,item.grade].filter(Boolean).join(', ');
      return`<div class="cmp-card${best?' best':''}">
        ${best?'<div class="cmp-best-tag">Best price</div>':''}
        <div class="cmp-mkt">${item.market||'—'}</div>
        <div class="cmp-origin">${item.origin||'Domestic'} · ${variety||'Standard'}</div>
        <div class="cmp-price">${fmtP(p)}</div>
      </div>`;
    }).join('');
}

/* ═══════════════════════════════
   SEARCH
═══════════════════════════════ */
function buildSrchFilters(){
  const markets=[...new Set(ALL.map(i=>i.market))].sort();
  document.getElementById('srchMktFilter').innerHTML='<option value="">All markets</option>'+markets.map(m=>`<option value="${m}">${m}</option>`).join('');
}
function runSearch(){
  const q=document.getElementById('srchInput').value.toLowerCase().trim();
  const mkt=document.getElementById('srchMktFilter').value;
  srchRes=ALL.filter(i=>{
    if(mkt&&i.market!==mkt)return false;
    if(q&&!`${i.commodity} ${i.variety||''} ${i.origin||''} ${i.market}`.toLowerCase().includes(q))return false;
    return true;
  });
  srchPage=1;renderSrch();
}
function renderSrch(){
  const PG=30;
  const start=(srchPage-1)*PG, pg=srchRes.slice(start,start+PG);
  const total=srchRes.length, pages=Math.ceil(total/PG)||1;
  document.getElementById('srchInfo').textContent=`${total.toLocaleString()} results`;
  document.getElementById('srchPrev').disabled=srchPage<=1;
  document.getElementById('srchNext').disabled=srchPage>=pages;
  document.getElementById('srchPgRow').style.display=total?'flex':'none';
  if(!pg.length){
    document.getElementById('srchResults').innerHTML='<div class="srch-empty">No results found</div>';
    return;
  }
  document.getElementById('srchResults').innerHTML=pg.map(item=>{
    const ch=trend(item.commodity),avg=avgP([item]);
    const variety=[item.variety,item.size,item.grade].filter(Boolean).join(', ');
    const cls=ch>0.5?'up':ch<-0.5?'dn':'flat';
    const pct=ch>0.5?`+${ch.toFixed(1)}%`:ch<-0.5?`${ch.toFixed(1)}%`:'—';
    return`<div class="srch-row" onclick="openSheet('${item.commodity.replace(/'/g,"\\'")}')">
      <div class="srch-row-left">
        <div class="srch-em">${em(item.commodity)}</div>
        <div>
          <div class="srch-name">${item.commodity}</div>
          <div class="srch-details">${item.market||'—'} · ${item.origin||'—'} · ${variety||'—'}</div>
        </div>
      </div>
      <div class="srch-right">
        <div class="srch-price">${fmtP(avg)}</div>
        <div class="srch-delta ${cls}">${pct}</div>
      </div>
    </div>`;
  }).join('');
}
function srchPrevFn(){if(srchPage>1){srchPage--;renderSrch();window.scrollTo(0,0);}}
function srchNextFn(){srchPage++;renderSrch();window.scrollTo(0,0);}

/* ═══════════════════════════════
   INIT
═══════════════════════════════ */
async function init(){
  try{
    DATES=await(await fetch(`${API}/dates`)).json();
    if(!DATES.length)return;
    const d=new Date(DATES[0].date+'T12:00:00');
    const ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
    document.getElementById('live-date').textContent='LIVE · '+ds;
    document.getElementById('live-date2').textContent='LIVE · '+ds;

    DATED[DATES[0].date]=await(await fetch(`${API}/commodities/by-date/${DATES[0].date}`)).json();
    ALL=DATED[DATES[0].date];

    for(let i=1;i<=6&&i<DATES.length;i++){
      try{DATED[DATES[i].date]=await(await fetch(`${API}/commodities/by-date/${DATES[i].date}`)).json();}catch{}
    }

    buildMovers();
    buildTiles();
    buildHubGrid();
    buildCompareSelect();
    buildSrchFilters();
  }catch(e){console.error(e);}
}

init();
</script>
