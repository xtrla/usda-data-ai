// ─────────────────────────────────────────────────────────────────────────────
// SPARKLINE
// ─────────────────────────────────────────────────────────────────────────────
function Sparkline({ data, w = 88, h = 22 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const pad = 1.5;
  const dx = (w - pad * 2) / (data.length - 1);
  const range = max - min || 1;
  const points = data.map((v, i) => [pad + i * dx, pad + (h - pad * 2) * (1 - (v - min) / range)]);
  const d = points.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
  const trend = data[data.length - 1] >= data[0];
  const color = trend ? 'var(--positive)' : 'var(--negative)';
  const last = points[points.length - 1];
  return (
    <svg width={w} height={h} style={{ overflow: 'visible', display: 'block' }}>
      <path d={d} fill="none" stroke={color} strokeWidth="1.25" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last[0]} cy={last[1]} r="1.7" fill={color} />
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// DELTA
// ─────────────────────────────────────────────────────────────────────────────
function Delta({ pct }) {
  if (pct == null || isNaN(pct)) return <span className="delta flat">—</span>;
  if (Math.abs(pct) < 0.05) return <span className="delta flat">0.0%</span>;
  const cls = pct > 0 ? 'up' : 'dn';
  const sign = pct > 0 ? '+' : '';
  return <span className={`delta ${cls}`}>{sign}{pct.toFixed(1)}%</span>;
}

// ─────────────────────────────────────────────────────────────────────────────
// DATA HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function getCommodityKey(row) {
  return row.commodity + '||' + (row.origin || '') + '||' + (row.variety || '') + '||' + (row.package || '');
}

function guessCategory(name) {
  const n = name.toLowerCase();
  if (/apple|pear|grape|peach|plum|cherry|nectarine|kiwi|melon|watermelon|mango|papaya|pineapple|banana|avocado|orange|lemon|lime|grapefruit|tangerine|strawberr|blueberr|raspberr|blackberr|coconut/.test(n)) return 'Fruits';
  if (/onion|shallot/.test(n)) return 'Onions';
  if (/potato|yam/.test(n)) return 'Potatoes';
  if (/almond|walnut|pecan|pistachio|cashew|peanut|nut/.test(n)) return 'Nuts';
  return 'Vegetables';
}

function marketCodeFromName(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('new york') || n.includes('nyc')) return 'NYC';
  if (n.includes('boston') || n.includes('bos')) return 'BOS';
  if (n.includes('philadelphia') || n.includes('phl')) return 'PHL';
  if (n.includes('baltimore') || n.includes('bal')) return 'BAL';
  if (n.includes('atlanta') || n.includes('atl')) return 'ATL';
  if (n.includes('miami') || n.includes('mia')) return 'MIA';
  if (n.includes('chicago') || n.includes('chi')) return 'CHI';
  if (n.includes('detroit') || n.includes('det')) return 'DET';
  if (n.includes('los angeles') || n.includes('lax')) return 'LAX';
  return null;
}

// Build deduplicated commodity list from flat API rows
function buildCommodityList(rows, prevRows) {
  const termRows = rows.filter(r => r.market_type === 'terminal' && r.price_low != null);
  const fobRows = rows.filter(r => r.market_type === 'shipping_point' && r.market !== 'National Trends' && r.price_low != null);
  const nationalRows = rows.filter(r => r.market === 'National Trends');

  // Group terminal rows by commodity
  const byCommodity = {};
  termRows.forEach(r => {
    const name = r.commodity;
    if (!byCommodity[name]) byCommodity[name] = { name, cat: guessCategory(name), termRows: [], fobRows: [], nat: null };
    byCommodity[name].termRows.push(r);
  });
  fobRows.forEach(r => {
    if (!byCommodity[r.commodity]) return;
    byCommodity[r.commodity].fobRows.push(r);
  });
  nationalRows.forEach(r => {
    if (!byCommodity[r.commodity]) return;
    byCommodity[r.commodity].nat = r;
  });

  // Build prev price lookup
  const prevPrices = {};
  if (prevRows) {
    prevRows.filter(r => r.market_type === 'terminal' && r.price_low != null).forEach(r => {
      if (!prevPrices[r.commodity]) prevPrices[r.commodity] = [];
      prevPrices[r.commodity].push(parseFloat(r.price_low));
    });
  }

  return Object.values(byCommodity).map(c => {
    const prices = c.termRows.map(r => parseFloat(r.price_low));
    const low = Math.min(...prices);
    const high = Math.max(...prices);
    const mostly = prices.reduce((a, b) => a + b, 0) / prices.length;

    const prevArr = prevPrices[c.name] || [];
    const prevAvg = prevArr.length ? prevArr.reduce((a, b) => a + b, 0) / prevArr.length : null;
    const wow = prevAvg ? ((mostly - prevAvg) / prevAvg) * 100 : 0;

    const origins = [...new Set(c.termRows.map(r => r.origin).filter(Boolean))];
    const marketCodes = [...new Set(c.termRows.map(r => marketCodeFromName(r.market)).filter(Boolean))];
    const supply = c.nat?.movement || c.termRows[0]?.movement || null;
    const supplyNote = c.nat?.supply_note || null;

    // FOB
    const fobPrices = c.fobRows.map(r => parseFloat(r.price_low));
    const fobAvg = fobPrices.length ? fobPrices.reduce((a, b) => a + b, 0) / fobPrices.length : null;

    return {
      id: c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      name: c.name,
      cat: c.cat,
      origins,
      marketCodes,
      low, high, mostly,
      wow,
      prevAvg,
      supply,
      supplyNote,
      fobAvg,
      termRows: c.termRows,
      fobRows: c.fobRows,
    };
  }).sort((a, b) => Math.abs(b.wow) - Math.abs(a.wow));
}

// Get price for a specific market code
function priceForMarket(commodity, marketCode) {
  if (marketCode === 'ALL' || !marketCode) {
    return { low: commodity.low, high: commodity.high, mostly: commodity.mostly };
  }
  const market = TERMINAL_MARKETS.find(t => t.code === marketCode);
  if (!market) return { low: commodity.low, high: commodity.high, mostly: commodity.mostly };
  const cityName = market.city.toLowerCase();
  const relevant = commodity.termRows.filter(r => r.market && r.market.toLowerCase().includes(cityName) && r.price_low != null);
  if (!relevant.length) return { low: commodity.low, high: commodity.high, mostly: commodity.mostly };
  const prices = relevant.map(r => parseFloat(r.price_low));
  return {
    low: Math.min(...prices),
    high: Math.max(...prices),
    mostly: prices.reduce((a, b) => a + b, 0) / prices.length
  };
}

// Format date
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function fmtDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function MarketsScreen({ commodities, market, setMarket, watchlist, toggleWatch, onOpen, todayStr, loading }) {
  const [sortKey, setSortKey] = useState('wow');
  const [sortDir, setSortDir] = useState('desc');
  const [category, setCategory] = useState('All');
  const [searchQ, setSearchQ] = useState('');

  const cats = ['All', 'Fruits', 'Vegetables', 'Onions', 'Potatoes', 'Nuts'];

  const filtered = useMemo(() => {
    let list = [...commodities];
    if (category !== 'All') list = list.filter(c => c.cat === category || c.name.toLowerCase().includes(category.toLowerCase()));
    if (searchQ) {
      const q = searchQ.toLowerCase();
      list = list.filter(c => c.name.toLowerCase().includes(q) || c.origins.some(o => o.toLowerCase().includes(q)));
    }
    list.sort((a, b) => {
      const getVal = (r) => {
        if (sortKey === 'name') return r.name;
        if (sortKey === 'low') return priceForMarket(r, market).low;
        if (sortKey === 'high') return priceForMarket(r, market).high;
        if (sortKey === 'mostly') return priceForMarket(r, market).mostly;
        if (sortKey === 'wow') return r.wow;
        return r.name;
      };
      const A = getVal(a), B = getVal(b);
      if (typeof A === 'number') return (A - B) * (sortDir === 'asc' ? 1 : -1);
      return String(A).localeCompare(String(B)) * (sortDir === 'asc' ? 1 : -1);
    });
    return list;
  }, [commodities, category, searchQ, sortKey, sortDir, market]);

  function sortBy(k) {
    if (sortKey === k) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
    else { setSortKey(k); setSortDir(k === 'name' ? 'asc' : 'desc'); }
  }
  const sIcon = (k) => sortKey === k ? (sortDir === 'asc' ? '▲' : '▼') : '↕';

  const currentMarket = TERMINAL_MARKETS.find(t => t.code === market);
  const marketLabel = market === 'ALL' ? 'National composite' : `${currentMarket?.city}, ${currentMarket?.state}`;

            <span className="pill live">Live</span>

          <h1 className="hero-date">{fmtDate(todayStr)}</h1>
          <div className="hero-meta">
            <strong>{commodities.length} commodities</strong>
            <span className="sep">·</span>
            <span>Terminal + shipping-point data</span>
            <span className="sep">·</span>
            <span>Updated daily</span>

        <div className="hero-r">

        {cats.map(c => (

        <div className="search" style={{ maxWidth: 220 }}>
          <Ico.Search />
          <input value={searchQ} onChange={e => setSearchQ(e.target.value)} placeholder="Filter commodities…" />
          {searchQ && <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-dim)', lineHeight: 1 }} onClick={() => setSearchQ('')}><Ico.X /></button>}
        </div>
      </div>

      {/* Table */}
      <div className="card" style={{ padding: 0 }}>
        <div className="card-h" style={{ background: 'var(--surface)' }}>
          <div>
            <h3>{marketLabel} · wholesale prices</h3>
            <span className="sub">{filtered.length} commodities · prices in <span className="mono">USD per unit</span> · USDA terminal market report</span>
          </div>
          {loading && <span className="pill" style={{ fontSize: 11 }}>Updating…</span>}
        </div>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead>
              <tr>
                <th style={{ width: 32 }}></th>
                <th className={`sortable ${sortKey === 'name' ? 'sorted' : ''}`} onClick={() => sortBy('name')} style={{ minWidth: 200 }}>
                  Commodity <span className="sort-ind">{sIcon('name')}</span>
                </th>
                <th>Origins</th>
                <th className={`num sortable ${sortKey === 'low' ? 'sorted' : ''}`} onClick={() => sortBy('low')}>
                  Low <span className="sort-ind">{sIcon('low')}</span>
                </th>
                <th className={`num sortable ${sortKey === 'high' ? 'sorted' : ''}`} onClick={() => sortBy('high')}>
                  High <span className="sort-ind">{sIcon('high')}</span>
                </th>
                <th className={`num sortable ${sortKey === 'mostly' ? 'sorted' : ''}`} onClick={() => sortBy('mostly')}>
                  Avg <span className="sort-ind">{sIcon('mostly')}</span>
                </th>
                <th className={`num sortable ${sortKey === 'wow' ? 'sorted' : ''}`} onClick={() => sortBy('wow')}>
                  WoW % <span className="sort-ind">{sIcon('wow')}</span>
                </th>
                <th>Supply</th>
                <th className="center">7-day</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const p = priceForMarket(c, market);
                // Build a fake sparkline from the WoW change for visual
                const spark = Array.from({ length: 7 }, (_, i) => {
                  const noise = (((c.name.charCodeAt(0) * 31 + i * 7) % 20) - 10) / 100;
                  return p.mostly * (1 + noise + (c.wow / 100) * (i / 6));
                });
                return (
                  <tr key={c.id} onClick={() => onOpen(c.id)}>
                    <td><StarBtn on={!!watchlist[c.id]} onToggle={() => toggleWatch(c.id)} /></td>
                    <td>
                      <div style={{ fontWeight: 500 }}>{c.name}</div>
                      <div style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>{c.cat}</div>
                    </td>
                    <td className="muted" style={{ fontSize: 11.5, maxWidth: 160 }}>
                      {c.origins.slice(0, 2).join(', ')}{c.origins.length > 2 ? ` +${c.origins.length - 2}` : ''}
                    </td>
                    <td className="num">${p.low.toFixed(2)}</td>
                    <td className="num">${p.high.toFixed(2)}</td>
                    <td className="num" style={{ fontWeight: 500 }}>${p.mostly.toFixed(2)}</td>
                    <td className="num"><Delta pct={c.wow} /></td>
                    <td><SupplyPill v={c.supply} /></td>
                    <td className="center"><Sparkline data={spark} w={70} h={20} /></td>
                  </tr>
                );
              })}
              {filtered.length === 0 && (
                <tr><td colSpan={9} style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--text-muted)' }}>No commodities found</td></tr>
              )}
            </tbody>
          </table>
        </div>
        <div style={{ padding: '10px 16px', borderTop: '1px solid var(--border-soft)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontSize: 11.5, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>{filtered.length} of {commodities.length} commodities · {fmtDateShort(todayStr)}</span>
          <button className="btn sm"><Ico.Download /> Export CSV</button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// COMMODITY DETAIL SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function CommodityScreen({ commodity, market, setMarket, watchlist, toggleWatch, onBack, allCommodities, onOpen, todayStr }) {
  const [range, setRange] = useState('1M');
  const [marketSortK, setMarketSortK] = useState('mostly');
  const [marketSortD, setMarketSortD] = useState('desc');

  if (!commodity) return null;
  const c = commodity;
  const p = priceForMarket(c, market);

  // Build terminal market rows
  const terminalMarkets = useMemo(() => {
    const byMarket = {};
    c.termRows.forEach(r => {
      const code = marketCodeFromName(r.market);
      if (!code) return;
      const mInfo = TERMINAL_MARKETS.find(t => t.code === code);
      if (!mInfo) return;
      if (!byMarket[code]) byMarket[code] = { code, city: mInfo.city, region: mInfo.region, prices: [], supply: null, movement: null };
      byMarket[code].prices.push(parseFloat(r.price_low));
      if (r.movement) byMarket[code].movement = r.movement;
      if (r.supply) byMarket[code].supply = r.supply;
    });
    return Object.values(byMarket).map(m => {
      const prices = m.prices;
      return {
        ...m,
        low: Math.min(...prices),
        high: Math.max(...prices),
        mostly: prices.reduce((a, b) => a + b, 0) / prices.length,
      };
    });
  }, [c]);

  const sortedMarkets = useMemo(() => {
    return [...terminalMarkets].sort((a, b) => {
      const A = a[marketSortK], B = b[marketSortK];
      if (typeof A === 'number') return (A - B) * (marketSortD === 'asc' ? 1 : -1);
      return String(A).localeCompare(String(B)) * (marketSortD === 'asc' ? 1 : -1);
    });
  }, [terminalMarkets, marketSortK, marketSortD]);

  function sortMkt(k) {
    if (marketSortK === k) setMarketSortD(d => d === 'asc' ? 'desc' : 'asc');
    else { setMarketSortK(k); setMarketSortD(k === 'city' ? 'asc' : 'desc'); }
  }
  const mInd = (k) => marketSortK === k ? (marketSortD === 'asc' ? '▲' : '▼') : '↕';

  const nationalLow = Math.min(...terminalMarkets.map(m => m.low));
  const nationalHigh = Math.max(...terminalMarkets.map(m => m.high));

  // Spread
  const spread = c.fobAvg ? c.mostly - c.fobAvg : null;

  // Navigation
  const idx = allCommodities.findIndex(x => x.id === c.id);
  const prevC = idx > 0 ? allCommodities[idx - 1] : null;
  const nextC = idx < allCommodities.length - 1 ? allCommodities[idx + 1] : null;

  return (
    <div className="page" style={{ maxWidth: 1480 }}>
      {/* Back / nav */}
      <div className="detail-nav">
        <button className="btn ghost sm" onClick={onBack}><Ico.ArrowL /> Back to Markets</button>
        <div style={{ flex: 1 }} />
        <div className="nav-arrows">
          <button className="btn icon sm" onClick={() => prevC && onOpen(prevC.id)} disabled={!prevC}><Ico.ChevL /></button>
          <span className="mono" style={{ fontSize: 11.5, color: 'var(--text-dim)', minWidth: 60, textAlign: 'center' }}>{idx + 1} of {allCommodities.length}</span>
          <button className="btn icon sm" onClick={() => nextC && onOpen(nextC.id)} disabled={!nextC}><Ico.ChevR /></button>
        </div>
      </div>

      {/* Header */}
      <div className="page-h" style={{ alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
          <div style={{ width: 72, height: 72, borderRadius: 10, background: 'var(--accent-soft)', color: 'var(--accent)', display: 'grid', placeItems: 'center', fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 22, flexShrink: 0 }}>
            {c.name.slice(0, 2).toUpperCase()}
          </div>
          <div style={{ minWidth: 0 }}>
            <div className="hero-eyebrow" style={{ marginBottom: 6 }}>
              <span>{c.cat}</span>
              <span className="sep">·</span>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                {c.origins.slice(0, 2).join(', ')}
              </span>
            </div>
            <h1 className="page-title" style={{ margin: 0, fontSize: 28 }}>{c.name}</h1>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 8, color: 'var(--text-muted)', fontSize: 12.5 }}>
              <strong style={{ color: 'var(--text)', fontWeight: 500 }}>{fmtDate(todayStr)}</strong>
              <span style={{ color: 'var(--text-dim)' }}>·</span>
              <div style={{ position: 'relative', display: 'inline-flex' }}>
                <button className="market-chip" onClick={() => setMarket('ALL')} style={{ gap: 6 }}>
                  <Ico.Map style={{ width: 12, height: 12 }} />
                  {market === 'ALL' ? 'All Markets' : TERMINAL_MARKETS.find(t => t.code === market)?.city || market}
                  <Ico.ChevR style={{ width: 10, height: 10, opacity: .5 }} />
                </button>
              </div>
            </div>
          </div>
        </div>
        <div className="row gap-2">
          <button className={`btn sm ${watchlist[c.id] ? 'primary' : ''}`} onClick={() => toggleWatch(c.id)}>
            {watchlist[c.id] ? <><Ico.StarF /> Watching</> : <><Ico.Star /> Watch</>}
          </button>
          <button className="btn sm icon" title="Download"><Ico.Download /></button>
        </div>
      </div>

      {/* KPI strip */}
      <div className="card" style={{ display: 'flex', padding: 0, marginBottom: 18, alignItems: 'stretch' }}>
        <div className="kpi" style={{ flex: 2 }}>
          <span className="l">Average price today</span>
          <span className="v lg num">${p.mostly.toFixed(2)}</span>
          <div className="d mono">
            Low <span style={{ color: 'var(--text)', fontWeight: 500 }}>${p.low.toFixed(2)}</span>
            <span style={{ margin: '0 6px', color: 'var(--text-dim)' }}>·</span>
            High <span style={{ color: 'var(--text)', fontWeight: 500 }}>${p.high.toFixed(2)}</span>
          </div>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">vs Last week</span>
          <span className="v num" style={{ fontSize: 18 }}><Delta pct={c.wow} /></span>
          <div className="d" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>WoW change</div>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">National range</span>
          <span className="v num" style={{ fontSize: 16 }}>${nationalLow.toFixed(2)} – ${nationalHigh.toFixed(2)}</span>
          <span className="d mono" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>{terminalMarkets.length} terminals</span>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">FOB → Terminal spread</span>
          <span className="v num" style={{ fontSize: 18, color: spread && spread > 0 ? 'var(--positive)' : 'var(--text)' }}>
            {spread != null ? (spread >= 0 ? '+' : '') + '$' + Math.abs(spread).toFixed(2) : '—'}
          </span>
          <div className="d" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>
            {c.fobAvg ? `FOB avg $${c.fobAvg.toFixed(2)}` : 'No FOB data'}
          </div>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">Supply signal</span>
          <div className="market-state" style={{ fontSize: 16, marginTop: 4 }}>
            {c.supply ? c.supply.replace('Much Higher', 'Rising').replace('Much Lower', 'Falling').replace('Slightly Higher', 'Firming').replace('Slightly Lower', 'Easing') : 'Stable'}
          </div>
          <div className="d" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>From USDA report</div>
        </div>
      </div>

      {/* Supply chain band */}
      <div className="card sc-band" style={{ marginBottom: 18 }}>
        <div className="card-h">
          <div>
            <h3>Supply chain — origin → wholesale</h3>
            <span className="sub">FOB origin · transit · terminal market arrival</span>
          </div>
        </div>
        <div className="sc-grid">
          {/* FOB Origin */}
          <div className="sc-col">
            <div className="sc-col-h">
              <span className="sc-step">1</span>
              <div>
                <div className="sc-title">F.O.B. Origin</div>
                <div className="sc-sub">Packing shed price</div>
              </div>
            </div>
            <div className="sc-rows">
              {c.fobRows.slice(0, 4).map((r, i) => (
                <div key={i} className="sc-row">
                  <div className="sc-row-l">
                    <div className="sc-row-name">{r.origin || r.market || '—'}</div>
                    <div className="sc-row-meta">{r.variety || 'Standard'}</div>
                  </div>
                  <div className="sc-row-r">
                    <span className="sc-row-val">${parseFloat(r.price_low).toFixed(2)}</span>
                    {r.price_high && r.price_high !== r.price_low && <span style={{ fontSize: 11, color: 'var(--text-dim)' }}>–${parseFloat(r.price_high).toFixed(2)}</span>}
                  </div>
                </div>
              ))}
              {c.fobRows.length === 0 && <div style={{ color: 'var(--text-dim)', fontSize: 12 }}>No FOB data available</div>}
            </div>
            <div className="sc-foot">
              <span>Avg</span>
              <span className="mono" style={{ fontWeight: 500 }}>{c.fobAvg ? '$' + c.fobAvg.toFixed(2) : '—'}</span>
            </div>
          </div>

          <div className="sc-arrow">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </div>

          {/* Transit */}
          <div className="sc-col">
            <div className="sc-col-h">
              <span className="sc-step">2</span>
              <div>
                <div className="sc-title">Transit</div>
                <div className="sc-sub">Freight + handling</div>
              </div>
            </div>
            <div className="sc-rows" style={{ justifyContent: 'center' }}>
              <div style={{ color: 'var(--text-dim)', fontSize: 12.5, lineHeight: 1.6, marginTop: 8 }}>
                Freight costs vary by origin region and season. FOB-to-terminal spread includes freight, handling, and broker margin.
              </div>
              {spread != null && (
                <div style={{ marginTop: 12 }}>
                  <div className="label-eyebrow">Estimated spread</div>
                  <div className="mono" style={{ fontSize: 20, fontWeight: 500, color: spread > 0 ? 'var(--positive)' : 'var(--negative)', marginTop: 4 }}>
                    {spread >= 0 ? '+' : ''}${spread.toFixed(2)}
                  </div>
                </div>
              )}
            </div>
          </div>

          <div className="sc-arrow">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </div>

          {/* Terminal */}
          <div className="sc-col">
            <div className="sc-col-h">
              <span className="sc-step">3</span>
              <div>
                <div className="sc-title">Terminal Market</div>
                <div className="sc-sub">Wholesale landed price</div>
              </div>
            </div>
            <div className="sc-rows">
              {sortedMarkets.slice(0, 4).map((m, i) => (
                <div key={i} className="sc-row">
                  <div className="sc-row-l">
                    <div className="sc-row-name">{m.city}</div>
                    <div className="sc-row-meta">{m.region}</div>
                  </div>
                  <div className="sc-row-r">
                    <span className="sc-row-val">${m.mostly.toFixed(2)}</span>
                    <span style={{ fontSize: 11, color: 'var(--text-dim)' }}>${m.low.toFixed(0)}–${m.high.toFixed(0)}</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="sc-foot">
              <span>National avg</span>
              <span className="mono" style={{ fontWeight: 500 }}>${c.mostly.toFixed(2)}</span>
            </div>
          </div>
        </div>

        {/* Spread bar */}
        {spread != null && c.fobAvg && (
          <div className="sc-spread">
            <div className="sc-spread-l">
              <span className="label-eyebrow">F.O.B. origin avg</span>
              <div className="sc-spread-v"><span className="mono">${c.fobAvg.toFixed(2)}</span></div>
            </div>
            <div className="sc-spread-bar" style={{ flex: 1 }}>
              <div className="sc-spread-track">
                <span className="sc-spread-wedge" />
                <span className="sc-spread-tick left"><span className="mono">${c.fobAvg.toFixed(0)}</span><span>FOB</span></span>
                <span className="sc-spread-tick right"><span className="mono">${c.mostly.toFixed(0)}</span><span>Terminal</span></span>
              </div>
            </div>
            <div className="sc-spread-r">
              <span className="label-eyebrow">Gross spread</span>
              <div className="sc-spread-v"><span className="mono" style={{ color: 'var(--positive)', fontWeight: 600 }}>{spread >= 0 ? '+' : ''}${spread.toFixed(2)}</span></div>
            </div>
          </div>
        )}

        {/* Supply note */}
        {c.supplyNote && (
          <div className="sc-reading">
            <p className="sc-reading-text">{c.supplyNote}</p>
          </div>
        )}
      </div>

      {/* Terminal markets table */}
      <div className="card" style={{ marginBottom: 18 }}>
        <div className="card-h">
          <div>
            <h3>All terminal markets · {fmtDateShort(todayStr)}</h3>
            <span className="sub">{sortedMarkets.length} cities reporting</span>
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead>
              <tr>
                <th className={`sortable ${marketSortK === 'city' ? 'sorted' : ''}`} onClick={() => sortMkt('city')}>City <span className="sort-ind">{mInd('city')}</span></th>
                <th>Region</th>
                <th className={`num sortable ${marketSortK === 'low' ? 'sorted' : ''}`} onClick={() => sortMkt('low')}>Low <span className="sort-ind">{mInd('low')}</span></th>
                <th className={`num sortable ${marketSortK === 'high' ? 'sorted' : ''}`} onClick={() => sortMkt('high')}>High <span className="sort-ind">{mInd('high')}</span></th>
                <th className={`num sortable ${marketSortK === 'mostly' ? 'sorted' : ''}`} onClick={() => sortMkt('mostly')}>Avg <span className="sort-ind">{mInd('mostly')}</span></th>
                <th>Movement</th>
              </tr>
            </thead>
            <tbody>
              {sortedMarkets.map(m => (
                <tr key={m.code} className={m.code === market ? 'is-selected' : ''}>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {m.code === market && <span style={{ color: 'var(--accent)' }}><Ico.Bullet /></span>}
                      <span style={{ fontWeight: m.code === market ? 600 : 500 }}>{m.city}</span>
                    </div>
                  </td>
                  <td className="muted">{m.region}</td>
                  <td className="num">${m.low.toFixed(2)}</td>
                  <td className="num">${m.high.toFixed(2)}</td>
                  <td className="num" style={{ fontWeight: 500 }}>${m.mostly.toFixed(2)}</td>
                  <td><SupplyPill v={m.movement} /></td>
                </tr>
              ))}
              {sortedMarkets.length === 0 && (
                <tr><td colSpan={6} style={{ textAlign: 'center', padding: 32, color: 'var(--text-muted)' }}>No terminal market data</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {/* FOB table */}
      {c.fobRows.length > 0 && (
        <div className="card">
          <div className="card-h">
            <div>
              <h3>Shipping-point / FOB origin prices</h3>
              <span className="sub">Free-on-board at packing shed</span>
            </div>
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table className="dt">
              <thead>
                <tr>
                  <th>Origin</th>
                  <th>Variety / Package</th>
                  <th className="num">FOB Low</th>
                  <th className="num">FOB High</th>
                  <th>Movement</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody>
                {c.fobRows.map((r, i) => (
                  <tr key={i}>
                    <td style={{ fontWeight: 500 }}>{r.origin || r.market || '—'}</td>
                    <td className="muted" style={{ fontSize: 12 }}>{[r.variety, r.package].filter(Boolean).join(' · ') || '—'}</td>
                    <td className="num">${parseFloat(r.price_low).toFixed(2)}</td>
                    <td className="num">{r.price_high ? '$' + parseFloat(r.price_high).toFixed(2) : '—'}</td>
                    <td><SupplyPill v={r.movement} /></td>
                    <td className="muted" style={{ fontSize: 11.5, maxWidth: 240, whiteSpace: 'normal' }}>{r.quality_note || r.supply_note || '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// WATCHLIST SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function WatchlistScreen({ commodities, watchlist, toggleWatch, onOpen, market, todayStr }) {
  const items = commodities.filter(c => watchlist[c.id]);
  const currentMarket = TERMINAL_MARKETS.find(t => t.code === market);
  const marketLabel = market === 'ALL' ? 'National composite' : `${currentMarket?.city}, ${currentMarket?.state}`;

  return (
    <div className="page">
      <div className="page-h">
        <div>
          <h1 className="page-title">Watchlist</h1>
          <p className="page-sub"><strong>{fmtDate(todayStr)}</strong> · prices for <strong>{marketLabel}</strong> · {items.length} commodit{items.length === 1 ? 'y' : 'ies'} tracked</p>
        </div>
      </div>
      {items.length === 0 ? (
        <div className="card">
          <div className="empty">
            <h4>No commodities yet</h4>
            <p>Star a commodity in the Markets screener to add it here.</p>
          </div>
        </div>
      ) : (
        <div className="card" style={{ padding: 0 }}>
          <table className="dt">
            <thead>
              <tr>
                <th style={{ width: 32 }}></th>
                <th>Commodity</th>
                <th>Origins</th>
                <th className="num">Low</th>
                <th className="num">High</th>
                <th className="num">Avg</th>
                <th className="num">WoW %</th>
                <th>Supply</th>
              </tr>
            </thead>
            <tbody>
              {items.map(c => {
                const p = priceForMarket(c, market);
                return (
                  <tr key={c.id} onClick={() => onOpen(c.id)}>
                    <td><StarBtn on onToggle={() => toggleWatch(c.id)} /></td>
                    <td>
                      <div style={{ fontWeight: 500 }}>{c.name}</div>
                      <div style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>{c.cat}</div>
                    </td>
                    <td className="muted" style={{ fontSize: 11.5 }}>{c.origins.slice(0, 2).join(', ')}</td>
                    <td className="num">${p.low.toFixed(2)}</td>
                    <td className="num">${p.high.toFixed(2)}</td>
                    <td className="num" style={{ fontWeight: 500 }}>${p.mostly.toFixed(2)}</td>
                    <td className="num"><Delta pct={c.wow} /></td>
                    <td><SupplyPill v={c.supply} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// SHIPPING POINTS SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function ShippingScreen({ allRows, todayStr, onOpen }) {
  const fobRows = allRows.filter(r => r.market_type === 'shipping_point' && r.market !== 'National Trends' && r.price_low != null);
  const [searchQ, setSearchQ] = useState('');
  const filtered = useMemo(() => {
    if (!searchQ) return fobRows;
    const q = searchQ.toLowerCase();
    return fobRows.filter(r =>
      r.commodity.toLowerCase().includes(q) ||
      (r.origin || '').toLowerCase().includes(q) ||
      (r.market || '').toLowerCase().includes(q)
    );
  }, [fobRows, searchQ]);

  return (
    <div className="page">
      <div className="page-h">
        <div>
          <h1 className="page-title">Shipping Points</h1>
          <p className="page-sub">F.O.B. origin pricing · {fmtDate(todayStr)}</p>
        </div>
        <div className="search" style={{ maxWidth: 260 }}>
          <Ico.Search />
          <input value={searchQ} onChange={e => setSearchQ(e.target.value)} placeholder="Search commodity or origin…" />
        </div>
      </div>
      <div className="card" style={{ padding: 0 }}>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead>
              <tr>
                <th>Commodity</th>
                <th>Origin</th>
                <th>Hub</th>
                <th>Variety / Package</th>
                <th className="num">FOB Low</th>
                <th className="num">FOB High</th>
                <th>Movement</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((r, i) => (
                <tr key={i} onClick={() => {
                  const comm = r.commodity.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                  onOpen(comm);
                }}>
                  <td style={{ fontWeight: 500 }}>{r.commodity}</td>
                  <td className="muted">{r.origin || '—'}</td>
                  <td className="muted" style={{ fontSize: 11.5 }}>{r.market || '—'}</td>
                  <td className="muted" style={{ fontSize: 11.5 }}>{[r.variety, r.package].filter(Boolean).join(' · ') || '—'}</td>
                  <td className="num">${parseFloat(r.price_low).toFixed(2)}</td>
                  <td className="num">{r.price_high ? '$' + parseFloat(r.price_high).toFixed(2) : '—'}</td>
                  <td><SupplyPill v={r.movement} /></td>
                  <td className="muted" style={{ fontSize: 11.5, maxWidth: 200, whiteSpace: 'normal' }}>{r.quality_note || r.supply_note || '—'}</td>
                </tr>
              ))}
              {filtered.length === 0 && <tr><td colSpan={8} style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>No data</td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{ padding: '10px 16px', borderTop: '1px solid var(--border-soft)', fontSize: 11.5, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>
          {filtered.length} listings · {fmtDateShort(todayStr)}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// SEARCH OVERLAY
// ─────────────────────────────────────────────────────────────────────────────
function SearchOverlay({ commodities, onClose, onOpen }) {
  const [q, setQ] = useState('');
  const [active, setActive] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);

  const results = useMemo(() => {
    const lower = q.toLowerCase().trim();
    if (!lower) return commodities.slice(0, 8);
    return commodities.filter(c =>
      c.name.toLowerCase().includes(lower) ||
      c.origins.some(o => o.toLowerCase().includes(lower)) ||
      c.cat.toLowerCase().includes(lower)
    );
  }, [q, commodities]);

  useEffect(() => { setActive(0); }, [q]);

  function onKey(e) {
    if (e.key === 'Escape') onClose();
    else if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(results.length - 1, a + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(0, a - 1)); }
    else if (e.key === 'Enter') { if (results[active]) onOpen(results[active].id); }
  }

  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="panel" onClick={e => e.stopPropagation()}>
        <div className="field">
          <Ico.Search />
          <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey}
            placeholder="Search commodities, origins, varieties…" />
          <kbd>esc</kbd>
        </div>
        <div className="results">
          {!q && <div className="group-h">Top movers today</div>}
          {q && <div className="group-h">{results.length} result{results.length === 1 ? '' : 's'}</div>}
          {results.map((c, i) => (
            <div key={c.id} className={`result ${i === active ? 'active' : ''}`}
              onMouseEnter={() => setActive(i)}
              onClick={() => onOpen(c.id)}>
              <span className="mono" style={{ fontSize: 10, color: 'var(--text-dim)', minWidth: 70, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{c.cat}</span>
              <div>
                <div className="cmd-name">{c.name}</div>
                <div className="cmd-cat">{c.origins.slice(0, 2).join(', ')}</div>
              </div>
              <div className="cmd-price" style={{ textAlign: 'right' }}>
                <div className="num" style={{ fontWeight: 500 }}>${c.mostly.toFixed(2)}</div>
                <Delta pct={c.wow} />
              </div>
            </div>
          ))}
          {results.length === 0 && <div className="empty"><h4>No matches</h4><p>Try "avocado", "Mexico", or "iceberg"</p></div>}
        </div>
        <div style={{ display: 'flex', padding: '8px 18px', borderTop: '1px solid var(--border)', gap: 16, fontSize: 11, color: 'var(--text-dim)' }}>
          <span><kbd>↑↓</kbd> navigate</span>
          <span><kbd>↵</kbd> open</span>
          <span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CRUMBS
// ─────────────────────────────────────────────────────────────────────────────
function Crumbs({ route, setRoute }) {
  const items = ({
    markets:   [{ label: 'Markets' }],
    commodity: [{ label: 'Markets', r: 'markets' }, { label: 'Detail' }],
    watchlist: [{ label: 'Watchlist' }],
    shipping:  [{ label: 'Shipping Points' }],
  })[route] || [{ label: 'Markets' }];
  return (
    <div className="crumbs">
      {items.map((it, i) => {
        const isLast = i === items.length - 1;
        return (
          <React.Fragment key={i}>
            {i > 0 && <span className="sep">/</span>}
            {!isLast && it.r ? (
              <button className="crumb-link" onClick={() => setRoute(it.r)}>{it.label}</button>
            ) : (
              <span style={{ color: 'var(--text)', fontWeight: 500 }}>{it.label}</span>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [todayStr, setTodayStr] = useState('');
  const [allRows, setAllRows] = useState([]);
  const [prevRows, setPrevRows] = useState([]);
  const [commodities, setCommodities] = useState([]);
  const [route, setRoute] = useState('markets');
  const [openId, setOpenId] = useState(null); // commodity detail
  const [market, setMarket] = useState('ALL');
  const [watchlist, setWatchlist] = useState({});
  const [searchOpen, setSearchOpen] = useState(false);
  const [dark, setDark] = useState(false);
  const [density, setDensity] = useState('regular');

  // Apply theme
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-density', density);
  }, [dark, density]);

  // Keyboard shortcut
  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearchOpen(true); }
      if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); setSearchOpen(true); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Fetch data
  useEffect(() => {
    async function load() {
      try {
        setLoading(true);
        const dates = await fetch(`${API}/dates`).then(r => r.json());
        if (!dates.length) throw new Error('No dates available');
        const today = dates[0].date;
        setTodayStr(today);
        const rows = await fetch(`${API}/commodities/by-date/${today}`).then(r => r.json());
        setAllRows(rows);
        // Load previous date for WoW
        let prev = [];
        if (dates.length > 1) {
          const prevDate = dates[Math.min(6, dates.length - 1)].date;
          prev = await fetch(`${API}/commodities/by-date/${prevDate}`).then(r => r.json()).catch(() => []);
        }
        setPrevRows(prev);
        setCommodities(buildCommodityList(rows, prev));
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    }
    load();
  }, []);

  function toggleWatch(id) {
    setWatchlist(w => { const n = { ...w }; if (n[id]) delete n[id]; else n[id] = true; return n; });
  }

  function openCommodity(id) {
    setSearchOpen(false);
    setOpenId(id);
    setRoute('commodity');
  }

  const openCommodityObj = useMemo(() => {
    if (!openId || route !== 'commodity') return null;
    return commodities.find(c => c.id === openId) || null;
  }, [openId, route, commodities]);

  const watchCount = Object.keys(watchlist).length;

  if (loading) return <LoadingScreen />;

  if (error) return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 16, background: 'var(--bg)' }}>
      <div style={{ color: 'var(--negative)', fontWeight: 600 }}>Failed to load USDA data</div>
      <div style={{ color: 'var(--text-muted)', fontSize: 12 }}>{error}</div>
      <button className="btn primary" onClick={() => window.location.reload()}><Ico.Refresh /> Retry</button>
    </div>
  );

  return (
    <div className="app">
      {/* Brand */}
      <div className="brand">
        <div className="logo" style={{ cursor: 'pointer' }} onClick={() => setRoute('markets')}>a</div>
        <div className="wm" style={{ cursor: 'pointer' }} onClick={() => setRoute('markets')}>agra<span className="x">X</span></div>
      </div>

      {/* Topbar */}
      <div className="topbar">
        <Crumbs route={route} setRoute={(r) => { setRoute(r); if (r === 'markets') setOpenId(null); }} />
        <div className="spacer" />
        <button className="search" onClick={() => setSearchOpen(true)} style={{ background: 'var(--bg)' }}>
          <Ico.Search />
          <input readOnly placeholder="Search commodities, origins… ⌘K" style={{ pointerEvents: 'none' }} />
          <kbd>⌘K</kbd>
        </button>
        {/* Theme toggle */}
        <button className="btn ghost sm" onClick={() => setDark(d => !d)} title="Toggle dark mode">
          <Ico.Sun />
        </button>
        {/* Density */}
        <div className="seg">
          {['compact', 'regular', 'spacious'].map(d => (
            <button key={d} className={density === d ? 'on' : ''} onClick={() => setDensity(d)} title={d}>
              {d === 'compact' ? 'S' : d === 'regular' ? 'M' : 'L'}
            </button>
          ))}
        </div>
      </div>

      {/* Sidenav */}
      <nav className="sidenav">
        <div className="nav-section">Explore</div>
        <NavItem icon={<Ico.Grid />} label="Markets" active={route === 'markets' || route === 'commodity'} onClick={() => { setRoute('markets'); setOpenId(null); }} />
        <NavItem icon={<Ico.Truck />} label="Shipping Points" active={route === 'shipping'} onClick={() => setRoute('shipping')} />

        <div className="nav-section">Workspace</div>
        <NavItem icon={<Ico.Star />} label="Watchlist" badge={watchCount || null} active={route === 'watchlist'} onClick={() => setRoute('watchlist')} />

        {/* Status */}
        <div style={{ marginTop: 'auto', padding: '14px 8px 6px', borderTop: '1px solid var(--border-soft)' }}>
          <div className="label-eyebrow" style={{ padding: '0 6px 8px', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--positive)', animation: 'livepulse 2s infinite' }} />
            USDA AMS Live
          </div>
          <div style={{ padding: '0 6px', fontSize: 11.5, color: 'var(--text-muted)', lineHeight: 1.5 }}>
            <div>{commodities.length} commodities</div>
            <div>{allRows.filter(r => r.market_type === 'terminal').length} terminal listings</div>
            <div style={{ color: 'var(--text-dim)', marginTop: 4, fontSize: 11, fontFamily: 'var(--font-mono)' }}>{fmtDateShort(todayStr)}</div>
          </div>
        </div>
      </nav>

      {/* Main */}
      <main className="main">
        {route === 'markets' && (
          <MarketsScreen
            commodities={commodities}
            market={market}
            setMarket={setMarket}
            watchlist={watchlist}
            toggleWatch={toggleWatch}
            onOpen={openCommodity}
            todayStr={todayStr}
            loading={false}
          />
        )}
        {route === 'commodity' && openCommodityObj && (
          <CommodityScreen
            commodity={openCommodityObj}
            market={market}
            setMarket={setMarket}
            watchlist={watchlist}
            toggleWatch={toggleWatch}
            onBack={() => { setRoute('markets'); setOpenId(null); }}
            allCommodities={commodities}
            onOpen={openCommodity}
            todayStr={todayStr}
          />
        )}
        {route === 'watchlist' && (
          <WatchlistScreen
            commodities={commodities}
            watchlist={watchlist}
            toggleWatch={toggleWatch}
            onOpen={openCommodity}
            market={market}
            todayStr={todayStr}
          />
        )}
        {route === 'shipping' && (
          <ShippingScreen
            allRows={allRows}
            todayStr={todayStr}
            onOpen={openCommodity}
          />
        )}
      </main>

      {/* Status bar */}
      <div className="statusbar">
        <span><span className="dot" />Connected · USDA AMS</span>
        <span className="sep">|</span>
        <span>{fmtDateShort(todayStr)}</span>
        <span className="sep">|</span>
        <span>{commodities.length} commodities · {allRows.filter(r => r.market_type === 'terminal').length} terminal listings · {allRows.filter(r => r.market_type === 'shipping_point' && r.market !== 'National Trends').length} FOB listings</span>
      </div>

      {searchOpen && (
        <SearchOverlay
          commodities={commodities}
          onClose={() => setSearchOpen(false)}
          onOpen={openCommodity}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
