<style>
body { margin:0; background:#FAFAF9; font-family:'Geist', -apple-system, BlinkMacSystemFont, sans-serif; color:#171A16; -webkit-font-smoothing:antialiased; }
  a { color:#186B39; text-decoration:none; }
  a:hover { color:#14562F; }
  ::-webkit-scrollbar { height:6px; width:6px; }
  ::-webkit-scrollbar-thumb { background:#D5D8D0; border-radius:3px; }

/* hover rules lifted from style-hover */
.h0:hover{background:#14562F !important}
.h1:hover{background:#14562F;color:#fff !important}
.h2:hover{background:#16412A !important}
.h3:hover{background:rgba(255,255,255,0.28);color:#fff !important}
.h4:hover{color:#072B18 !important}
.h5:hover{color:#171A16 !important}
.h6:hover{color:#171A16;border-color:#B7C4AF !important}
.h7:hover{color:#186B39 !important}

/* Desktop and mobile are separate layouts in the export; CSS picks one. */
.dc-narrow { display: none; }
@media (max-width: 899px) {
  .dc-wide   { display: none; }
  .dc-narrow { display: block; }
  /* iOS zooms a focused input under 16px. */
  input, select, textarea { font-size: 16px !important; }
}

/* Homepage navigation. */
.home-header { background:#fff; border-bottom:1px solid #E3E7DF; padding:0 20px; }
.home-header__inner { max-width:1440px; min-height:76px; margin:0 auto; display:flex; align-items:center; gap:48px; }
.home-header__brand { flex:none; display:inline-flex; align-items:center; min-height:44px; }
.home-header__logo { display:block; background:#072B18; mask:url(/assets/agrax-logo-white-cropped.png) center/contain no-repeat; -webkit-mask:url(/assets/agrax-logo-white-cropped.png) center/contain no-repeat; }
.home-header__nav { display:flex; align-items:center; gap:28px; }
.home-header__nav a { display:inline-flex; align-items:center; min-height:44px; color:#4A5147; font-size:14px; font-weight:500; white-space:nowrap; }
.home-header__nav a:hover { color:#186B39; }
.home-header__cta { margin-left:auto; min-height:42px; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:12px; border:1px solid #1F5236; border-radius:6px; background:#1F5236; color:#fff; font:500 13px 'Geist',sans-serif; white-space:nowrap; cursor:pointer; }
.home-header__cta:hover { background:#16412A; }
.home-header a:focus-visible, .home-header button:focus-visible { outline:2px solid #186B39; outline-offset:4px; }
@media (max-width:899px) {
  .home-header { padding:0 14px; }
  .home-header__inner { min-height:0; padding-top:12px; gap:8px 16px; flex-wrap:wrap; }
  .home-header__cta { min-height:40px; padding:0 12px; font-size:12px; gap:8px; }
  .home-header__nav { order:3; width:100%; justify-content:space-between; gap:12px; border-top:1px solid #F0F1EC; }
  .home-header__nav a { font-size:12px; }
}

/* Search suggestions. */
.agx-sug { position:absolute; z-index:200; left:0; right:0; top:calc(100% + 6px);
  background:#fff; border:1px solid #E4E6DF; border-radius:10px;
  box-shadow:0 8px 28px rgba(23,26,22,0.13); overflow:hidden; display:none; }
.agx-sug[data-open] { display:block; }
.agx-sug__item { display:flex; align-items:baseline; gap:10px; width:100%;
  padding:10px 14px; border:0; background:none; cursor:pointer; text-align:left;
  font-family:inherit; border-bottom:1px solid #F1F2ED; }
.agx-sug__item:last-child { border-bottom:0; }
.agx-sug__item:hover, .agx-sug__item[data-active] { background:#F4F6F1; }
.agx-sug__label { font-size:13px; font-weight:500; color:#171A16; }
.agx-sug__sub { font-size:11.5px; color:#8A8F86; margin-left:auto; white-space:nowrap; }
@media (max-width: 899px) { .agx-sug__item { padding:13px 14px; } }

</style>

<!-- Exported from Claude Design. Styles unmodified; the design tool's sample
     data script was removed so every figure comes from the API. -->
<template id="page-template">

<style>
  body { margin:0; background:#FAFAF9; font-family:'Geist', -apple-system, BlinkMacSystemFont, sans-serif; color:#171A16; -webkit-font-smoothing:antialiased; }

<template data-if="wide">
<div style="min-height:100vh;display:flex;flex-direction:column;background:#FAFAF9">

  <header class="home-header">
    <div class="home-header__inner">
      <a href="/" class="home-header__brand" aria-label="AgraX home"><span class="home-header__logo site-header-logo" aria-hidden="true"></span></a>
      <nav class="home-header__nav" aria-label="Main navigation">
        <a href="/browse">Browse prices</a>
        <a href="#markets-wide">Markets</a>
      </nav>
      <div class="account-actions" data-account-actions></div>
    </div>
  </header>

  <section style="position:relative;background:#171A16;padding:104px 20px 96px;display:flex;justify-content:center;overflow:hidden">
    <img src="/assets/farm-hero.webp" alt="Rows of young trees in an orchard at first light" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right, rgba(20,26,18,0.62) 0%, rgba(20,26,18,0.40) 44%, rgba(20,26,18,0.10) 100%)"></div>
    <div style="position:relative;width:100%;max-width:1440px">
      <div style="font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.82)">Grounded in the market.</div>
      <h1 style="margin:18px 0 0;font-size:72px;font-weight:400;letter-spacing:-0.03em;line-height:1.02;color:#fff;text-wrap:balance">From the field.<br>To your next decision.</h1>
      <p style="margin:24px 0 0;max-width:560px;font-size:17px;line-height:1.5;color:rgba(255,255,255,0.92);letter-spacing:-0.005em;text-wrap:pretty">The produce market moves every morning.<br>See the prices, the origins, and the details that matter.</p>
      <div style="margin-top:30px;position:relative;display:flex;align-items:center;max-width:600px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A8F86" stroke-width="2" stroke-linecap="round" style="position:absolute;left:18px"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        <input data-value="query" data-on-input="onQuery" data-search-input placeholder="Commodity, variety or origin" style="width:100%;height:52px;background:#fff;border:0;border-radius:26px;padding:0 114px 0 44px;font-size:15.5px;letter-spacing:-0.005em;outline:none;color:#171A16">
        <a href="/browse" data-on-click="onSearch" style="position:absolute;right:5px;height:42px;padding:0 20px;border-radius:21px;background:#186B39;color:#fff;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center" class="h1">Search</a>
      </div>
      <div style="margin-top:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:12.5px;color:rgba(255,255,255,0.82)">Popular</span>
        <template data-for="popular" data-as="p">
          <a href="{{ p.href }}" style="height:30px;padding:0 13px;border-radius:15px;background:rgba(255,255,255,0.16);color:#fff;font-size:12.5px;display:inline-flex;align-items:center;white-space:nowrap" class="h3">{{ p.name }}</a>
        </template>
      </div>
    </div>
  </section>

  <section style="background:#FAFAF9;border-bottom:1px solid #EDEEE9;padding:26px 20px;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 28px">
      <template data-for="stats" data-as="s">
        <div style="min-width:0">
          <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:24px;font-weight:500;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums">{{ s.value }}</div>
          <div style="margin-top:7px;font-size:12.5px;letter-spacing:-0.005em">{{ s.label }}</div>
          <div style="margin-top:2px;font-size:11.5px;color:#8A8F86;letter-spacing:-0.005em">{{ s.note }}</div>
        </div>
      </template>
    </div>
  </section>

  <section style="background:#FAFAF9;padding:76px 20px 64px;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px">
      <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#8A8F86">01 / What AgraX covers</div>
      <h2 style="margin: 18px 0 0; font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; text-wrap: balance">The whole journey.<br>A clearer market picture.</h2>

      <div style="margin-top:44px;position:relative">
        <div style="position:absolute;left:0;right:0;top:10px;height:1px;background:#D7DBD1"></div>
        <div style="position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px">
          <template data-for="stations" data-as="s">
            <div style="min-width:0">
              <div style="display:flex;align-items:center;gap:9px">
                <span style="width:21px;height:21px;border-radius:50%;background:#FAFAF9;border:1px solid #186B39;display:inline-flex;align-items:center;justify-content:center;font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;color:#186B39">{{ s.n }}</span>
                <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:#6B7268">{{ s.stage }}</span>
              </div>
              <div style="margin-top:20px;font-size:19px;font-weight:600;letter-spacing:-0.025em">{{ s.title }}</div>
              <p style="margin:8px 0 0;font-size:13.5px;line-height:1.6;color:#4A5147;letter-spacing:-0.005em;text-wrap:pretty">{{ s.body }}</p>
              <div style="margin-top:16px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;color:#6B7268;font-variant-numeric:tabular-nums">{{ s.metric }}</div>
              <a href="{{ s.href }}" style="margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500">{{ s.cta }}
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="18" x2="18" y2="6"></line><polyline points="10 6 18 6 18 14"></polyline></svg>
              </a>
            </div>
          </template>
        </div>
      </div>

    </div>
  </section>

  <section style="background:#EEF1E9;padding:68px 20px 68px;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px">
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:40px;align-items:end">

        <p style="margin:0;font-size:13.5px;line-height:1.6;color:#5A6156;letter-spacing:-0.005em">Four USDA report groups.<br>Every specification, clearly organized.</p>

      <div style="margin-top:32px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px">

          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#5E7A55" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.6c-3.1 0-5.2 2.3-5.2 5.4 0 3.5 2.5 6.5 5.2 6.5s5.2-3 5.2-6.5c0-3.1-2.1-5.4-5.2-5.4Z"></path><path d="M12 8.6V7"></path><path d="M12.6 7.6c1.2-1.5 3-1.9 4.2-1.8-.2 1.4-1.5 2.6-3 2.8-.7.1-1.1 0-1.2-.2-.1-.3 0-.6 0-.8Z"></path></svg>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7A8476" stroke-width="2" stroke-linecap="round" style="margin-top:22px;align-self:flex-end;margin-bottom:0"><line x1="6" y1="18" x2="18" y2="6"></line><polyline points="10 6 18 6 18 14"></polyline></svg>
        </a>

  <section id="markets-wide" style="background:#FFFFFF;padding:84px 20px 84px;display:flex;justify-content:center">

        <h2 style="margin: 16px 0 0; font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; text-wrap: balance">A national view.<br>Your local market.</h2>
        <p style="margin:14px 0 0;font-size:13.5px;line-height:1.6;color:#6B7268;letter-spacing:-0.005em;text-wrap:pretty">Choose a city to see its current published report.</p>
