<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgraX — every USDA produce price, down to the pack and size</title>
<meta name="description" content="USDA terminal market prices, shipping point FOB and movement data, published every weekday morning. Every price as reported.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body { margin:0; background:#F5F5F2; font-family:'Geist', -apple-system, BlinkMacSystemFont, sans-serif; color:#171A16; -webkit-font-smoothing:antialiased; }
  a { color:#186B39; text-decoration:none; }
  a:hover { color:#14562F; }
  ::-webkit-scrollbar { height:6px; width:6px; }
  ::-webkit-scrollbar-thumb { background:#D5D8D0; border-radius:3px; }

/* hover rules lifted from style-hover */
.h0:hover{background:#14562F !important}
.h1:hover{background:#14562F;color:#fff !important}
.h2:hover{background:#E8EAE4;color:#171A16 !important}
.h3:hover{color:#171A16 !important}
.h4:hover{color:#186B39 !important}
.h5:hover{color:#fff !important}

/* Desktop and mobile are two separate layouts in the design export, not one
   fluid grid. Both are rendered; this picks which is painted. 900px is the
   breakpoint the design was authored against. */
.dc-narrow { display: none; }
@media (max-width: 899px) {
  .dc-wide   { display: none; }
  .dc-narrow { display: block; }
}
</style>
</head>
<body>

<!-- Markup exported from Claude Design, unmodified apart from link targets.
     Held in a template so the controller can mount it with live data and
     re-render without the original being lost. -->
<template id="page-template">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

<style>
  body { margin:0; background:#F5F5F2; font-family:'Geist', -apple-system, BlinkMacSystemFont, sans-serif; color:#171A16; -webkit-font-smoothing:antialiased; }
  a { color:#186B39; text-decoration:none; }
  a:hover { color:#14562F; }
  ::-webkit-scrollbar { height:6px; width:6px; }
  ::-webkit-scrollbar-thumb { background:#D5D8D0; border-radius:3px; }
</style>


<template data-if="wide">
<div style="min-height:100vh;display:flex;flex-direction:column;background:#F5F5F2">

  <header style="background:#0A0B0A;padding:0 20px;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <a href="/" style="flex:none;min-height:52px;display:inline-flex;align-items:center"><img src="/assets/agrax-logo-white-cropped.png" alt="AgraX" style="height: 24px; width: 66px; display: block"></a>
    <nav style="display:flex;align-items:center;gap:2px;flex:none">
      <span style="height:30px;padding:0 12px;border-radius:15px;background:#1D211D;color:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer">Home</span>
      <a href="/browse" style="height:30px;padding:0 12px;border-radius:15px;color:#9A9F98;font-size:13px;font-weight:500;display:inline-flex;align-items:center" class="h5">Browse</a>
      <span style="height:30px;padding:0 12px;border-radius:15px;color:#9A9F98;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h5">Movers</span>
      <span style="height:30px;padding:0 12px;border-radius:15px;color:#9A9F98;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h5">Watchlist</span>
      <span style="height:30px;padding:0 12px;border-radius:15px;color:#9A9F98;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h5">Reports</span>
    </nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#9A9F98;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#3D9E5F"></span>{{ stamp }}</span>
      <span style="height:30px;padding:0 14px;border-radius:15px;background:#186B39;color:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer" class="h0">Sign in</span>
    </div>
    </div>
  </header>

  <section style="position:relative;background:#fff;border-bottom:1px solid #EDEEE9;padding:34px 20px 26px;display:flex;justify-content:center;overflow:hidden">
    <div style="position:absolute;top:0;left:0;bottom:0;width:62%;-webkit-mask-image:linear-gradient(to left, transparent 0%, rgba(0,0,0,0.35) 34%, rgba(0,0,0,0.8) 72%, #000 100%);mask-image:linear-gradient(to left, transparent 0%, rgba(0,0,0,0.35) 34%, rgba(0,0,0,0.8) 72%, #000 100%)">
      <div data-slot="home-hero-right" style="width:100%;height:100%"></div>
    </div>
    <div style="position:absolute;top:0;left:0;bottom:0;width:62%;pointer-events:none;backdrop-filter:blur(34px) saturate(1.08);-webkit-backdrop-filter:blur(34px) saturate(1.08);background:linear-gradient(to left, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.80) 45%, rgba(255,255,255,0.66) 100%)"></div>
    <div style="position:relative;width:100%;max-width:1440px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:32px;align-items:end">
      <div style="min-width:0">
        <h1 style="margin:0;font-size:38px;font-weight:600;letter-spacing:-0.035em;line-height:1.05;text-wrap:balance">Every USDA produce price, down to the pack and size.</h1>
        <p style="margin:12px 0 0;max-width:640px;font-size:15px;line-height:1.55;color:#6B7268;letter-spacing:-0.005em;text-wrap:pretty">Terminal market prints, shipping point FOB and movement data for {{ coverCommodities }} commodities, cleaned and cross-linked the morning they post.</p>
        <div style="margin-top:18px;position:relative;display:flex;align-items:center;max-width:640px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A8F86" stroke-width="2" stroke-linecap="round" style="position:absolute;left:16px"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
          <input data-value="query" data-on-change="onQuery" placeholder="Commodity, variety or origin" style="width:100%;height:46px;background:#F4F4F0;border:0;border-radius:23px;padding:0 108px 0 42px;font-size:15px;letter-spacing:-0.005em;outline:none">
          <a href="/browse" style="position:absolute;right:5px;height:36px;padding:0 18px;border-radius:18px;background:#186B39;color:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center" class="h1">Search</a>
        </div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap">
          <span style="font-size:12.5px;color:#8A8F86">Popular</span>
          <template data-for="popular" data-as="p">
            <a href="/browse" style="height:28px;padding:0 12px;border-radius:14px;background:#F4F4F0;color:#171A16;font-size:12.5px;display:inline-flex;align-items:center;white-space:nowrap" class="h2">{{ p.name }}</a>
          </template>
        </div>
      </div>
      <div style="min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:18px 20px">
        <template data-for="stats" data-as="s">
          <div style="min-width:0">
            <div style="font-family:'Geist Mono',ui-monospace,monospace;font-size:26px;font-weight:500;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums">{{ s.value }}</div>
            <div style="margin-top:7px;font-size:12.5px;letter-spacing:-0.005em">{{ s.label }}</div>
            <div style="margin-top:2px;font-size:11.5px;color:#8A8F86;letter-spacing:-0.005em">{{ s.note }}</div>
          </div>
        </template>
      </div>
    </div>
  </section>

  <section style="background:#fff;padding:76px 20px 64px;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px">
      <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:30px;font-weight:600;letter-spacing:-0.03em;line-height:1.2">What AgraX covers</h2>
        <span style="font-size:13.5px;color:#6B7268;letter-spacing:-0.005em">Terminal prints, origin FOB, and the movement behind every row.</span>
      </div>

      <div style="margin-top:36px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 40px">
        <div style="min-width:0;border-top:1px solid #E4E6DF;padding-top:18px">
          <div style="margin-top:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:30px;letter-spacing:-0.035em;line-height:1;font-variant-numeric:tabular-nums">{{ coverTerminals }}</span>
            <span style="font-size:12.5px;color:#6B7268;letter-spacing:-0.005em">terminals daily</span>
          </div>
          <div style="margin-top:12px;font-size:15px;font-weight:600;letter-spacing:-0.018em">Terminal markets</div>
          <p style="margin:6px 0 0;max-width:340px;font-size:13px;line-height:1.55;color:#6B7268;letter-spacing:-0.005em;text-wrap:pretty">Wholesale prints from {{ coverTerminals }} city terminals, priced by variety, origin, grade, pack and size.</p>
        </div>
        <div style="min-width:0;border-top:1px solid #E4E6DF;padding-top:18px">
          <div style="margin-top:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:30px;letter-spacing:-0.035em;line-height:1;font-variant-numeric:tabular-nums">{{ coverDistricts }}</span>
            <span style="font-size:12.5px;color:#6B7268;letter-spacing:-0.005em">districts</span>
          </div>
          <div style="margin-top:12px;font-size:15px;font-weight:600;letter-spacing:-0.018em">Shipping point FOB</div>
          <p style="margin:6px 0 0;max-width:340px;font-size:13px;line-height:1.55;color:#6B7268;letter-spacing:-0.005em;text-wrap:pretty">Origin prices from {{ coverDistricts }} districts, set beside the terminal row they feed so the spread reads at a glance.</p>
        </div>
        <div style="min-width:0;border-top:1px solid #E4E6DF;padding-top:18px">
          <div style="margin-top:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:30px;letter-spacing:-0.035em;line-height:1;font-variant-numeric:tabular-nums">{{ coverLoads }}</span>
            <span style="font-size:12.5px;color:#6B7268;letter-spacing:-0.005em">loads tracked this week</span>
          </div>
          <div style="margin-top:12px;font-size:15px;font-weight:600;letter-spacing:-0.018em">Movement data</div>
          <p style="margin:6px 0 0;max-width:340px;font-size:13px;line-height:1.55;color:#6B7268;letter-spacing:-0.005em;text-wrap:pretty">Truck arrivals by origin and commodity, so a price move reads against the supply behind it.</p>
        </div>
      </div>

    </div>
  </section>

  <section style="background:#fff;padding:76px 20px 0;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px">
      <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:30px;font-weight:600;letter-spacing:-0.03em;line-height:1.2">Categories</h2>
        <a href="/browse" style="margin-left:auto;font-size:13.5px;font-weight:500;white-space:nowrap">Browse all commodities</a>
      </div>

      <div style="margin-top:28px">
        <template data-for="categories" data-as="c">
          <a href="/browse" style="display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 92px;gap:24px;align-items:baseline;padding:22px 0;border-top:1px solid #EDEEE9;color:#171A16" class="h4">
            <span style="font-size:22px;font-weight:600;letter-spacing:-0.025em">{{ c.name }}</span>
            <span style="min-width:0;font-size:13.5px;color:#8A8F86;letter-spacing:-0.005em;text-wrap:pretty">{{ c.items }}</span>
            <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;color:#6B7268;text-align:right;white-space:nowrap">{{ c.count }}</span>
          </a>
        </template>
      </div>
    </div>
  </section>

  <section style="background:#fff;padding:76px 20px 0;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px">
      <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:30px;font-weight:600;letter-spacing:-0.03em;line-height:1.2">Terminal markets</h2>
        <span style="font-size:13.5px;color:#8A8F86;letter-spacing:-0.005em">All twelve cities reporting today</span>
      </div>
      <div style="margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 48px">
        <template data-for="terminals" data-as="t">
          <a href="/browse" style="min-width:0;display:flex;align-items:baseline;gap:16px;padding:15px 0;border-top:1px solid #EDEEE9;color:#171A16" class="h4">
            <span style="min-width:0;flex:1;font-size:15.5px;font-weight:500;letter-spacing:-0.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.name }}</span>
            <span style="flex:none;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;color:#6B7268;font-variant-numeric:tabular-nums">{{ t.count }}</span>
          </a>
        </template>
      </div>
    </div>
  </section>

  <section style="background:#fff;padding:80px 20px 88px;display:flex;justify-content:center">
    <div style="width:100%;max-width:1440px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:36px 72px;align-items:start">
      <div style="min-width:0;max-width:520px">
        <h2 style="margin:0;font-size:30px;font-weight:600;letter-spacing:-0.03em;line-height:1.2;text-wrap:balance">Where the numbers come from</h2>
        <p style="margin:14px 0 0;font-size:14px;line-height:1.65;color:#6B7268;letter-spacing:-0.005em;text-wrap:pretty">USDA AMS Market News publishes each terminal and shipping point report as free text. AgraX parses every line into a priced row, keeps the source wording, and marks how each price was derived.</p>
        <a href="/about" style="display:inline-block;margin-top:20px;font-size:13.5px;font-weight:500">About the data</a>
      </div>
      <div style="min-width:0">
        <div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:baseline;padding:16px 0;border-top:1px solid #EDEEE9">
          <span style="height:22px;padding:0 10px;border-radius:11px;background:#EAF3EA;color:#1F5F32;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;justify-self:start">mostly</span>
          <span style="font-size:13.5px;line-height:1.55;color:#4A5148;letter-spacing:-0.005em;text-wrap:pretty">Transaction-weighted price. The gold standard, and what most of the market traded at.</span>
        </div>
        <div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:baseline;padding:16px 0;border-top:1px solid #EDEEE9">
          <span style="height:22px;padding:0 10px;border-radius:11px;background:#FAF1E2;color:#7A5A1E;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;justify-self:start">mid-range</span>
          <span style="font-size:13.5px;line-height:1.55;color:#4A5148;letter-spacing:-0.005em;text-wrap:pretty">Calculated midpoint of a reported low-to-high range.</span>
        </div>
        <div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:baseline;padding:16px 0;border-top:1px solid #EDEEE9;border-bottom:1px solid #EDEEE9">
          <span style="height:22px;padding:0 10px;border-radius:11px;background:#F0F1EE;color:#5A6158;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;justify-self:start">reported</span>
          <span style="font-size:13.5px;line-height:1.55;color:#4A5148;letter-spacing:-0.005em;text-wrap:pretty">A single clean print, where the reported low and high are identical.</span>
        </div>
      </div>
    </div>
  </section>

  <footer style="margin-top:auto;background:#fff;border-top:1px solid #EDEEE9;padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <img src="/assets/agrax-logo-black.png" alt="AgraX" style="height:14px;width:auto;display:block;opacity:0.55">
    <span style="font-size:12.5px;color:#8A8F86;letter-spacing:-0.005em">USDA AMS Market News · terminal and shipping point reports · updated 05:26 ET</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:18px">
      <a href="/browse" style="font-size:12.5px;color:#4A5148">Browse</a>
      <a href="/about" style="font-size:12.5px;color:#4A5148">About the data</a>
    </div>
  </footer>
</div>
</template>

<template data-if="narrow">
<div style="min-height:100vh;display:flex;flex-direction:column;background:#F5F5F2">

  <div style="flex:none;background:#0A0B0A;padding:11px 14px;display:flex;align-items:center;gap:12px">
    <a href="/" style="flex:none;display:inline-flex;align-items:center"><img src="/assets/agrax-logo-white-cropped.png" alt="AgraX" style="height:25px;width:68px;display:block"></a>
    <div style="flex:1;min-width:0;position:relative;display:flex;align-items:center">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A5148" stroke-width="2.2" stroke-linecap="round" style="position:absolute;left:12px"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input data-value="query" data-on-change="onQuery" placeholder="Search commodities or prices" style="width:100%;height:38px;background:#fff;border:0;border-radius:6px;padding:0 14px 0 36px;font-size:15px;outline:none">
    </div>
  </div>

  <section style="position:relative;flex:none;background:#fff;border-bottom:1px solid #EDEEE9;padding:20px 14px 18px;overflow:hidden">
    <div style="position:absolute;inset:0;-webkit-mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.45) 62%, transparent 100%);mask-image:linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.45) 62%, transparent 100%)">
      <div data-slot="home-hero-right" style="width:100%;height:100%"></div>
    </div>
    <div style="position:absolute;inset:0;pointer-events:none;backdrop-filter:blur(30px) saturate(1.08);-webkit-backdrop-filter:blur(30px) saturate(1.08);background:linear-gradient(to bottom, rgba(255,255,255,0.80) 0%, rgba(255,255,255,0.93) 70%, #fff 100%)"></div>
    <div style="position:relative">
      <h1 style="margin:0;font-size:27px;font-weight:600;letter-spacing:-0.03em;line-height:1.1;text-wrap:balance">Every USDA produce price, down to the pack and size.</h1>
      <p style="margin:10px 0 0;font-size:13.5px;line-height:1.5;color:#6B7268;letter-spacing:-0.005em;text-wrap:pretty">Terminal market prints, shipping point FOB and movement data for {{ coverCommodities }} commodities, cleaned and cross-linked the morning they post.</p>
      <a href="/browse" style="margin-top:14px;height:42px;border-radius:21px;background:#186B39;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px" class="h1">Search prices
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="18" y2="12"></line><polyline points="13 7 18 12 13 17"></polyline></svg>
      </a>
      <div style="margin-top:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:-14px;margin-right:-14px;padding:0 14px">
        <span style="flex:none;font-size:11.5px;color:#8A8F86;display:inline-flex;align-items:center">Popular</span>
        <template data-for="popular" data-as="p">
          <a href="/browse" style="flex:none;height:30px;padding:0 12px;border-radius:15px;background:#F4F4F0;color:#171A16;font-size:12.5px;display:inline-flex;align-items:center;white-space:nowrap" class="h2">{{ p.name }}</a>
        </template>
      </div>
      <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#DCDFD6;border-radius:8px;overflow:hidden">
        <template data-for="stats" data-as="s">
          <span style="background:#FBFBF8;padding:9px 11px 10px;display:block">
            <span style="display:block;font-family:'Geist Mono',ui-monospace,monospace;font-size:18px;font-weight:500;letter-spacing:-0.025em;font-variant-numeric:tabular-nums">{{ s.value }}</span>
            <span style="display:block;margin-top:3px;font-size:12px;letter-spacing:-0.005em">{{ s.label }}</span>
            <span style="display:block;font-size:11px;color:#8A8F86;letter-spacing:-0.005em">{{ s.note }}</span>
          </span>
        </template>
      </div>
    </div>
  </section>

  <section style="background:#fff;padding:34px 14px 26px">
    <h2 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.028em;line-height:1.2">What AgraX covers</h2>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:18px">
      <div style="border-top:1px solid #E4E6DF;padding-top:14px">
        <div style="height:150px;border-radius:8px;border:1px solid rgba(23,26,22,0.12);box-shadow:0 2px 8px rgba(23,26,22,0.06);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="/assets/shot-rows.png" alt="Price rows showing variety, origin, pack and size with the terminal price" style="height:100%;width:auto;max-width:100%;object-fit:contain;display:block">
        </div>
        <div style="margin-top:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
