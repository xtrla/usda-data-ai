// ─── Sparkline ───────────────────────────────────────────────────────────────
function Sparkline({ data, w = 88, h = 22 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const pad = 1.5;
  const dx = (w - pad * 2) / (data.length - 1);
  const range = max - min || 1;
  const pts = data.map((v, i) => [pad + i * dx, pad + (h - pad * 2) * (1 - (v - min) / range)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
  const trend = data[data.length - 1] >= data[0];
  const color = trend ? 'var(--positive)' : 'var(--negative)';
  const last = pts[pts.length - 1];
  return (
    <svg width={w} height={h} style={{ overflow: 'visible', display: 'block' }}>
      <path d={d} fill="none" stroke={color} strokeWidth="1.25" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last[0]} cy={last[1]} r="1.7" fill={color} />
    </svg>
  );
}

// ─── Delta ───────────────────────────────────────────────────────────────────
function Delta({ pct }) {
  if (pct == null || isNaN(pct)) return <span className="delta flat">—</span>;
  if (Math.abs(pct) < 0.05) return <span className="delta flat">0.0%</span>;
  const cls = pct > 0 ? 'up' : 'dn';
  return <span className={`delta ${cls}`}>{pct > 0 ? '+' : ''}{pct.toFixed(2)}%</span>;
}

// ─── Supply Pill ─────────────────────────────────────────────────────────────
function SupplyPill({ v }) {
  if (!v) return <span className="pill">—</span>;
  const low = v.toLowerCase();
  const cls = low.includes('lower') || low.includes('much lower') ? 'negative' :
              low.includes('higher') || low.includes('much higher') ? 'positive' : '';
  return <span className={`pill ${cls}`}>{v}</span>;
}

const TERMINALS = [
  { code: 'ALL', city: 'All Markets', state: '', region: '' },
  { code: 'NYC', city: 'New York', state: 'NY', region: 'Northeast' },
  { code: 'BOS', city: 'Boston', state: 'MA', region: 'Northeast' },

  { code: 'BAL', city: 'Baltimore', state: 'MD', region: 'Mid-Atlantic' },
  { code: 'ATL', city: 'Atlanta', state: 'GA', region: 'Southeast' },
  { code: 'MIA', city: 'Miami', state: 'FL', region: 'Southeast' },
  { code: 'CHI', city: 'Chicago', state: 'IL', region: 'Midwest' },
  { code: 'DET', city: 'Detroit', state: 'MI', region: 'Midwest' },
  { code: 'LAX', city: 'Los Angeles', state: 'CA', region: 'West' },
  { code: 'SFO', city: 'San Francisco', state: 'CA', region: 'West' },
];

function marketCodeFromName(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('new york')) return 'NYC';
  if (n.includes('boston')) return 'BOS';
  if (n.includes('philadelphia')) return 'PHL';
  if (n.includes('baltimore')) return 'BAL';
  if (n.includes('atlanta')) return 'ATL';
  if (n.includes('miami')) return 'MIA';
  if (n.includes('chicago')) return 'CHI';
  if (n.includes('detroit')) return 'DET';
  if (n.includes('los angeles')) return 'LAX';
  if (n.includes('san francisco')) return 'SFO';
  return null;
}

// ─── Category ────────────────────────────────────────────────────────────────
function guessCategory(name) {
  const n = name.toLowerCase();
  if (/apple|pear|grape|peach|plum|cherry|nectarine|kiwi|melon|watermelon|mango|papaya|pineapple|banana|avocado|orange|lemon|lime|grapefruit|tangerine|strawberr|blueberr|raspberr|blackberr|coconut|fig|pomegranate/.test(n)) return 'Fruits';
  if (/onion|shallot|leek/.test(n)) return 'Onions & Potatoes';
  if (/potato|yam|sweet potato/.test(n)) return 'Onions & Potatoes';
  if (/almond|walnut|pecan|pistachio|cashew|peanut|nut/.test(n)) return 'Nuts';
  return 'Vegetables';
}

// ─── Data helpers ─────────────────────────────────────────────────────────────
function buildCommodities(rows, prevRows) {
  const termRows = rows.filter(r => r.market_type === 'terminal' && r.price_low != null);
  const fobRows = rows.filter(r => r.market_type === 'shipping_point' && r.market !== 'National Trends' && r.price_low != null);
  const natRows = rows.filter(r => r.market === 'National Trends');

  const byComm = {};
  termRows.forEach(r => {
    if (!byComm[r.commodity]) byComm[r.commodity] = { name: r.commodity, cat: guessCategory(r.commodity), termRows: [], fobRows: [], nat: null };
    byComm[r.commodity].termRows.push(r);
  });
  fobRows.forEach(r => { if (byComm[r.commodity]) byComm[r.commodity].fobRows.push(r); });
  natRows.forEach(r => { if (byComm[r.commodity]) byComm[r.commodity].nat = r; });

  const prevPrices = {};
  if (prevRows) {
    prevRows.filter(r => r.market_type === 'terminal' && r.price_low != null).forEach(r => {
      if (!prevPrices[r.commodity]) prevPrices[r.commodity] = [];
      prevPrices[r.commodity].push(parseFloat(r.price_low));
    });
  }

  return Object.values(byComm).map(c => {
    const prices = c.termRows.map(r => parseFloat(r.price_low));
    const low = Math.min(...prices), high = Math.max(...prices);
    const mostly = prices.reduce((a, b) => a + b, 0) / prices.length;
    const prev = prevPrices[c.name];
    const prevAvg = prev ? prev.reduce((a, b) => a + b, 0) / prev.length : null;
    const wow = prevAvg ? ((mostly - prevAvg) / prevAvg) * 100 : 0;
    const origins = [...new Set(c.termRows.map(r => r.origin).filter(Boolean))];
    const fobPrices = c.fobRows.map(r => parseFloat(r.price_low));
    const fobAvg = fobPrices.length ? fobPrices.reduce((a, b) => a + b, 0) / fobPrices.length : null;
    const supply = c.nat?.movement || c.termRows[0]?.movement || null;
    const supplyNote = c.nat?.supply_note || null;
    // fake spark from wow
    const spark = Array.from({ length: 7 }, (_, i) => {
      const seed = c.name.charCodeAt(0) * 7 + i * 13;
      const noise = ((seed % 20) - 10) / 100;
      return mostly * (1 + noise + (wow / 100) * (i / 6));
    });
    return {
      id: c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      name: c.name, cat: c.cat, origins, low, high, mostly, wow, prevAvg,
      supply, supplyNote, fobAvg, termRows: c.termRows, fobRows: c.fobRows, spark,
    };
  }).sort((a, b) => Math.abs(b.wow) - Math.abs(a.wow));
}

function priceForMarket(c, marketCode) {
  if (!marketCode || marketCode === 'ALL') return { low: c.low, high: c.high, mostly: c.mostly };
  const mInfo = TERMINALS.find(t => t.code === marketCode);
  if (!mInfo) return { low: c.low, high: c.high, mostly: c.mostly };
  const relevant = c.termRows.filter(r => r.market && r.market.toLowerCase().includes(mInfo.city.toLowerCase()) && r.price_low != null);
  if (!relevant.length) return { low: c.low, high: c.high, mostly: c.mostly };
  const prices = relevant.map(r => parseFloat(r.price_low));
  return { low: Math.min(...prices), high: Math.max(...prices), mostly: prices.reduce((a, b) => a + b, 0) / prices.length };
}

function fmtDate(s) {
  if (!s) return '';
  return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function fmtShort(s) {
  if (!s) return '';
  return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ─── Market Picker ────────────────────────────────────────────────────────────
function MarketPicker({ market, setMarket }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const cur = TERMINALS.find(t => t.code === market) || TERMINALS[0];
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  const byRegion = useMemo(() => {
    const m = {};
    TERMINALS.slice(1).forEach(t => { (m[t.region] = m[t.region] || []).push(t); });
    return m;
  }, []);
  return (
    <div className="market-picker" ref={ref}>
      <button className="market-btn" onClick={() => setOpen(o => !o)}>
        <div className="m-ico"><Ico.Map /></div>
        <div className="m-main">
          <span className="m-city">{cur.city}{cur.state ? `, ${cur.state}` : ''}</span>
          <span className="m-hint">Terminal market · click to change</span>
        </div>
        <Ico.ChevR />
      </button>
      {open && (
        <div className="market-menu">
          <button className="mm-item" onClick={() => { setMarket('ALL'); setOpen(false); }}
            style={{ fontWeight: market === 'ALL' ? 600 : 400, color: market === 'ALL' ? 'var(--accent)' : '' }}>
            All Markets (national composite)
          </button>
          {Object.entries(byRegion).map(([region, mkts]) => (
            <div key={region}>
              <div className="mm-group">{region}</div>
              {mkts.map(t => (
                <button key={t.code} className={`mm-item ${market === t.code ? 'active' : ''}`}
                  onClick={() => { setMarket(t.code); setOpen(false); }}>
                  {t.city}, {t.state}
                </button>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Markets Screen (Commodities) ─────────────────────────────────────────────
const POPULAR_FRUITS = ['Avocados', 'Strawberries', 'Limes', 'Apples'];
const POPULAR_VEGS = ['Tomatoes', 'Lettuce, Iceberg', 'Onions', 'Potatoes'];

function MarketsScreen({ commodities, market, setMarket, watchlist, toggleWatch, onOpen, todayStr, catFilter }) {
  const [sortKey, setSortKey] = useState('wow');
  const [sortDir, setSortDir] = useState('desc');
  const [category, setCategory] = useState(catFilter || 'All');
  const [origin, setOrigin] = useState('All');
  const [trend, setTrend] = useState('All');
  const [watchOnly, setWatchOnly] = useState(false);
  const [searchQ, setSearchQ] = useState('');

  useEffect(() => { if (catFilter) setCategory(catFilter); }, [catFilter]);

  const cats = ['All', 'Fruits', 'Vegetables', 'Onions & Potatoes', 'Nuts'];
  const origins = ['All', 'Domestic', 'Imported'];
  const trends = ['All', 'Up today', 'Down today'];

  const popularFruit = useMemo(() => {
    const out = [];
    POPULAR_FRUITS.forEach(name => {
      const c = commodities.find(x => x.name.toLowerCase().includes(name.toLowerCase()));
      if (c) out.push(c);
    });
    if (out.length < 4) commodities.filter(c => c.cat === 'Fruits').slice(0, 4 - out.length).forEach(c => { if (!out.find(x => x.id === c.id)) out.push(c); });
    return out.slice(0, 4);
  }, [commodities]);

  const popularVeg = useMemo(() => {
    const out = [];
    POPULAR_VEGS.forEach(name => {
      const c = commodities.find(x => x.name.toLowerCase().includes(name.toLowerCase()));
      if (c) out.push(c);
    });
    if (out.length < 4) commodities.filter(c => c.cat === 'Vegetables').slice(0, 4 - out.length).forEach(c => { if (!out.find(x => x.id === c.id)) out.push(c); });
    return out.slice(0, 4);
  }, [commodities]);

  const watchItems = useMemo(() => commodities.filter(c => watchlist[c.id]), [commodities, watchlist]);

  const filtered = useMemo(() => {
    let list = [...commodities];
    if (category !== 'All') list = list.filter(c => c.cat === category);
    if (origin === 'Domestic') list = list.filter(c => c.origins.some(o => /(california|florida|washington|arizona|texas|georgia|oregon|michigan|ohio|idaho|colorado|north carolina|carolina)/i.test(o)));
    if (origin === 'Imported') list = list.filter(c => c.origins.some(o => /(mexico|chile|peru|ecuador|guatemala|honduras|colombia|costa rica|china)/i.test(o)));
    if (trend === 'Up today') list = list.filter(c => c.wow > 0.5);
    if (trend === 'Down today') list = list.filter(c => c.wow < -0.5);
    if (watchOnly) list = list.filter(c => watchlist[c.id]);
    if (searchQ) { const q = searchQ.toLowerCase(); list = list.filter(c => c.name.toLowerCase().includes(q) || c.origins.some(o => o.toLowerCase().includes(q))); }
    list.sort((a, b) => {
      const get = r => sortKey === 'name' ? r.name : sortKey === 'low' ? priceForMarket(r, market).low : sortKey === 'high' ? priceForMarket(r, market).high : sortKey === 'mostly' ? priceForMarket(r, market).mostly : sortKey === 'wow' ? r.wow : r.name;
      const A = get(a), B = get(b);
      if (typeof A === 'number') return (A - B) * (sortDir === 'asc' ? 1 : -1);
      return String(A).localeCompare(String(B)) * (sortDir === 'asc' ? 1 : -1);
    });
    return list;
  }, [commodities, category, origin, trend, watchOnly, searchQ, sortKey, sortDir, market, watchlist]);

  function sortBy(k) {
    if (sortKey === k) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(k); setSortDir(k === 'name' ? 'asc' : 'desc'); }
  }
  const si = k => sortKey === k ? (sortDir === 'asc' ? '▲' : '▼') : '↕';

  const mLabel = market === 'ALL' ? 'All Markets' : (TERMINALS.find(t => t.code === market)?.city || market);

  return (
    <div className="page">
      {/* Hero */}
      <div className="hero">
        <div className="hero-l">
          <div className="hero-eyebrow">
            <span className="pill live">Live</span>
            <span>Wholesale produce prices</span>
            <span className="sep">·</span>
            <span>USDA AMS Market News</span>
          </div>
          <h1 className="hero-date">{fmtDate(todayStr)}</h1>
          <div className="hero-meta">
            <strong>{commodities.length} commodities</strong>
            <span className="sep">·</span>
            <span>Updated daily from USDA AMS</span>
          </div>
        </div>
        <div className="hero-r">
          <MarketPicker market={market} setMarket={setMarket} />
        </div>
      </div>

      {/* Popular cards */}
      <div className="popular-grid" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, marginBottom: 20 }}>
        <PopularCard title="Popular fruit" subtitle="Today's wholesale prices" items={popularFruit} market={market} onOpen={onOpen} onSeeAll={() => setCategory('Fruits')} />
        <PopularCard title="Popular vegetables" subtitle="Today's wholesale prices" items={popularVeg} market={market} onOpen={onOpen} onSeeAll={() => setCategory('Vegetables')} />
        <WatchlistCard items={watchItems} market={market} onOpen={onOpen} watchCount={Object.keys(watchlist).length} />
      </div>

      {/* Filters */}
      <div className="fbar">
        <span className="label-eyebrow" style={{ marginRight: 4 }}>Category</span>
        {cats.map(c => <button key={c} className={`chip ${category === c ? 'active' : ''}`} onClick={() => setCategory(c)}>{c}</button>)}
        <span style={{ width: 12 }} />
        <span className="label-eyebrow" style={{ marginRight: 4 }}>Origin</span>
        {origins.map(o => <button key={o} className={`chip ${origin === o ? 'active' : ''}`} onClick={() => setOrigin(o)}>{o}</button>)}
        <span style={{ width: 12 }} />
        <span className="label-eyebrow" style={{ marginRight: 4 }}>Trend</span>
        {trends.map(t => <button key={t} className={`chip ${trend === t ? 'active' : ''}`} onClick={() => setTrend(t)}>{t}</button>)}
        <span style={{ flex: 1 }} />
        <button className={`chip ${watchOnly ? 'active' : ''}`} onClick={() => setWatchOnly(w => !w)}>
          <Ico.Star /> Watchlist only
        </button>
      </div>

      {/* Table */}
      <div className="card" style={{ padding: 0 }}>
        <div className="card-h">
          <div>
            <h3>{mLabel} · wholesale prices</h3>
            <span className="sub">{filtered.length} commodities · prices in <span className="mono">USD per unit</span> · USDA terminal market report</span>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <div className="search" style={{ maxWidth: 200 }}>
              <Ico.Search />
              <input value={searchQ} onChange={e => setSearchQ(e.target.value)} placeholder="Search…" />
              {searchQ && <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-dim)', padding: 0 }} onClick={() => setSearchQ('')}><Ico.X /></button>}
            </div>
            <button className="btn sm"><Ico.Download /> Export</button>
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead>
              <tr>
                <th style={{ width: 32 }}></th>
                <th className={`sortable ${sortKey === 'name' ? 'sorted' : ''}`} onClick={() => sortBy('name')}>Commodity <span className="sort-ind">{si('name')}</span></th>
                <th>Unit / Origin</th>
                <th className={`num sortable ${sortKey === 'low' ? 'sorted' : ''}`} onClick={() => sortBy('low')}>Low <span className="sort-ind">{si('low')}</span></th>
                <th className={`num sortable ${sortKey === 'high' ? 'sorted' : ''}`} onClick={() => sortBy('high')}>High <span className="sort-ind">{si('high')}</span></th>
                <th className={`num sortable ${sortKey === 'mostly' ? 'sorted' : ''}`} onClick={() => sortBy('mostly')}>Mostly <span className="sort-ind">{si('mostly')}</span></th>
                <th className={`num sortable ${sortKey === 'wow' ? 'sorted' : ''}`} onClick={() => sortBy('wow')}>WoW % <span className="sort-ind">{si('wow')}</span></th>
                <th>Supply</th>
                <th className="center">7-day</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const p = priceForMarket(c, market);
                return (
                  <tr key={c.id} onClick={() => onOpen(c.id)}>
                    <td><StarBtn on={!!watchlist[c.id]} onToggle={() => toggleWatch(c.id)} /></td>
                    <td>
                      <div style={{ fontWeight: 500 }}>{c.name}</div>
                      <div style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>{c.cat}</div>
                    </td>
                    <td className="muted" style={{ fontSize: 11.5 }}>{c.origins.slice(0, 2).join(', ')}</td>
                    <td className="num">${p.low.toFixed(2)}</td>
                    <td className="num">${p.high.toFixed(2)}</td>
                    <td className="num" style={{ fontWeight: 500 }}>${p.mostly.toFixed(2)}</td>
                    <td className="num"><Delta pct={c.wow} /></td>
                    <td><SupplyPill v={c.supply} /></td>
                    <td className="center"><Sparkline data={c.spark} w={70} h={20} /></td>
                  </tr>
                );
              })}
              {filtered.length === 0 && <tr><td colSpan={9} style={{ textAlign: 'center', padding: '40px', color: 'var(--text-muted)' }}>No commodities match your filters</td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{ padding: '10px 16px', borderTop: '1px solid var(--border-soft)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontSize: 11.5, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>{filtered.length} of {commodities.length} commodities · {fmtShort(todayStr)}</span>
        </div>
      </div>
    </div>
  );
}

// ─── Commodity Detail ─────────────────────────────────────────────────────────
function CommodityScreen({ c, market, setMarket, watchlist, toggleWatch, onBack, allComms, onOpen, todayStr }) {
  if (!c) return null;
  const p = priceForMarket(c, market);
  const spread = c.fobAvg ? c.mostly - c.fobAvg : null;

  const termMarkets = useMemo(() => {
    const byM = {};
    c.termRows.forEach(r => {
      const code = marketCodeFromName(r.market);
      if (!code) return;
      const info = TERMINALS.find(t => t.code === code);
      if (!info) return;
      if (!byM[code]) byM[code] = { code, city: info.city, region: info.region, prices: [], movement: null };
      byM[code].prices.push(parseFloat(r.price_low));
      if (r.movement) byM[code].movement = r.movement;
    });
    return Object.values(byM).map(m => ({
      ...m, low: Math.min(...m.prices), high: Math.max(...m.prices),
      mostly: m.prices.reduce((a, b) => a + b, 0) / m.prices.length,
    })).sort((a, b) => a.mostly - b.mostly);
  }, [c]);

  const idx = allComms.findIndex(x => x.id === c.id);
  const prevC = idx > 0 ? allComms[idx - 1] : null;
  const nextC = idx < allComms.length - 1 ? allComms[idx + 1] : null;

  return (
    <div className="page" style={{ maxWidth: 1480 }}>
      <div className="detail-nav">
        <button className="btn ghost sm" onClick={onBack}><Ico.ArrowL /> Back to Markets</button>
        <div style={{ flex: 1 }} />
        <div className="nav-arrows">
          <button className="btn icon sm" onClick={() => prevC && onOpen(prevC.id)} disabled={!prevC}><Ico.ChevL /></button>
          <span className="mono" style={{ fontSize: 11.5, color: 'var(--text-dim)', minWidth: 60, textAlign: 'center' }}>{idx + 1} of {allComms.length}</span>
          <button className="btn icon sm" onClick={() => nextC && onOpen(nextC.id)} disabled={!nextC}><Ico.ChevR /></button>
        </div>
      </div>

      <div className="page-h" style={{ alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
          <div style={{ width: 72, height: 72, borderRadius: 10, background: 'var(--accent-soft)', color: 'var(--accent)', display: 'grid', placeItems: 'center', fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 22, flexShrink: 0 }}>
            {c.name.slice(0, 2).toUpperCase()}
          </div>
          <div>
            <div className="hero-eyebrow" style={{ marginBottom: 6 }}>
              <span>{c.cat}</span>
              <span className="sep">·</span>
              <span>{c.origins.slice(0, 2).join(', ')}</span>
            </div>
            <h1 className="page-title" style={{ margin: 0, fontSize: 28 }}>{c.name}</h1>
            <div style={{ marginTop: 8, color: 'var(--text-muted)', fontSize: 12.5 }}>
              <strong style={{ color: 'var(--text)' }}>{fmtDate(todayStr)}</strong>
            </div>
          </div>
        </div>
        <div className="row gap-2">
          <button className={`btn sm ${watchlist[c.id] ? 'primary' : ''}`} onClick={() => toggleWatch(c.id)}>
            {watchlist[c.id] ? <><Ico.StarF /> Watching</> : <><Ico.Star /> Watch</>}
          </button>
          <button className="btn sm icon"><Ico.Download /></button>
        </div>
      </div>

      {/* KPIs */}
      <div className="card" style={{ display: 'flex', padding: 0, marginBottom: 18 }}>
        <div className="kpi" style={{ flex: 2 }}>
          <span className="l">Average price today</span>
          <span className="v lg num">${p.mostly.toFixed(2)}</span>
          <div className="d mono">
            Low <span style={{ color: 'var(--text)', fontWeight: 500 }}>${p.low.toFixed(2)}</span>
            <span style={{ margin: '0 6px', color: 'var(--text-dim)' }}>·</span>
            High <span style={{ color: 'var(--text)', fontWeight: 500 }}>${p.high.toFixed(2)}</span>
          </div>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">vs Last week</span>
          <span className="v num" style={{ fontSize: 18 }}><Delta pct={c.wow} /></span>
          <div className="d" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>Week-over-week</div>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">National range</span>
          <span className="v num" style={{ fontSize: 16 }}>${c.low.toFixed(2)} – ${c.high.toFixed(2)}</span>
          <span className="d mono" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>{termMarkets.length} terminals</span>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">FOB → Terminal spread</span>
          <span className="v num" style={{ fontSize: 18, color: spread && spread > 0 ? 'var(--positive)' : '' }}>
            {spread != null ? (spread >= 0 ? '+' : '') + '$' + Math.abs(spread).toFixed(2) : '—'}
          </span>
          <div className="d" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>{c.fobAvg ? `FOB avg $${c.fobAvg.toFixed(2)}` : 'No FOB data'}</div>
        </div>
        <div className="kpi" style={{ flex: 1 }}>
          <span className="l">Supply signal</span>
          <div style={{ marginTop: 4 }}><SupplyPill v={c.supply} /></div>
          <div className="d" style={{ color: 'var(--text-dim)', fontSize: 11.5 }}>From USDA report</div>
        </div>
      </div>

      {/* Supply chain band */}
      <div className="card sc-band" style={{ marginBottom: 18 }}>
        <div className="card-h"><h3>Supply chain — origin → wholesale</h3><span className="sub">FOB origin · transit · terminal market</span></div>
        <div className="sc-grid">
          <div className="sc-col">
            <div className="sc-col-h"><span className="sc-step">1</span><div><div className="sc-title">F.O.B. Origin</div><div className="sc-sub">Packing shed price</div></div></div>
            <div className="sc-rows">
              {c.fobRows.slice(0, 4).map((r, i) => (
                <div key={i} className="sc-row">
                  <div className="sc-row-l"><div className="sc-row-name">{r.origin || r.market || '—'}</div><div className="sc-row-meta">{r.variety || 'Standard'}</div></div>
                  <div className="sc-row-r"><span className="sc-row-val">${parseFloat(r.price_low).toFixed(2)}</span></div>
                </div>
              ))}
              {c.fobRows.length === 0 && <div style={{ color: 'var(--text-dim)', fontSize: 12 }}>No FOB data</div>}
            </div>
            <div className="sc-foot"><span>Avg</span><span className="mono" style={{ fontWeight: 500 }}>{c.fobAvg ? '$' + c.fobAvg.toFixed(2) : '—'}</span></div>
          </div>
          <div className="sc-arrow"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></div>
          <div className="sc-col">
            <div className="sc-col-h"><span className="sc-step">2</span><div><div className="sc-title">Transit</div><div className="sc-sub">Freight + handling</div></div></div>
            <div className="sc-rows" style={{ justifyContent: 'center' }}>
              <div style={{ color: 'var(--text-dim)', fontSize: 12.5, lineHeight: 1.6, marginTop: 8 }}>
                {spread != null ? (
                  <>FOB-to-terminal gross spread: <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, color: spread > 0 ? 'var(--positive)' : 'var(--negative)' }}>{spread >= 0 ? '+' : ''}${spread.toFixed(2)}</span></>
                ) : 'Freight included in terminal price. FOB data not available for this commodity.'}
              </div>
            </div>
          </div>
          <div className="sc-arrow"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></div>
          <div className="sc-col">
            <div className="sc-col-h"><span className="sc-step">3</span><div><div className="sc-title">Terminal Market</div><div className="sc-sub">Wholesale landed price</div></div></div>
            <div className="sc-rows">
              {termMarkets.slice(0, 4).map((m, i) => (
                <div key={i} className="sc-row">
                  <div className="sc-row-l"><div className="sc-row-name">{m.city}</div><div className="sc-row-meta">{m.region}</div></div>
                  <div className="sc-row-r"><span className="sc-row-val">${m.mostly.toFixed(2)}</span></div>
                </div>
              ))}
            </div>
            <div className="sc-foot"><span>National avg</span><span className="mono" style={{ fontWeight: 500 }}>${c.mostly.toFixed(2)}</span></div>
          </div>
        </div>
        {c.supplyNote && <div className="sc-reading"><p className="sc-reading-text">{c.supplyNote}</p></div>}
      </div>

      {/* Terminal markets table */}
      <div className="card" style={{ marginBottom: 18 }}>
        <div className="card-h"><h3>All terminal markets · {fmtShort(todayStr)}</h3><span className="sub">{termMarkets.length} cities reporting</span></div>
        <div style={{ overflowX: 'auto' }}>
          <table className="dt">
            <thead><tr>
              <th>City</th><th>Region</th>
              <th className="num">Low</th><th className="num">High</th><th className="num">Mostly</th>
              <th>Movement</th>
            </tr></thead>
            <tbody>
              {termMarkets.map(m => (
                <tr key={m.code} className={m.code === market ? 'is-selected' : ''}>
                  <td><div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    {m.code === market && <Ico.Bullet style={{ width: 8, height: 8, color: 'var(--accent)' }} />}
                    <span style={{ fontWeight: 500 }}>{m.city}</span>
                  </div></td>
                  <td className="muted">{m.region}</td>
                  <td className="num">${m.low.toFixed(2)}</td>
                  <td className="num">${m.high.toFixed(2)}</td>
                  <td className="num" style={{ fontWeight: 500 }}>${m.mostly.toFixed(2)}</td>
                  <td><SupplyPill v={m.movement} /></td>
                </tr>
              ))}
              {termMarkets.length === 0 && <tr><td colSpan={6} style={{ textAlign: 'center', padding: 32, color: 'var(--text-muted)' }}>No terminal data</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {/* FOB table */}
      {c.fobRows.length > 0 && (
        <div className="card">
          <div className="card-h"><h3>Shipping-point / FOB origin prices</h3><span className="sub">Free-on-board at packing shed</span></div>
          <div style={{ overflowX: 'auto' }}>
            <table className="dt">
              <thead><tr><th>Origin</th><th>Variety / Package</th><th className="num">FOB Low</th><th className="num">FOB High</th><th>Movement</th></tr></thead>
              <tbody>
                {c.fobRows.map((r, i) => (
                  <tr key={i}>
                    <td style={{ fontWeight: 500 }}>{r.origin || r.market || '—'}</td>
                    <td className="muted" style={{ fontSize: 12 }}>{[r.variety, r.package].filter(Boolean).join(' · ') || '—'}</td>
                    <td className="num">${parseFloat(r.price_low).toFixed(2)}</td>
                    <td className="num">{r.price_high ? '$' + parseFloat(r.price_high).toFixed(2) : '—'}</td>
                    <td><SupplyPill v={r.movement} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Search Overlay ───────────────────────────────────────────────────────────
function SearchOverlay({ commodities, onClose, onOpen }) {
  const [q, setQ] = useState('');
  const [active, setActive] = useState(0);
  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  const results = useMemo(() => {
    if (!q.trim()) return commodities.slice(0, 8);
    const ql = q.toLowerCase();
    return commodities.filter(c => c.name.toLowerCase().includes(ql) || c.cat.toLowerCase().includes(ql) || c.origins.some(o => o.toLowerCase().includes(ql)));
  }, [q, commodities]);
  useEffect(() => { setActive(0); }, [q]);
  function onKey(e) {
    if (e.key === 'Escape') onClose();
    else if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(results.length - 1, a + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(0, a - 1)); }
    else if (e.key === 'Enter' && results[active]) onOpen(results[active].id);
  }
  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="panel" onClick={e => e.stopPropagation()}>
        <div className="field">
          <Ico.Search />
          <input ref={ref} value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey} placeholder="Search commodities, origins…" />
          <kbd>esc</kbd>
        </div>
        <div className="results">
          <div className="group-h">{q ? `${results.length} results` : 'Top movers today'}</div>
          {results.map((c, i) => (
            <div key={c.id} className={`result ${i === active ? 'active' : ''}`} onMouseEnter={() => setActive(i)} onClick={() => onOpen(c.id)}>
              <span className="mono" style={{ fontSize: 10, color: 'var(--text-dim)', minWidth: 80, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{c.cat}</span>
              <div><div className="cmd-name">{c.name}</div><div className="cmd-cat">{c.origins.slice(0, 2).join(', ')}</div></div>
              <div className="cmd-price" style={{ textAlign: 'right' }}>
                <div className="num" style={{ fontWeight: 500 }}>${c.mostly.toFixed(2)}</div>
                <Delta pct={c.wow} />
              </div>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', padding: '8px 18px', borderTop: '1px solid var(--border)', gap: 16, fontSize: 11, color: 'var(--text-dim)' }}>
          <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>
  );
}

// ─── Loading ──────────────────────────────────────────────────────────────────
function LoadingScreen() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 16, background: 'var(--bg)' }}>
      <div style={{ width: 40, height: 40, borderRadius: 8, background: 'var(--accent)', display: 'grid', placeItems: 'center', color: 'white', fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 18 }}>a</div>
      <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>Loading USDA market data…</div>
      <style>{`@keyframes lb{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}`}</style>
      <div style={{ width: 180, height: 3, background: 'var(--bg-2)', borderRadius: 99, overflow: 'hidden' }}>
        <div style={{ height: '100%', background: 'var(--accent)', borderRadius: 99, animation: 'lb 1.4s ease-in-out infinite' }} />
      </div>
    </div>
  );
}

// ─── Root App ─────────────────────────────────────────────────────────────────
function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [todayStr, setTodayStr] = useState('');
  const [allRows, setAllRows] = useState([]);
  const [commodities, setCommodities] = useState([]);
  const [route, setRoute] = useState('commodities');
  const [openId, setOpenId] = useState(null);
  const [catFilter, setCatFilter] = useState(null);
  const [market, setMarket] = useState('NYC');
  const [watchlist, setWatchlist] = useState({});
  const [searchOpen, setSearchOpen] = useState(false);
  const [dark, setDark] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const isMobile = () => window.innerWidth <= 768;
  const [density, setDensity] = useState('regular');

  // Sidebar tree state
  const [commOpen, setCommOpen] = useState(true);
  const [termOpen, setTermOpen] = useState(false);
  const [openCats, setOpenCats] = useState({ Fruits: true, Vegetables: false, 'Onions & Potatoes': false, Nuts: false });

  useEffect(() => {
    // Show/hide mobile nav based on screen width
    const bar = document.getElementById('mob-nav-bar');
    function checkMob() { if (bar) bar.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; }
    checkMob();
    window.addEventListener('resize', checkMob);
    return () => window.removeEventListener('resize', checkMob);
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-density', density);
  }, [dark, density]);

  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearchOpen(true); }
      if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); setSearchOpen(true); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => {
    async function load() {
      try {
        const dates = await fetch(`${API}/dates`).then(r => r.json());
        if (!dates.length) throw new Error('No dates available');
        const today = dates[0].date;
        setTodayStr(today);
        const rows = await fetch(`${API}/commodities/by-date/${today}`).then(r => r.json());
        setAllRows(rows);
        let prev = [];
        if (dates.length > 1) {
          const prevDate = dates[Math.min(6, dates.length - 1)].date;
          prev = await fetch(`${API}/commodities/by-date/${prevDate}`).then(r => r.json()).catch(() => []);
        }
        setCommodities(buildCommodities(rows, prev));
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  function toggleWatch(id) { setWatchlist(w => { const n = { ...w }; n[id] ? delete n[id] : (n[id] = true); return n; }); }
  function openCommodity(id) { setSearchOpen(false); setOpenId(id); setRoute('commodity'); }
  function goToCategory(cat) { setCatFilter(cat); setRoute('commodities'); setOpenId(null); }

  const openComm = useMemo(() => route === 'commodity' && openId ? commodities.find(c => c.id === openId) || null : null, [openId, route, commodities]);
  const watchCount = Object.keys(watchlist).length;

  // Build commodity tree by category
  const commTree = useMemo(() => {
    const tree = { Fruits: [], Vegetables: [], 'Onions & Potatoes': [], Nuts: [] };
    const seen = { Fruits: new Set(), Vegetables: new Set(), 'Onions & Potatoes': new Set(), Nuts: new Set() };
    [...commodities].sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
      if (!tree[c.cat]) return;
      if (seen[c.cat].has(c.name)) return;
      seen[c.cat].add(c.name);
      tree[c.cat].push({ name: c.name, id: c.id });
    });
    return tree;
  }, [commodities]);

  // Sync bottom nav active state
  useEffect(() => {
    const map = {
      commodities: 'mnb-home', today: 'mnb-home', commodity: 'mnb-home',
      watchlist: 'mnb-watch', shipping: 'mnb-ship'
    };
    ['mnb-home','mnb-search','mnb-watch','mnb-ship','mnb-menu'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('active', map[route] === id);
    });
  }, [route]);

  const crumbs = route === 'commodity' && openComm
    ? [{ label: 'Commodities', onClick: () => { setRoute('commodities'); setOpenId(null); } }, { label: openComm.name }]
    : route === 'watchlist' ? [{ label: 'Watchlist' }]
    : route === 'shipping' ? [{ label: 'Shipping Points' }]
    : [{ label: 'Commodities' }];

  if (loading) return <LoadingScreen />;
  if (error) return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: 16 }}>
      <div style={{ color: 'var(--negative)', fontWeight: 600 }}>Failed to load USDA data</div>
      <div style={{ color: 'var(--text-muted)', fontSize: 12 }}>{error}</div>
      <button className="btn primary" onClick={() => window.location.reload()}><Ico.Refresh /> Retry</button>
    </div>
  );

  return (
    <div className="app">
      {/* Brand */}
      <div className="brand" style={{ cursor: 'pointer' }} onClick={() => { setRoute('commodities'); setOpenId(null); }}>
        <div className="logo">a</div>
        <div className="wm">agra<span className="x">X</span></div>
      </div>

      {/* Topbar */}
      <div className="topbar">
        <div className="crumbs">
          {crumbs.map((b, i) => (
            <React.Fragment key={i}>
              {i > 0 && <span className="sep">/</span>}
              {b.onClick ? <button className="crumb-link" onClick={b.onClick}>{b.label}</button> : <span style={{ color: 'var(--text)', fontWeight: 500 }}>{b.label}</span>}
            </React.Fragment>
          ))}
        </div>
        <div className="spacer" />
        <button className="search" onClick={() => setSearchOpen(true)} style={{ background: 'var(--bg)' }}>
          <Ico.Search />
          <input readOnly placeholder="Search commodities… ⌘K" style={{ pointerEvents: 'none' }} />
          <kbd>⌘K</kbd>
        </button>
        {/* Dark mode + density */}
        <button className="btn ghost sm icon" onClick={() => setDark(d => !d)} title="Toggle dark mode"><Ico.Sun /></button>
        <div className="seg">
          {['compact','regular','spacious'].map(d => (
            <button key={d} className={density === d ? 'on' : ''} onClick={() => setDensity(d)} title={d}>{d[0].toUpperCase()}</button>
          ))}
        </div>
      </div>

      {/* Sidenav */}
      <nav className="sidenav">
        <div className="nav-section">Home</div>
        <button className={`nav-item ${route === 'today' ? 'active' : ''}`} onClick={() => { setRoute('commodities'); setOpenId(null); setCatFilter(null); }}>
          <span className="ico"><Ico.Sun /></span>Today
        </button>

        <div className="nav-section">Explore</div>

        {/* Commodities expandable */}
        <button className={`nav-item ${(route === 'commodities' || route === 'commodity') ? 'active' : ''}`}
          onClick={() => { setRoute('commodities'); setOpenId(null); setCatFilter(null); }}>
          <span className="ico"><Ico.Grid /></span>
          <span>Commodities</span>
          <span className={`nav-chevron ${commOpen ? 'open' : ''}`}
            onClick={e => { e.stopPropagation(); setCommOpen(o => !o); }}>
            <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M4 3l4 3-4 3" /></svg>
          </span>
        </button>

        {commOpen && (
          <div className="nav-tree">
            {['Fruits', 'Vegetables', 'Onions & Potatoes', 'Nuts'].map(cat => {
              const items = commTree[cat] || [];
              const catActive = route === 'commodities' && catFilter === cat;
              const isOpen = openCats[cat];
              return (
                <div key={cat} className="nav-tree-group">
                  <button className={`nav-sub-item cat ${catActive ? 'active' : ''}`}
                    onClick={() => goToCategory(cat)}>
                    <span className={`tree-chevron ${isOpen ? 'open' : ''}`}
                      onClick={e => { e.stopPropagation(); setOpenCats(o => ({ ...o, [cat]: !o[cat] })); }}>
                      <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M4 3l4 3-4 3" /></svg>
                    </span>
                    <span className="cat-label">{cat}</span>
                    <span className="cat-count">{items.length}</span>
                  </button>
                  {isOpen && (
                    <div className="nav-tree-children">
                      {items.map(it => {
                        const isActive = route === 'commodity' && openId && commodities.find(c => c.id === openId)?.name === it.name;
                        return (
                          <button key={it.id} className={`nav-sub-item leaf ${isActive ? 'active' : ''}`}
                            onClick={() => openCommodity(it.id)} title={it.name}>
                            <span className="leaf-tick" />
                            <span className="leaf-label">{it.name}</span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* Terminal markets expandable */}
        <button className={`nav-item ${route === 'terminals' ? 'active' : ''}`}
          onClick={() => setTermOpen(o => !o)}>
          <span className="ico"><Ico.Map /></span>
          <span>Terminal markets</span>
          <span className={`nav-chevron ${termOpen ? 'open' : ''}`}
            onClick={e => { e.stopPropagation(); setTermOpen(o => !o); }}>
            <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M4 3l4 3-4 3" /></svg>
          </span>
        </button>
        {termOpen && (
          <div className="nav-tree">
            <div className="nav-tree-children" style={{ paddingLeft: 4 }}>
              {TERMINALS.slice(1).map(t => (
                <button key={t.code} className={`nav-sub-item leaf ${market === t.code ? 'active' : ''}`}
                  onClick={() => { setMarket(t.code); setRoute('commodities'); setCatFilter(null); }}>
                  <span className="leaf-tick" />
                  <span className="leaf-label">{t.city}, {t.state}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        <button className={`nav-item ${route === 'shipping' ? 'active' : ''}`} onClick={() => setRoute('shipping')}>
          <span className="ico"><Ico.Truck /></span>Shipping points
        </button>

        <div className="nav-section">Workspace</div>
        <button className={`nav-item ${route === 'watchlist' ? 'active' : ''}`} onClick={() => setRoute('watchlist')}>
          <span className="ico"><Ico.Star /></span>
          <span>Watchlist</span>
          {watchCount > 0 && <span className="badge">{watchCount}</span>}
        </button>

        {/* USDA wire footer */}
        <div style={{ marginTop: 'auto', padding: '14px 8px 6px', borderTop: '1px solid var(--border-soft)' }}>
          <div className="label-eyebrow" style={{ padding: '0 6px 8px', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--positive)', flexShrink: 0 }} />
            USDA AMS Live
          </div>
          <div style={{ padding: '0 6px', fontSize: 11.5, color: 'var(--text-muted)', lineHeight: 1.6 }}>
            <div>{commodities.length} commodities</div>
            <div style={{ color: 'var(--text-dim)', fontSize: 11, fontFamily: 'var(--font-mono)', marginTop: 2 }}>{fmtShort(todayStr)}</div>
          </div>
        </div>
      </nav>

      {/* Main */}
      <main className="main">
        {(route === 'commodities' || route === 'today') && (
          <MarketsScreen commodities={commodities} market={market} setMarket={setMarket}
            watchlist={watchlist} toggleWatch={toggleWatch} onOpen={openCommodity}
            todayStr={todayStr} catFilter={catFilter} />
        )}
        {route === 'commodity' && openComm && (
          <CommodityScreen c={openComm} market={market} setMarket={setMarket}
            watchlist={watchlist} toggleWatch={toggleWatch}
            onBack={() => { setRoute('commodities'); setOpenId(null); }}
            allComms={commodities} onOpen={openCommodity} todayStr={todayStr} />
        )}
        {route === 'watchlist' && (
          <WatchlistScreen commodities={commodities} watchlist={watchlist}
            toggleWatch={toggleWatch} onOpen={openCommodity} market={market} todayStr={todayStr} />
        )}
        {route === 'shipping' && (
          <ShippingScreen allRows={allRows} todayStr={todayStr} onOpen={openCommodity} />
        )}
      </main>

      {/* Status bar */}
      <div className="statusbar">
        <span><span className="dot" />Connected · USDA AMS</span>
        <span className="sep">|</span>
        <span>{fmtShort(todayStr)}</span>
        <span className="sep">|</span>
        <span>{commodities.length} commodities · {allRows.filter(r => r.market_type === 'terminal').length} terminal listings</span>
      </div>

      {/* Mobile bottom nav */}
      <div className="mob-nav" style={{ display: 'none' }} id="mob-nav-bar">
        <button className="mob-nav-btn" id="mnb-home" onClick={() => { setRoute('commodities'); setOpenId(null); setCatFilter(null); }}>
          <Ico.Grid />
          Markets
        </button>
        <button className="mob-nav-btn" id="mnb-search" onClick={() => setSearchOpen(true)}>
          <Ico.Search />
          Search
        </button>
        <button className="mob-nav-btn" id="mnb-watch" onClick={() => setRoute('watchlist')} style={{ position: 'relative' }}>
          <Ico.Star />
          Watchlist
          {watchCount > 0 && <span className="mob-nav-badge">{watchCount}</span>}
        </button>
        <button className="mob-nav-btn" id="mnb-ship" onClick={() => setRoute('shipping')}>
          <Ico.Truck />
          Shipping
        </button>
        <button className="mob-nav-btn" id="mnb-menu" onClick={() => setDrawerOpen(true)}>
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
          More
        </button>
      </div>

      {/* Mobile drawer */}
      {drawerOpen && (
        <div className="mob-drawer-overlay" onClick={() => setDrawerOpen(false)}>
          <div className="mob-drawer" onClick={e => e.stopPropagation()}>
            <div className="mob-drawer-header">
              <span className="mob-drawer-logo">agra<span>X</span></span>
              <button className="mob-drawer-close" onClick={() => setDrawerOpen(false)}><Ico.X /></button>
            </div>
            <div className="nav-section">Markets</div>
            {['Fruits','Vegetables','Onions & Potatoes','Nuts'].map(cat => (
              <button key={cat} className="nav-item" onClick={() => { goToCategory(cat); setDrawerOpen(false); }}>
                <span className="ico"><Ico.Grid /></span>{cat}
                <span className="cat-count" style={{ marginLeft: 'auto' }}>{(commTree[cat]||[]).length}</span>
              </button>
            ))}
            <div className="nav-section" style={{ marginTop: 8 }}>Terminal city</div>
            {TERMINALS.slice(1).map(t => (
              <button key={t.code} className={`nav-item ${market === t.code ? 'active' : ''}`}
                onClick={() => { setMarket(t.code); setRoute('commodities'); setDrawerOpen(false); }}>
                <span className="ico"><Ico.Map /></span>{t.city}, {t.state}
              </button>
            ))}
            <div className="nav-section" style={{ marginTop: 8 }}>Settings</div>
            <button className="nav-item" onClick={() => { setDark(d => !d); }}>
              <span className="ico"><Ico.Sun /></span>{dark ? 'Light mode' : 'Dark mode'}
            </button>
            <div style={{ padding: '6px 8px', marginTop: 4 }}>
              <div className="label-eyebrow" style={{ marginBottom: 6 }}>Density</div>
              <div className="seg">
                {['compact','regular','spacious'].map(d => (
                  <button key={d} className={density === d ? 'on' : ''} onClick={() => setDensity(d)}>{d[0].toUpperCase()}</button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {searchOpen && <SearchOverlay commodities={commodities} onClose={() => setSearchOpen(false)} onOpen={openCommodity} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
