name: Daily Data Update

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 9am ET (13:00 UTC)  — catch early publishers
    - cron: '0 16 * * 1-5'  # 12pm ET (16:00 UTC) — catch mid-morning reports
    - cron: '0 20 * * 1-5'  # 4pm ET  (20:00 UTC) — catch late afternoon reports
  workflow_dispatch:          # allows manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run ingestion
        env:
          NEWSLETTER_PREPARE_ENABLED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARS_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          cd backend
          python ingest.py

      # ingest_movement.py existed but nothing ever ran it, so produce_movement
      # stayed empty and every volume bar in the UI rendered blank.
      # continue-on-error: prices are the product; a movement failure should
      # not fail a run that already loaded them successfully.
      # FDA recalls. continue-on-error for the same reason as movement:
      # prices are the product and must not fail on a secondary source.
      - name: Run recall ingestion
        id: recalls
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python ingest_recalls.py

      - name: Run movement ingestion
        id: movement
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARS_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          cd backend
          python ingest_movement.py

      - name: Surface secondary ingestion failures
        if: always() && (steps.recalls.outcome == 'failure' || steps.movement.outcome == 'failure')
        run: |
          echo "Movement or recall ingestion failed. Price ingestion has its own result above."
          exit 1
