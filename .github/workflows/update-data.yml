name: Daily Data Update

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 5:30 AM ET (09:30 UTC)
    - cron: '0 11 * * 1-5'   # 7:00 AM ET (11:00 UTC)
    - cron: '0 16 * * 1-5'   # 12:00 PM ET (16:00 UTC)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run price ingestion (terminal + shipping point + gap backfill)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARS_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          cd backend
          python ingest.py

      - name: Run movement ingestion (shipment volumes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARS_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          cd backend
          python ingest_movement.py
        continue-on-error: true  # Don't fail the whole run if movement fails
